<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EDIT SKATER</title>

<style>
:root {
  --bg: #0a0d10;
  --panel: rgba(20, 25, 30, 0.9);
  --accent: #7df9ff;
  --disabled: #444;
  --text: #cfd6dc;
}

* {
  box-sizing: border-box;
  font-family: "Courier New", monospace;
}

body {
  margin: 0;
  background: black;
  color: var(--text);
  overflow: hidden;
}

/* BACKGROUND VIDEO */
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter:
    contrast(1.3)
    brightness(0.5)
    saturate(0)
    hue-rotate(20deg);
  z-index: -2;
}

/* VIDEO GLITCH LAYER */
#video-glitch {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  mix-blend-mode: overlay;
  animation: scan 6s linear infinite;
  z-index: -1;
}

@keyframes scan {
  from { background-position-y: 0; }
  to { background-position-y: 100%; }
}

/* TERMINAL PANEL */
#terminal {
  width: 420px;
  margin: 8vh auto;
  padding: 20px;
  background: var(--panel);
  border: 1px solid #222;
  box-shadow: 0 0 30px rgba(125,249,255,0.15);
}

h1 {
  font-size: 18px;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 20px;
}

/* BUTTONS */
.menu-btn {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 12px;
  text-align: left;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.menu-btn:hover {
  background: rgba(125,249,255,0.1);
  transform: translateX(4px);
}

.menu-btn.disabled {
  border-color: var(--disabled);
  color: var(--disabled);
  cursor: not-allowed;
}

.menu-btn.disabled:hover {
  background: transparent;
  transform: none;
}

/* FOOTER */
.footer {
  margin-top: 20px;
  font-size: 11px;
  opacity: 0.6;
}
</style>
</head>

<body>

<!-- GLITCH VIDEO -->
<video id="bg-video" autoplay muted loop>
  <source src="videos/mainmenudemo.mp4" type="video/mp4">
</video>
<div id="video-glitch"></div>

<!-- MUSIC -->
<audio autoplay loop>
  <source src="media/bg-music.mp3" type="audio/mpeg">
</audio>

<!-- TERMINAL -->
<div id="terminal">
  <h1>EDIT SKATER</h1>

  <button class="menu-btn" onclick="go('skateboard_editor.html')">
    ▸ Skateboard
  </button>

  <button class="menu-btn" onclick="go('helmet_editor.html')">
    ▸ Helmet
  </button>

  <button class="menu-btn" onclick="go('jacket_editor.html')">
    ▸ Jacket
  </button>

  <button class="menu-btn" onclick="go('level_editor.html')">
    ▸ Level Editor
  </button>

  <button class="menu-btn" onclick="go('level_editor.html')">
    ▸ Archetecture
  </button>

  <button class="menu-btn disabled">
    ▸ Weapons [LOCKED]
  </button>

  <button class="menu-btn disabled">
    ▸ Pants [LOCKED]
  </button>

  <button class="menu-btn disabled">
    ▸ Shoes [LOCKED]
  </button>

  <div class="footer">
    TERMINAL STATUS: STABLE ░▒▓
  </div>
</div>

<script>
function go(page) {
  window.location.href = page;
}

/* subtle glitch jitter */
setInterval(() => {
  const t = document.getElementById("terminal");
  t.style.transform =
    `translate(${Math.random()*2}px, ${Math.random()*2}px)`;
  setTimeout(() => t.style.transform = "none", 40);
}, 4000);
</script>

</body>
</html>
