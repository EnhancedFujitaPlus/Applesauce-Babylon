<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Applesauce - Gradient Core</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ff00; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">CORE: APPLESAUCE_v1.1<br>STATUS: ROLLING</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.182.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- THE TERRAIN FUNCTION ---
        // A minimalist "skatepark" generated by math
        function getTerrainHeight(x, z) {
            // Overlapping waves create "bowls" and "hips"
            const wave1 = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3;
            const wave2 = Math.sin(x * 0.05 + z * 0.05) * 2;
            return wave1 + wave2;

            if (Math.random() > 0.999) return 50; // A sudden, violent vertical pillar
        }

        // --- GRADIENT CALCULATION ---
        function getSlopeData(x, z) {
            const e = 0.01; // Epsilon (tiny offset)
            const dx = getTerrainHeight(x + e, z) - getTerrainHeight(x - e, z);
            const dz = getTerrainHeight(x, z + e) - getTerrainHeight(x, z - e);
            
            return {
                direction: Math.atan2(dz, dx),
                angle: Math.sqrt(dx * dx + dz * dz) * 10 // Multiplier for "feel"
            };
        }

        function getCorruptedSlope(x, z) {
            const base = getSlopeData(x, z);

            // The terrain sharpens when ego outruns control
            const corruption = Math.min(ego * 0.05 + risk * 0.1, 2.5);

            return {
                direction: base.direction + Math.sin(ego + x * 0.01) * 0.1,
                angle: base.angle * (1 + corruption)
            };
        }

        // --- VISUALS ---
        // Create a grid mesh that matches our height function
        const geo = new THREE.PlaneGeometry(200, 200, 100, 100);
        geo.rotateX(-Math.PI / 2);
        const vertices = geo.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            vertices[i + 1] = getTerrainHeight(vertices[i], vertices[i + 2]);
        }
        const terrain = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true }));
        scene.add(terrain);

        const skater = new THREE.Mesh(
            new THREE.BoxGeometry(1, 0.2, 2),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        scene.add(skater);

        // --- PHYSICS STATE ---
        let pos = new THREE.Vector3(0, 10, 0);
        let vel = new THREE.Vector3(0, 0, 0);
        const input = { x: 0, z: 0 };
        const accel = 30, friction = 0.8, gravity = 20, maxSpeed = 250, slopeInfluence = 80;

        // --- PSYCHOLOGICAL STATE ---
        let risk = 0;          // Hidden meter
        let ego = 0;           // Player confidence inferred from behavior
        let helmetOn = false;  // Toggle later via UI or start state

        function updateRisk(dt, speed, airtime) {
            // Speed without helmet increases risk exponentially
            if (!helmetOn) {
                risk += Math.pow(speed / maxSpeed, 2) * dt * 0.8;
                ego  += speed * dt * 0.02;
            } else {
                risk *= 0.98; // Helmet calms the system
                ego  *= 0.95;
            }

            // Airtime feeds ego more than risk
            ego += airtime * dt * 0.5;

            // Risk decays slowly, ego does not
            risk = Math.max(0, risk - dt * 0.1);
        }

        function renderTelemetry(dt) {
            if (impactFlash > 0) {
                impactFlash -= dt;
                ui.innerHTML =
                    `CORE: APPLESAUCE_v1.1<br>` +
                    `ANGULAR DECEL: ${lastTelemetry.decel}<br>` +
                    `HELMET: ${lastTelemetry.helmet}<br>` +
                    `${lastTelemetry.note}`;
            } else {
                ui.innerHTML = "CORE: APPLESAUCE_v1.1<br>STATUS: ROLLING";
            }
        }


                let impactFlash = 0;

        function checkImpact(prevVelY, currentVelY) {
            const impactForce = Math.abs(prevVelY - currentVelY);

            if (impactForce > 18 && !helmetOn) {
                impactFlash = 0.15;
                lastTelemetry = {
                    decel: Math.round(impactForce * 320),
                    helmet: "ABSENT",
                    note: "TRAUMATIC SIMILARITY DETECTED"
                };
            }
        }

                let stillness = 0;
        let cathedralUnlocked = false;

        function updateStillness(dt, speed) {
            if (speed < 5 && Math.abs(input.x) + Math.abs(input.z) > 0) {
                stillness += dt;
            } else {
                stillness *= 0.95;
            }

            if (stillness > 12 && !cathedralUnlocked) {
                cathedralUnlocked = true;
                warpTerrainIntoCathedral();
            }
        }

        function warpTerrainIntoCathedral() {
            const verts = terrain.geometry.attributes.position.array;

            for (let i = 0; i < verts.length; i += 3) {
                const x = verts[i];
                const z = verts[i + 2];

                const radius = Math.sqrt(x*x + z*z);
                if (radius < 40) {
                    verts[i + 1] =
                        Math.pow(Math.cos(radius * 0.05), 3) * 18 +
                        Math.sin(x * 0.02) * 2;
                }
            }

            terrain.geometry.attributes.position.needsUpdate = true;
        }

        function applyPerception() {
            if (!helmetOn) {
                camera.fov = 75 + Math.sin(performance.now() * 0.002) * ego * 0.5;
            } else {
                camera.fov = THREE.MathUtils.lerp(camera.fov, 75, 0.05);
            }
            camera.updateProjectionMatrix();
        }

        function checkArchiveCondition() {
            if (!helmetOn && risk > 8 && ego > 6) {
                input.x = 0;
                input.z = 0;
                accel = 0;

                ui.innerHTML =
                    "STATUS: ROLLING<br>" +
                    "ARCHIVE FLAG: TRUE<br>" +
                    "SUBJECT MOTION PRESERVED";

                camera.position.lerp(
                    new THREE.Vector3(pos.x, pos.y + 40, pos.z),
                    0.01
                );
            }
        }


        // --- CONTROLS ---
        window.onkeydown = (e) => {
            if(e.key === 'w') input.z = -1; if(e.key === 's') input.z = 1;
            if(e.key === 'a') input.x = -1; if(e.key === 'd') input.x = 1;
        };
        window.onkeyup = (e) => {
            if(['w','s'].includes(e.key)) input.z = 0;
            if(['a','d'].includes(e.key)) input.x = 0;
        };

        // --- LOOP ---
        let last = performance.now();
        function loop() {
            requestAnimationFrame(loop);
            const dt = Math.min((performance.now() - last) / 1000, 0.1);
            last = performance.now();

            // 1. Basic Movement (User Input)
            vel.x += input.x * accel * dt;
            vel.z += input.z * accel * dt;

            // 2. Friction & Gravity
            vel.x *= (1 - friction * dt);
            vel.z *= (1 - friction * dt);
            vel.y -= gravity * dt;

            const slope = getCorruptedSlope(pos.x, pos.z);

            // 3. Speed Limit (Normalized)
            const speed = Math.sqrt(vel.x**2 + vel.z**2);
            if (speed > maxSpeed) {
                vel.x = (vel.x / speed) * maxSpeed;
                vel.z = (vel.z / speed) * maxSpeed;
            }

            // 4. Position Update
            pos.x += vel.x * dt;
            pos.y += vel.y * dt;
            pos.z += vel.z * dt;

            // 5. Terrain Following
            const groundY = getTerrainHeight(pos.x, pos.z);
            if (pos.y <= groundY) {
                pos.y = groundY;
                vel.y = 0;

                // 6. Slope Influence (The "Soul" of the game)
                const slope = getSlopeData(pos.x, pos.z);
                // We push the velocity AWAY from the high point (downhill)
                vel.x -= Math.cos(slope.direction) * slope.angle * slopeInfluence * dt;
                vel.z -= Math.sin(slope.direction) * slope.angle * slopeInfluence * dt;
            }

            // Update Mesh & Camera
            skater.position.copy(pos);
            skater.rotation.y = Math.atan2(-vel.x, -vel.z); // Face movement direction
            
            camera.position.lerp(new THREE.Vector3(pos.x, pos.y + 8, pos.z + 15), 0.1);
            camera.lookAt(pos);

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
