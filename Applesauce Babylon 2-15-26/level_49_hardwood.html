<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL 10 - THE HAUNTED FOREST (HAVOK EDITION)</title>
    
    <!-- Babylon.js + Havok -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #renderCanvas { width: 100%; height: 100vh; display: block; }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #7CFC00;
            z-index: 100;
            text-shadow: 3px 3px 0 #000;
            font-size: 48px;
            transition: color 0.5s;
        }
        
        #hud.haunted {
            color: #FF0000;
            animation: glitch 0.3s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { text-shadow: 3px 3px 0 #000; }
            25% { text-shadow: -3px 3px 0 #F00; }
            50% { text-shadow: 3px -3px 0 #0F0; }
            75% { text-shadow: -3px -3px 0 #00F; }
        }
        
        #score { position: absolute; top: 90px; left: 20px; color: #FFD700; z-index: 100; text-shadow: 3px 3px 0 #000; font-size: 36px; }
        #objective { position: absolute; top: 140px; left: 20px; color: #FFA500; z-index: 100; text-shadow: 3px 3px 0 #000; font-size: 24px; }
        #stats { position: absolute; top: 190px; left: 20px; color: #AAA; z-index: 100; text-shadow: 2px 2px 0 #000; font-size: 18px; font-family: 'Courier New', monospace; }
        
        #controls {
            position: absolute; bottom: 20px; left: 20px; color: #fff; background: rgba(0, 0, 0, 0.7);
            padding: 15px; border-radius: 10px; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.6;
        }
        
        #speechBubble {
            position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95); border: 4px solid #000; border-radius: 20px;
            padding: 25px 30px; max-width: 400px; display: none; z-index: 150;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5);
        }
        
        #speechBubble.active { display: block; animation: bubblePop 0.3s ease-out; }
        
        @keyframes bubblePop {
            0% { transform: translateY(-50%) scale(0); }
            60% { transform: translateY(-50%) scale(1.1); }
            100% { transform: translateY(-50%) scale(1); }
        }
        
        #speakerName { font-size: 24px; color: #000; font-weight: bold; margin-bottom: 10px; text-shadow: none; }
        #speechText { font-size: 18px; color: #000; line-height: 1.5; font-family: Arial, sans-serif; text-shadow: none; }
        
        #interactPrompt {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            color: #FFD700; font-size: 24px; text-shadow: 3px 3px 0 #000;
            display: none; z-index: 100; animation: bounce 0.5s infinite alternate;
        }
        
        @keyframes bounce {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-10px); }
        }
        
        #warningText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #FF0000; font-size: 64px; text-shadow: 4px 4px 0 #000;
            display: none; z-index: 200; text-align: center; animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="hud">THE FOREST</div>
    <div id="score">TREES DOWN: 0</div>
    <div id="objective">Talk to Forest the Forester to begin...</div>
    <div id="stats">Trees: 1000 | Debris: 0 | FPS: 60</div>
    
    <div id="controls">
        <strong>HAVOK DESTRUCTION:</strong><br>
        WASD - Move<br>
        SPACE - Ollie<br>
        SHIFT - Boost<br>
        E - Talk to NPCs<br>
        Destroy 750 trees...
    </div>
    
    <div id="speechBubble">
        <div id="speakerName">SPEAKER</div>
        <div id="speechText">Dialogue text...</div>
    </div>
    
    <div id="interactPrompt">Press E to talk</div>
    <div id="warningText">THE FOREST IS ANGRY</div>
    
    <canvas id="renderCanvas"></canvas>
    
    <script type="module">
        // ==========================================
        // CONFIG
        // ==========================================
        const CONFIG = {
            TOTAL_TREES: 1000,
            HAUNTED_THRESHOLD: 0.75,
            FOREST_RADIUS: 300,
            MIN_SPEED_TO_DESTROY: 8,
            DEBRIS_PER_TREE: 8,
            MAX_DEBRIS: 500
        };
        
        // ==========================================
        // BABYLON SKATER
        // ==========================================
        class BabylonSkater {
            constructor(scene) {
                this.scene = scene;
                this.skaterRoot = null;
                this.physicsCollider = null;
                this.physicsAggregate = null;
            }
            
            spawn(config = {}) {
                const x = config.x || 0;
                const y = config.y || 5;
                const z = config.z || 0;
                
                const skaterRoot = new BABYLON.TransformNode("skaterRoot", this.scene);
                
                const deck = BABYLON.MeshBuilder.CreateBox("deck", { width: 0.8, height: 0.1, depth: 2.5 }, this.scene);
                deck.position.y = 0.3;
                deck.parent = skaterRoot;
                const deckMat = new BABYLON.StandardMaterial("deckMat", this.scene);
                deckMat.diffuseColor = new BABYLON.Color3(1, 0.08, 0.58);
                deck.material = deckMat;
                
                const wheelMat = new BABYLON.StandardMaterial("wheelMat", this.scene);
                wheelMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
                
                [
                    { x: -0.3, y: 0.15, z: -0.8 },
                    { x: 0.3, y: 0.15, z: -0.8 },
                    { x: -0.3, y: 0.15, z: 0.8 },
                    { x: 0.3, y: 0.15, z: 0.8 }
                ].forEach((pos, i) => {
                    const wheel = BABYLON.MeshBuilder.CreateCylinder(`wheel${i}`, { height: 0.1, diameter: 0.3, tessellation: 12 }, this.scene);
                    wheel.position = new BABYLON.Vector3(pos.x, pos.y, pos.z);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.parent = skaterRoot;
                    wheel.material = wheelMat;
                });
                
                const body = BABYLON.MeshBuilder.CreateBox("body", { width: 0.6, height: 1.2, depth: 0.4 }, this.scene);
                body.position = new BABYLON.Vector3(0, 1.2, -0.2);
                body.parent = skaterRoot;
                const bodyMat = new BABYLON.StandardMaterial("bodyMat", this.scene);
                bodyMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                body.material = bodyMat;
                
                const head = BABYLON.MeshBuilder.CreateSphere("head", { diameter: 0.6, segments: 8 }, this.scene);
                head.position = new BABYLON.Vector3(0, 2.1, -0.2);
                head.parent = skaterRoot;
                const headMat = new BABYLON.StandardMaterial("headMat", this.scene);
                headMat.diffuseColor = new BABYLON.Color3(1, 0.86, 0.67);
                head.material = headMat;
                
                const physicsCollider = BABYLON.MeshBuilder.CreateCapsule("skaterCollider", { height: 2, radius: 0.5 }, this.scene);
                physicsCollider.position = new BABYLON.Vector3(x, y, z);
                physicsCollider.isVisible = false;
                
                const aggregate = new BABYLON.PhysicsAggregate(physicsCollider, BABYLON.PhysicsShapeType.CAPSULE, { mass: 70, restitution: 0.1, friction: 0.2 }, this.scene);
                aggregate.body.setAngularDamping(0.99);
                aggregate.body.setLinearDamping(0.05);
                
                this.physicsAggregate = aggregate;
                this.physicsCollider = physicsCollider;
                this.skaterRoot = skaterRoot;
                
                return { root: skaterRoot, collider: physicsCollider, aggregate };
            }
            
            update() {
                if (!this.skaterRoot || !this.physicsCollider) return;
                this.skaterRoot.position = this.physicsCollider.position.clone();
                this.skaterRoot.position.y -= 0.8;
                this.skaterRoot.rotation.y = this.physicsCollider.rotation.y;
            }
            
            moveForward(speed = 0.5) {
                if (!this.physicsAggregate) return;
                const currentVel = this.physicsAggregate.body.getLinearVelocity();
                const rotY = this.physicsCollider.rotation.y;
                const forward = new BABYLON.Vector3(Math.sin(rotY), 0, Math.cos(rotY));
                const newVel = currentVel.add(forward.scale(speed));
                const horizontalSpeed = Math.sqrt(newVel.x * newVel.x + newVel.z * newVel.z);
                if (horizontalSpeed < 30) this.physicsAggregate.body.setLinearVelocity(newVel);
            }
            
            moveBackward(speed = 0.3) {
                if (!this.physicsAggregate) return;
                const currentVel = this.physicsAggregate.body.getLinearVelocity();
                const rotY = this.physicsCollider.rotation.y;
                const backward = new BABYLON.Vector3(-Math.sin(rotY), 0, -Math.cos(rotY));
                const newVel = currentVel.add(backward.scale(speed));
                this.physicsAggregate.body.setLinearVelocity(newVel);
            }
            
            turnLeft(turnSpeed = 0.05) { if (this.physicsCollider) this.physicsCollider.rotation.y += turnSpeed; }
            turnRight(turnSpeed = 0.05) { if (this.physicsCollider) this.physicsCollider.rotation.y -= turnSpeed; }
            
            jump(force = 350) {
                if (!this.physicsAggregate) return;
                this.physicsAggregate.body.applyImpulse(new BABYLON.Vector3(0, force, 0), this.physicsCollider.getAbsolutePosition());
            }
            
            getVelocity() { return this.physicsAggregate?.body.getLinearVelocity() || new BABYLON.Vector3(0, 0, 0); }
            getSpeed() { const vel = this.getVelocity(); return Math.sqrt(vel.x * vel.x + vel.z * vel.z); }
            getPosition() { return this.physicsCollider?.position || new BABYLON.Vector3(0, 0, 0); }
        }
        
        // ==========================================
        // DESTRUCTIBLE TREE
        // ==========================================
        class DestructibleTree {
            constructor(scene, position) {
                this.scene = scene;
                this.position = position;
                this.destroyed = false;
                this.createTree();
            }
            
            createTree() {
                const trunkHeight = 8 + Math.random() * 4;
                const trunkRadius = 0.3 + Math.random() * 0.2;
                
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { height: trunkHeight, diameter: trunkRadius * 2, tessellation: 8 }, this.scene);
                trunk.position = this.position.clone();
                trunk.position.y = trunkHeight / 2;
                
                const trunkMat = new BABYLON.StandardMaterial("trunkMat", this.scene);
                trunkMat.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
                trunk.material = trunkMat;
                
                const canopy = BABYLON.MeshBuilder.CreateSphere("canopy", { diameter: 4 + Math.random() * 2, segments: 8 }, this.scene);
                canopy.position = new BABYLON.Vector3(0, trunkHeight * 0.7, 0);
                canopy.parent = trunk;
                
                const canopyMat = new BABYLON.StandardMaterial("canopyMat", this.scene);
                canopyMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.3);
                canopy.material = canopyMat;
                
                const aggregate = new BABYLON.PhysicsAggregate(trunk, BABYLON.PhysicsShapeType.CYLINDER, { mass: 0 }, this.scene);
                
                this.mesh = trunk;
                this.aggregate = aggregate;
                this.trunkHeight = trunkHeight;
                this.trunkRadius = trunkRadius;
            }
            
            destroy(impactVelocity) {
                if (this.destroyed) return;
                this.destroyed = true;
                
                this.mesh.dispose();
                this.aggregate.dispose();
                
                const debrisCount = CONFIG.DEBRIS_PER_TREE;
                const debris = [];
                
                for (let i = 0; i < debrisCount; i++) {
                    const fragment = BABYLON.MeshBuilder.CreateBox("wood", {
                        width: this.trunkRadius * (0.5 + Math.random() * 0.5),
                        height: this.trunkHeight / (2 + Math.random() * 2),
                        depth: this.trunkRadius * (0.5 + Math.random() * 0.5)
                    }, this.scene);
                    
                    fragment.position = this.position.clone();
                    fragment.position.y = this.trunkHeight / 2 + (Math.random() - 0.5) * this.trunkHeight;
                    
                    const mat = new BABYLON.StandardMaterial("woodMat", this.scene);
                    mat.diffuseColor = new BABYLON.Color3(
                        0.35 + Math.random() * 0.1,
                        0.25 + Math.random() * 0.1,
                        0.15 + Math.random() * 0.1
                    );
                    fragment.material = mat;
                    
                    const aggregate = new BABYLON.PhysicsAggregate(fragment, BABYLON.PhysicsShapeType.BOX, { mass: 5 + Math.random() * 10, restitution: 0.3, friction: 0.6 }, this.scene);
                    
                    const explosionDir = new BABYLON.Vector3((Math.random() - 0.5), 0.5 + Math.random() * 0.5, (Math.random() - 0.5)).normalize();
                    const force = explosionDir.scale(50 + Math.random() * 100);
                    aggregate.body.applyImpulse(force, fragment.getAbsolutePosition());
                    aggregate.body.applyAngularImpulse(new BABYLON.Vector3((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30));
                    
                    debris.push({ mesh: fragment, aggregate: aggregate, lifetime: 400 + Math.random() * 200 });
                }
                
                return debris;
            }
            
            checkCollision(playerPos, speed) {
                if (this.destroyed) return false;
                const dist = BABYLON.Vector3.Distance(new BABYLON.Vector3(playerPos.x, 0, playerPos.z), new BABYLON.Vector3(this.position.x, 0, this.position.z));
                return dist < (this.trunkRadius + 0.5) && speed > CONFIG.MIN_SPEED_TO_DESTROY;
            }
        }
        
        // ==========================================
        // NPC SYSTEM
        // ==========================================
        class NPC {
            constructor(scene, name, position, color, dialogue) {
                this.scene = scene;
                this.name = name;
                this.position = position;
                this.dialogue = dialogue;
                this.hasSpoken = false;
                this.createNPC(color);
            }
            
            createNPC(color) {
                const group = new BABYLON.TransformNode("npc", this.scene);
                
                const body = BABYLON.MeshBuilder.CreateBox("body", { width: 0.8, height: 1.5, depth: 0.5 }, this.scene);
                body.position.y = 1.5;
                body.parent = group;
                const bodyMat = new BABYLON.StandardMaterial("bodyMat", this.scene);
                bodyMat.diffuseColor = color;
                body.material = bodyMat;
                
                const head = BABYLON.MeshBuilder.CreateSphere("head", { diameter: 0.8, segments: 16 }, this.scene);
                head.position.y = 2.7;
                head.parent = group;
                const headMat = new BABYLON.StandardMaterial("headMat", this.scene);
                headMat.diffuseColor = new BABYLON.Color3(1, 0.86, 0.67);
                head.material = headMat;
                
                group.position = this.position;
                this.mesh = group;
            }
            
            canInteract(playerPos) {
                const dist = BABYLON.Vector3.Distance(new BABYLON.Vector3(playerPos.x, 0, playerPos.z), new BABYLON.Vector3(this.position.x, 0, this.position.z));
                return dist < 3;
            }
            
            speak() {
                this.hasSpoken = true;
                document.getElementById('speakerName').textContent = this.name;
                document.getElementById('speechText').textContent = this.dialogue;
                document.getElementById('speechBubble').classList.add('active');
                
                setTimeout(() => {
                    document.getElementById('speechBubble').classList.remove('active');
                }, 5000);
            }
        }
        
        // ==========================================
        // GHOST CHASE
        // ==========================================
        class ForestGhost {
            constructor(scene, targetPosition) {
                this.scene = scene;
                this.active = false;
                this.createGhost(targetPosition);
            }
            
            createGhost(spawnPos) {
                const ghost = BABYLON.MeshBuilder.CreateSphere("ghost", { diameter: 3, segments: 8 }, this.scene);
                ghost.position = spawnPos.clone();
                ghost.position.y = 5;
                
                const mat = new BABYLON.StandardMaterial("ghostMat", this.scene);
                mat.diffuseColor = new BABYLON.Color3(1, 1, 1);
                mat.alpha = 0.5;
                mat.emissiveColor = new BABYLON.Color3(0.5, 0, 0);
                ghost.material = mat;
                
                const aggregate = new BABYLON.PhysicsAggregate(ghost, BABYLON.PhysicsShapeType.SPHERE, { mass: 50, restitution: 0.8 }, this.scene);
                
                this.mesh = ghost;
                this.aggregate = aggregate;
            }
            
            chase(targetPos) {
                if (!this.active) return;
                
                const myPos = this.mesh.position;
                const direction = targetPos.subtract(myPos).normalize();
                const chaseForce = direction.scale(200);
                
                this.aggregate.body.applyForce(chaseForce, this.mesh.getAbsolutePosition());
            }
            
            activate() {
                this.active = true;
            }
        }
        
        // ==========================================
        // MAIN SCENE
        // ==========================================
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let scene, camera, skater, ghost;
        let trees = [];
        let debris = [];
        let npcs = [];
        let gameState = {
            treesDestroyed: 0,
            hauntedMode: false,
            objectiveActive: false,
            nearNPC: null
        };
        
        const keys = {};
        
        const createScene = async function() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.65, 0.84, 0.73);
            scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
            scene.fogColor = new BABYLON.Color3(0.65, 0.84, 0.73);
            scene.fogStart = 100;
            scene.fogEnd = 300;
            
            camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 15, -25), scene);
            camera.setTarget(new BABYLON.Vector3(0, 5, 0));
            camera.attachControl(canvas, true);
            
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.8;
            hemi.diffuse = new BABYLON.Color3(1, 0.95, 0.8);
            hemi.groundColor = new BABYLON.Color3(0.3, 0.5, 0.3);
            
            const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
            dir.intensity = 0.4;
            
            const havokInstance = await HavokPhysics();
            const havokPlugin = new BABYLON.HavokPlugin(true, havokInstance);
            scene.enablePhysics(new BABYLON.Vector3(0, -30, 0), havokPlugin);
            
            const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 1000, height: 1000, subdivisions: 50 }, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            //groundMat.diffuseColor = new BABYLON.Color3(0.0, 0.0, 0.0); //for colour
            groundMat.diffuseTexture = new BABYLON.Texture("images/textures/grass.png", scene);
            ground.material = groundMat;


            new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.BOX, { mass: 0, friction: 0.3 }, scene);
            
            // Spawn skater
            skater = new BabylonSkater(scene);
            skater.spawn({ x: 20, y: 5, z: 20 });
            
            // Create NPCs
            npcs.push(new NPC(scene, "Forest the Forester", new BABYLON.Vector3(10, 0, 10), new BABYLON.Color3(0.4, 0.6, 0.3), "Welcome to my forest, skater! I've spent years tending these trees. But if you're feeling destructive... go ahead. Just know that destroying 750 trees might awaken something ancient..."));
            npcs.push(new NPC(scene, "Rob the Lumberjack", new BABYLON.Vector3(30, 0, 10), new BABYLON.Color3(0.8, 0.2, 0.1), "I've been trying to clear this forest for YEARS! Maybe you can help me out. These trees have some kind of curse on them. Be careful..."));
            
            // Create forest
            console.log('🌲 Generating haunted forest...');
            for (let i = 0; i < CONFIG.TOTAL_TREES; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.sqrt(Math.random()) * CONFIG.FOREST_RADIUS;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;
                
                // Avoid spawn area
                const distFromSpawn = Math.sqrt((x - 20) * (x - 20) + (z - 20) * (z - 20));
                if (distFromSpawn < 15) continue;
                
                const tree = new DestructibleTree(scene, new BABYLON.Vector3(x, 0, z));
                trees.push(tree);
                
                if (i % 100 === 0) console.log(`   ${i}/${CONFIG.TOTAL_TREES} trees created`);
            }
            
            // Create ghost (inactive)
            ghost = new ForestGhost(scene, new BABYLON.Vector3(-100, 5, -100));
            
            console.log(`✅ ${trees.length} trees ready for destruction!`);
            
            return scene;
        };
        
        function activateHauntedMode() {
            if (gameState.hauntedMode) return;
            gameState.hauntedMode = true;
            
            document.getElementById('hud').classList.add('haunted');
            scene.clearColor = new BABYLON.Color3(0.3, 0.1, 0.1);
            scene.fogColor = new BABYLON.Color3(0.3, 0.1, 0.1);
            
            const warning = document.getElementById('warningText');
            warning.style.display = 'block';
            warning.textContent = 'THE FOREST IS ANGRY';
            setTimeout(() => warning.style.display = 'none', 3000);
            
            // Activate ghost
            ghost.activate();
            ghost.mesh.position = skater.getPosition().clone();
            ghost.mesh.position.z -= 50;
            
            console.log('👻 HAUNTED MODE ACTIVATED - GHOST AWAKENED');
        }
        
        function update() {
            if (!skater || !skater.physicsCollider) return;
            
            const boostMultiplier = keys['shift'] ? 1.5 : 1.0;
            
            if (keys['w'] || keys['arrowup']) skater.moveForward(0.5 * boostMultiplier);
            if (keys['s'] || keys['arrowdown']) skater.moveBackward(0.3);
            if (keys['a'] || keys['arrowleft']) skater.turnLeft(0.05);
            else if (keys['d'] || keys['arrowright']) skater.turnRight(0.05);
            if (keys[' '] && skater.getPosition().y < 4) skater.jump(350);
            
            skater.update();
            
            const speed = skater.getSpeed();
            const pos = skater.getPosition();
            
            // Check NPC interactions
            gameState.nearNPC = null;
            for (let npc of npcs) {
                if (npc.canInteract(pos)) {
                    gameState.nearNPC = npc;
                    document.getElementById('interactPrompt').style.display = 'block';
                    document.getElementById('interactPrompt').textContent = `Press E to talk to ${npc.name}`;
                    break;
                }
            }
            if (!gameState.nearNPC) document.getElementById('interactPrompt').style.display = 'none';
            
            // Check tree collisions (only if objective active)
            if (gameState.objectiveActive) {
                trees.forEach(tree => {
                    if (tree.checkCollision(pos, speed)) {
                        const newDebris = tree.destroy(skater.getVelocity());
                        
                        if (newDebris) {
                            debris.push(...newDebris);
                            
                            while (debris.length > CONFIG.MAX_DEBRIS) {
                                const old = debris.shift();
                                old.mesh.dispose();
                                old.aggregate.dispose();
                            }
                            
                            gameState.treesDestroyed++;
                            
                            const percentDestroyed = gameState.treesDestroyed / CONFIG.TOTAL_TREES;
                            if (percentDestroyed >= CONFIG.HAUNTED_THRESHOLD && !gameState.hauntedMode) {
                                activateHauntedMode();
                            }
                        }
                    }
                });
            }
            
            // Update debris lifetime
            for (let i = debris.length - 1; i >= 0; i--) {
                debris[i].lifetime--;
                if (debris[i].lifetime <= 0) {
                    debris[i].mesh.dispose();
                    debris[i].aggregate.dispose();
                    debris.splice(i, 1);
                }
            }
            
            // Ghost chase
            if (gameState.hauntedMode && ghost) {
                ghost.chase(pos);
            }
            
            // Camera follow
            const cameraOffset = skater.physicsCollider.forward.scale(-20);
            cameraOffset.y = 12;
            camera.position = BABYLON.Vector3.Lerp(camera.position, pos.add(cameraOffset), 0.1);
            camera.setTarget(pos.add(new BABYLON.Vector3(0, 2, 0)));
            
            // HUD
            document.getElementById('score').textContent = `TREES DOWN: ${gameState.treesDestroyed}`;
            const treesLeft = trees.filter(t => !t.destroyed).length;
            document.getElementById('stats').textContent = `Trees: ${treesLeft} | Debris: ${debris.length} | Speed: ${Math.floor(speed * 10)}`;
            
            if (gameState.objectiveActive) {
                const threshold = Math.floor(CONFIG.TOTAL_TREES * CONFIG.HAUNTED_THRESHOLD);
                document.getElementById('objective').textContent = `Destroy trees! (${threshold} triggers something...)`;
            }
        }
        
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key.toLowerCase() === 'e' && gameState.nearNPC) {
                gameState.nearNPC.speak();
                if (gameState.nearNPC.name === 'Forest the Forester' && !gameState.objectiveActive) {
                    gameState.objectiveActive = true;
                }
            }
        });
        
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
        
        createScene().then(scene => {
            engine.runRenderLoop(() => {
                update();
                scene.render();
            });
        });
        
        window.addEventListener('resize', () => engine.resize());
        
        console.log('🌲 THE HAUNTED FOREST - Complete Havok Edition loaded');
    </script>
</body>
</html>
