<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>APPLESAUCE Babylon Terrain Demo</title>
    
    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <style>
        * { margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
        
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border: 2px solid #0f0;
            max-width: 350px;
            z-index: 100;
        }
        
        #ui h1 {
            color: #0f0;
            font-size: 18px;
            margin-bottom: 15px;
            text-shadow: 2px 2px #000;
        }
        
        #ui .section {
            margin: 15px 0;
            padding: 10px;
            border-left: 3px solid #0f0;
        }
        
        #ui button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
        }
        
        #ui button:hover {
            background: #0ff;
        }
        
        #ui .controls {
            color: #888;
            font-size: 12px;
            line-height: 1.6;
        }
        
        #stats {
            color: #0f0;
            font-size: 13px;
        }
        
        #stats span {
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🏔️ TERRAIN BUILDER</h1>
        
        <div class="section">
            <div style="margin-bottom: 10px; color: #fff;">Terrain Type:</div>
            <button onclick="loadFlat()">FLAT</button>
            <button onclick="loadSmooth()">SMOOTH HILLS</button>
            <button onclick="loadMountains()">MOUNTAINS</button>
            <button onclick="loadSkatepark()">SKATEPARK</button>
        </div>
        
        <div class="section">
            <div style="margin-bottom: 10px; color: #fff;">Spawn Objects:</div>
            <button onclick="spawnBox()">BOX</button>
            <button onclick="spawnSphere()">SPHERE</button>
            <button onclick="spawnCylinder()">CYLINDER</button>
            <button onclick="spawnRagdoll()">RAGDOLL</button>
        </div>
        
        <div class="section" id="stats">
            Objects: <span id="objCount">0</span><br>
            Physics Bodies: <span id="physCount">0</span>
        </div>
        
        <div class="section controls">
            WASD: Move camera<br>
            Mouse: Look around<br>
            Click object: Apply force<br>
            R: Reset terrain<br>
            Space: Spawn at camera
        </div>
    </div>
    
    <canvas id="renderCanvas"></canvas>
    
    <script type="module">
        // Inline the terrain class for this demo
        // (In production, you'd import from babylon-terrain.js)
        
        class BabylonTerrain {
            constructor(scene, physics) {
                this.scene = scene;
                this.physics = physics;
                this.terrainMesh = null;
                this.terrainAggregate = null;
                this.worldObjects = [];
                this.noiseConfig = null;
            }
            
            generate(config) {
                this.clear();
                
                switch(config.type) {
                    case 'procedural':
                        this.generateProcedural(config);
                        break;
                    case 'skatepark':
                        this.generateSkatepark(config);
                        break;
                    case 'flat':
                    default:
                        this.generateFlat(config);
                        break;
                }
                
                if (this.terrainMesh && config.physics !== false) {
                    this.addTerrainPhysics();
                }
                
                if (config.objects) {
                    this.spawnObjects(config.objects);
                }
            }
            
            generateFlat(config) {
                const size = config.size || 100;
                this.terrainMesh = BABYLON.MeshBuilder.CreateGround(
                    "terrain",
                    { width: size, height: size, subdivisions: 1 },
                    this.scene
                );
                this.applyTerrainMaterial(config);
                this.terrainMesh.receiveShadow = true;
            }
            
            generateProcedural(config) {
                const size = config.size || 200;
                const resolution = config.resolution || 100;
                
                const ground = BABYLON.MeshBuilder.CreateGround(
                    "terrain",
                    { width: size, height: size, subdivisions: resolution },
                    this.scene
                );
                
                this.noiseConfig = this.getNoiseConfig(config);
                const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                
                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i];
                    const z = positions[i + 2];
                    const height = this.calculateHeight(x, z, this.noiseConfig);
                    positions[i + 1] = height;
                }
                
                ground.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
                ground.createNormals(true);
                
                this.terrainMesh = ground;
                this.applyTerrainMaterial(config);
                this.terrainMesh.receiveShadow = true;
            }
            
            generateSkatepark(config) {
                this.generateFlat({ ...config, size: 100 });
                
                // Add ramps
                this.createRamp({ position: { x: -20, y: 0, z: 0 }, width: 6, height: 2, depth: 8 });
                this.createRamp({ position: { x: 20, y: 0, z: 0 }, width: 6, height: 2, depth: 8, angle: -Math.PI/6 });
                
                // Add rails
                this.createRail({ position: { x: 0, y: 0, z: -15 }, length: 12, height: 1 });
                this.createRail({ position: { x: 0, y: 0, z: 15 }, length: 12, height: 1.5 });
            }
            
            createRamp(config) {
                const ramp = BABYLON.MeshBuilder.CreateBox(
                    "ramp",
                    { width: config.width, height: config.height, depth: config.depth },
                    this.scene
                );
                
                ramp.position = new BABYLON.Vector3(
                    config.position.x,
                    config.height / 2,
                    config.position.z
                );
                ramp.rotation.z = config.angle || (Math.PI / 6);
                
                const mat = new BABYLON.StandardMaterial("rampMat", this.scene);
                mat.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.4);
                ramp.material = mat;
                
                const aggregate = new BABYLON.PhysicsAggregate(
                    ramp,
                    BABYLON.PhysicsShapeType.BOX,
                    { mass: 0, friction: 0.2 },
                    this.scene
                );
                
                this.worldObjects.push({ mesh: ramp, aggregate, type: 'ramp' });
            }
            
            createRail(config) {
                const rail = BABYLON.MeshBuilder.CreateCylinder(
                    "rail",
                    { height: config.length, diameter: 0.1, tessellation: 16 },
                    this.scene
                );
                
                rail.position = new BABYLON.Vector3(
                    config.position.x,
                    config.height,
                    config.position.z
                );
                rail.rotation.x = Math.PI / 2;
                
                const mat = new BABYLON.StandardMaterial("railMat", this.scene);
                mat.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.75);
                mat.specularColor = new BABYLON.Color3(0.9, 0.9, 0.9);
                rail.material = mat;
                
                const aggregate = new BABYLON.PhysicsAggregate(
                    rail,
                    BABYLON.PhysicsShapeType.CYLINDER,
                    { mass: 0, friction: 0.05 },
                    this.scene
                );
                
                this.worldObjects.push({ mesh: rail, aggregate, type: 'rail' });
            }
            
            spawnObjects(objects) {
                objects.forEach(obj => this.spawnObject(obj));
            }
            
            spawnObject(config) {
                let mesh;
                
                switch(config.type) {
                    case 'box':
                        mesh = this.createBox(config);
                        break;
                    case 'cylinder':
                        mesh = this.createCylinder(config);
                        break;
                    case 'sphere':
                        mesh = this.createSphere(config);
                        break;
                    default:
                        mesh = this.createBox(config);
                }
                
                if (config.position) {
                    mesh.position = new BABYLON.Vector3(
                        config.position.x || 0,
                        config.position.y || 5,
                        config.position.z || 0
                    );
                }
                
                const physicsShape = this.getPhysicsShapeForType(config.type);
                const aggregate = new BABYLON.PhysicsAggregate(
                    mesh,
                    physicsShape,
                    { 
                        mass: config.mass || 1,
                        friction: config.friction || 0.6,
                        restitution: config.restitution || 0.3
                    },
                    this.scene
                );
                
                this.worldObjects.push({ mesh, aggregate, type: config.type, config });
                updateStats();
                
                return mesh;
            }
            
            createBox(config) {
                const size = config.size || { width: 1, height: 1, depth: 1 };
                const box = BABYLON.MeshBuilder.CreateBox(config.name || "box", size, this.scene);
                
                if (config.color) {
                    const mat = new BABYLON.StandardMaterial("boxMat", this.scene);
                    mat.diffuseColor = new BABYLON.Color3(
                        config.color.r || 0.5,
                        config.color.g || 0.5,
                        config.color.b || 0.5
                    );
                    box.material = mat;
                }
                
                box.receiveShadow = true;
                box.castShadow = true;
                return box;
            }
            
            createCylinder(config) {
                const cylinder = BABYLON.MeshBuilder.CreateCylinder(
                    config.name || "cylinder",
                    { height: config.height || 2, diameter: config.diameter || 1 },
                    this.scene
                );
                
                if (config.color) {
                    const mat = new BABYLON.StandardMaterial("cylMat", this.scene);
                    mat.diffuseColor = new BABYLON.Color3(
                        config.color.r, config.color.g, config.color.b
                    );
                    cylinder.material = mat;
                }
                
                cylinder.receiveShadow = true;
                cylinder.castShadow = true;
                return cylinder;
            }
            
            createSphere(config) {
                const sphere = BABYLON.MeshBuilder.CreateSphere(
                    config.name || "sphere",
                    { diameter: config.diameter || 1, segments: 16 },
                    this.scene
                );
                
                if (config.color) {
                    const mat = new BABYLON.StandardMaterial("sphereMat", this.scene);
                    mat.diffuseColor = new BABYLON.Color3(
                        config.color.r, config.color.g, config.color.b
                    );
                    sphere.material = mat;
                }
                
                sphere.receiveShadow = true;
                sphere.castShadow = true;
                return sphere;
            }
            
            addTerrainPhysics() {
                if (!this.terrainMesh) return;
                this.terrainAggregate = new BABYLON.PhysicsAggregate(
                    this.terrainMesh,
                    BABYLON.PhysicsShapeType.BOX,
                    { mass: 0, friction: 0.8 },
                    this.scene
                );
            }
            
            getPhysicsShapeForType(type) {
                const shapeMap = {
                    'box': BABYLON.PhysicsShapeType.BOX,
                    'cylinder': BABYLON.PhysicsShapeType.CYLINDER,
                    'sphere': BABYLON.PhysicsShapeType.SPHERE
                };
                return shapeMap[type] || BABYLON.PhysicsShapeType.BOX;
            }
            
            calculateHeight(x, z, config) {
                let height = 0;
                height += Math.sin(x * config.freq1) * config.amp1;
                height += Math.cos(z * config.freq1) * config.amp1;
                height += Math.sin(x * config.freq2) * config.amp2;
                height += Math.cos(z * config.freq2) * config.amp2;
                height += Math.sin(x * config.freq3) * config.amp3;
                height += Math.cos(z * config.freq3) * config.amp3;
                height += Math.sin((x + z) * config.freqDiag) * config.ampDiag;
                return height;
            }
            
            getNoiseConfig(config) {
                if (config.noise && config.noise.preset) {
                    return this.getNoisePreset(config.noise.preset);
                }
                return this.getNoisePreset('smooth');
            }
            
            getNoisePreset(preset) {
                const presets = {
                    'smooth': {
                        freq1: 0.01, freq2: 0.03, freq3: 0.08, freqDiag: 0.02,
                        amp1: 8, amp2: 3, amp3: 1, ampDiag: 2
                    },
                    'mountains': {
                        freq1: 0.005, freq2: 0.015, freq3: 0.04, freqDiag: 0.01,
                        amp1: 30, amp2: 12, amp3: 4, ampDiag: 8
                    }
                };
                return presets[preset] || presets['smooth'];
            }
            
            applyTerrainMaterial(config) {
                if (!this.terrainMesh) return;
                const mat = new BABYLON.StandardMaterial("terrainMat", this.scene);
                const color = config.color || { r: 0.34, g: 0.49, b: 0.27 };
                mat.diffuseColor = new BABYLON.Color3(color.r, color.g, color.b);
                mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                this.terrainMesh.material = mat;
            }
            
            clear() {
                if (this.terrainMesh) {
                    this.terrainMesh.dispose();
                    this.terrainMesh = null;
                }
                if (this.terrainAggregate) {
                    this.terrainAggregate.dispose();
                    this.terrainAggregate = null;
                }
                this.worldObjects.forEach(obj => {
                    obj.mesh.dispose();
                    if (obj.aggregate) obj.aggregate.dispose();
                });
                this.worldObjects = [];
                updateStats();
            }
        }
        
        // ===================================
        // MAIN SCENE
        // ===================================
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let terrain = null;
        let scene = null;
        let camera = null;
        
        const createScene = async function() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.15, 0.18, 0.2);
            
            // Camera
            camera = new BABYLON.UniversalCamera(
                "camera",
                new BABYLON.Vector3(0, 10, -30),
                scene
            );
            camera.setTarget(new BABYLON.Vector3(0, 5, 0));
            camera.attachControl(canvas, true);
            camera.speed = 0.8;
            camera.angularSensibility = 2000;
            
            // Lights
            const hemi = new BABYLON.HemisphericLight(
                "hemi",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemi.intensity = 0.6;
            
            const dir = new BABYLON.DirectionalLight(
                "dir",
                new BABYLON.Vector3(-1, -2, 1),
                scene
            );
            dir.intensity = 0.5;
            
            // Initialize Havok
            const havokInstance = await HavokPhysics();
            const havokPlugin = new BABYLON.HavokPlugin(true, havokInstance);
            scene.enablePhysics(new BABYLON.Vector3(0, -20, 0), havokPlugin);
            
            // Create terrain system
            terrain = new BabylonTerrain(scene, havokPlugin);
            terrain.generate({ type: 'flat', size: 100 });
            
            // Click to apply force
            scene.onPointerDown = (evt, pickResult) => {
                if (pickResult.hit && pickResult.pickedMesh.name !== "terrain") {
                    const obj = terrain.worldObjects.find(o => o.mesh === pickResult.pickedMesh);
                    if (obj && obj.aggregate) {
                        const force = camera.getForwardRay().direction.scale(200);
                        obj.aggregate.body.applyImpulse(
                            force,
                            pickResult.pickedMesh.getAbsolutePosition()
                        );
                    }
                }
            };
            
            // Keyboard
            const keys = {};
            scene.onKeyboardObservable.add((kbInfo) => {
                keys[kbInfo.event.key] = kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN;
                
                // Spawn at camera on space
                if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN && kbInfo.event.key === ' ') {
                    const pos = camera.position.clone();
                    pos.y += 2;
                    terrain.spawnObject({
                        type: 'sphere',
                        diameter: 1,
                        position: { x: pos.x, y: pos.y, z: pos.z },
                        color: { r: Math.random(), g: Math.random(), b: Math.random() }
                    });
                }
                
                // Reset on R
                if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN && kbInfo.event.key === 'r') {
                    terrain.clear();
                    terrain.generate({ type: 'flat', size: 100 });
                }
            });
            
            return scene;
        };
        
        // ===================================
        // UI FUNCTIONS
        // ===================================
        
        window.loadFlat = () => {
            terrain.generate({ type: 'flat', size: 100 });
        };
        
        window.loadSmooth = () => {
            terrain.generate({ 
                type: 'procedural', 
                size: 200, 
                resolution: 80,
                noise: { preset: 'smooth' }
            });
        };
        
        window.loadMountains = () => {
            terrain.generate({ 
                type: 'procedural', 
                size: 200, 
                resolution: 80,
                noise: { preset: 'mountains' }
            });
        };
        
        window.loadSkatepark = () => {
            terrain.generate({ type: 'skatepark' });
        };
        
        window.spawnBox = () => {
            const pos = camera.position.clone().add(camera.getForwardRay().direction.scale(10));
            terrain.spawnObject({
                type: 'box',
                size: { width: 2, height: 2, depth: 2 },
                position: { x: pos.x, y: pos.y + 5, z: pos.z },
                color: { r: Math.random(), g: Math.random(), b: Math.random() }
            });
        };
        
        window.spawnSphere = () => {
            const pos = camera.position.clone().add(camera.getForwardRay().direction.scale(10));
            terrain.spawnObject({
                type: 'sphere',
                diameter: 2,
                position: { x: pos.x, y: pos.y + 5, z: pos.z },
                color: { r: Math.random(), g: Math.random(), b: Math.random() }
            });
        };
        
        window.spawnCylinder = () => {
            const pos = camera.position.clone().add(camera.getForwardRay().direction.scale(10));
            terrain.spawnObject({
                type: 'cylinder',
                height: 3,
                diameter: 1.5,
                position: { x: pos.x, y: pos.y + 5, z: pos.z },
                color: { r: Math.random(), g: Math.random(), b: Math.random() }
            });
        };
        
        window.spawnRagdoll = () => {
            // Simple ragdoll - 3 connected boxes
            const pos = camera.position.clone().add(camera.getForwardRay().direction.scale(10));
            
            // Head
            terrain.spawnObject({
                type: 'sphere',
                diameter: 0.8,
                position: { x: pos.x, y: pos.y + 7, z: pos.z },
                color: { r: 0.9, g: 0.7, b: 0.6 },
                mass: 2
            });
            
            // Torso
            terrain.spawnObject({
                type: 'box',
                size: { width: 1, height: 1.5, depth: 0.6 },
                position: { x: pos.x, y: pos.y + 5, z: pos.z },
                color: { r: 0.3, g: 0.3, b: 0.8 },
                mass: 5
            });
            
            // Legs
            terrain.spawnObject({
                type: 'cylinder',
                height: 1.5,
                diameter: 0.4,
                position: { x: pos.x - 0.3, y: pos.y + 3, z: pos.z },
                color: { r: 0.2, g: 0.2, b: 0.2 },
                mass: 3
            });
            
            terrain.spawnObject({
                type: 'cylinder',
                height: 1.5,
                diameter: 0.4,
                position: { x: pos.x + 0.3, y: pos.y + 3, z: pos.z },
                color: { r: 0.2, g: 0.2, b: 0.2 },
                mass: 3
            });
        };
        
        function updateStats() {
            document.getElementById('objCount').textContent = terrain.worldObjects.length;
            document.getElementById('physCount').textContent = terrain.worldObjects.length + 1; // +1 for terrain
        }
        
        // ===================================
        // START
        // ===================================
        
        createScene().then(scene => {
            engine.runRenderLoop(() => {
                if (scene) scene.render();
            });
        });
        
        window.addEventListener('resize', () => engine.resize());
        
        console.log('🏔️ Babylon Terrain Demo loaded');
    </script>
</body>
</html>
