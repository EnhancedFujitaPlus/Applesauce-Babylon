<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Input Debug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        
        #debug {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #0f0;
            font-size: 12px;
            z-index: 1000;
            max-width: 400px;
        }
        
        .debug-section {
            margin: 10px 0;
            padding: 10px 0;
            border-top: 1px solid #0f0;
        }
        
        .debug-title {
            color: #ff0;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .debug-value {
            color: #0ff;
        }
        
        .key-pressed {
            color: #0f0;
            background: rgba(0, 255, 0, 0.2);
            padding: 2px 5px;
            margin: 2px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="debug">
        <div style="font-size: 16px; font-weight: bold; color: #0f0; margin-bottom: 10px;">🔍 INPUT DEBUG</div>
        
        <div class="debug-section">
            <div class="debug-title">Keys Pressed:</div>
            <div id="keys-pressed">None</div>
        </div>
        
        <div class="debug-section">
            <div class="debug-title">Player Status:</div>
            <div>Player exists: <span class="debug-value" id="player-exists">false</span></div>
            <div>PlayerModule exists: <span class="debug-value" id="module-exists">false</span></div>
            <div>Position: <span class="debug-value" id="player-pos">N/A</span></div>
            <div>Speed: <span class="debug-value" id="player-speed">0</span></div>
        </div>
        
        <div class="debug-section">
            <div class="debug-title">Camera:</div>
            <div>Position: <span class="debug-value" id="cam-pos">N/A</span></div>
            <div>Target: <span class="debug-value" id="cam-target">N/A</span></div>
        </div>
        
        <div class="debug-section">
            <div class="debug-title">Controls:</div>
            <div style="font-size: 11px; margin-top: 5px;">
                Press WASD or Arrow keys to test input
            </div>
        </div>
    </div>
    
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <!-- Havok Physics -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    
    <script type="module">
        import { ApplesauceCore } from './engine/applesauce-core-babylon.js';
        import { BabylonSkater } from './engine/skater/babylon-skater.js';
        import { BabylonTerrain } from './engine/terrain/babylon-terrain.js';
        let game = null;
        
        // Debug update function
        function updateDebug() {
            if (!game) return;
            
            // Show pressed keys
            const pressedKeys = Object.keys(game.keys).filter(k => game.keys[k]);
            document.getElementById('keys-pressed').innerHTML = pressedKeys.length > 0 
                ? pressedKeys.map(k => `<span class="key-pressed">${k}</span>`).join('')
                : 'None';
            
            // Player status
            document.getElementById('player-exists').textContent = game.player ? 'true' : 'false';
            document.getElementById('module-exists').textContent = game.playerModule ? 'true' : 'false';
            
            if (game.playerModule && game.playerModule.getPosition) {
                const pos = game.playerModule.getPosition();
                document.getElementById('player-pos').textContent = 
                    `[${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}]`;
                
                const speed = game.playerModule.getSpeed();
                document.getElementById('player-speed').textContent = speed.toFixed(2);
            }
            
            // Camera
            if (game.camera) {
                const camPos = game.camera.position;
                document.getElementById('cam-pos').textContent = 
                    `[${camPos.x.toFixed(1)}, ${camPos.y.toFixed(1)}, ${camPos.z.toFixed(1)}]`;
                
                if (game.camera.lockedTarget) {
                    const target = game.camera.lockedTarget.position;
                    document.getElementById('cam-target').textContent = 
                        `[${target.x.toFixed(1)}, ${target.y.toFixed(1)}, ${target.z.toFixed(1)}]`;
                } else {
                    document.getElementById('cam-target').textContent = 'Not locked';
                }
            }
        }
        
        // Simple test level
        const testLevel = {
            meta: {
                name: "Input Test",
                version: "1.0"
            },
            
            terrain: {
                type: 'flat',
                size: 100,
                color: { r: 0.34, g: 0.49, b: 0.27 }
            },
            
            playerStart: {
                x: 0,
                y: 3,
                z: 0
            },
            
            onLevelStart: async (g) => {
                console.log('🎮 Level started - Testing input...');
                console.log('Player object:', g.player);
                console.log('PlayerModule:', g.playerModule);
                console.log('Camera:', g.camera);
                console.log('Keys:', g.keys);
                
                // Test if player can move
                if (g.playerModule) {
                    console.log('✅ PlayerModule methods available:');
                    console.log('  - moveForward:', typeof g.playerModule.moveForward);
                    console.log('  - turnLeft:', typeof g.playerModule.turnLeft);
                    console.log('  - update:', typeof g.playerModule.update);
                    console.log('  - getSpeed:', typeof g.playerModule.getSpeed);
                } else {
                    console.error('❌ PlayerModule not initialized!');
                }
            },
            
            onUpdate: (g) => {
                updateDebug();
            }
        };
        
        // Main initialization
        async function init() {
            try {
                console.log('🎮 Initializing debug version...');
                
                // Create APPLESAUCE Core
                game = new ApplesauceCore({
                    goreEnabled: false,
                    maxSpeed: 50
                });
                
                await game.init();
                
                console.log('✅ Engine initialized');
                console.log('Scene:', game.scene);
                console.log('Camera:', game.camera);
                
                await game.loadLevel(testLevel);
                
                console.log('✅ Level loaded');
                console.log('Starting game loop...');
                
                // Start game
                game.start();
                
                console.log('✅ Game started - Press WASD to move!');
                
                // Manual input test
                console.log('\n📝 Testing manual input:');
                setTimeout(() => {
                    console.log('Simulating W key press...');
                    if (game.playerModule) {
                        game.playerModule.moveForward(50);
                        console.log('✅ moveForward() called successfully');
                    } else {
                        console.error('❌ Cannot test - playerModule missing');
                    }
                }, 2000);
                
            } catch (error) {
                console.error('❌ Initialization failed:', error);
                console.error(error.stack);
            }
        }
        
        // Wait for Havok
        if (typeof HavokPhysics === 'undefined') {
            console.error('❌ Havok not loaded!');
        } else {
            init();
        }
    </script>
</body>
</html>
