<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE Gore Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 24px;
            text-align: center;
            z-index: 2000;
        }
        
        .loading-spinner {
            border: 4px solid #0f0;
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #console-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-height: 200px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            padding: 10px;
            font-size: 11px;
            color: #0f0;
            overflow-y: auto;
            z-index: 1000;
        }
        
        .log-impact { color: #ff0; }
        .log-sever { color: #f00; font-weight: bold; }
        .log-death { color: #f0f; font-weight: bold; }
        .log-spawn { color: #0ff; }
    </style>
</head>
<body>
    <div id="loading">
        <div>🩸 LOADING GORE ENGINE 🩸</div>
        <div class="loading-spinner"></div>
        <div style="font-size: 14px; margin-top: 20px;">Initializing physics...</div>
    </div>
    
    <div id="console-log"></div>
    
    <script type="module">
        import { ApplesauceCore } from '../engine/gore/applesauce-core-gore.js';
        
        // Console logger
        const consoleLog = document.getElementById('console-log');
        const originalLog = console.log;
        
        console.log = function(...args) {
            const msg = args.join(' ');
            
            // Determine log type
            let className = '';
            if (msg.includes('💥')) className = 'log-impact';
            else if (msg.includes('🔪') || msg.includes('SEVERED')) className = 'log-sever';
            else if (msg.includes('☠️') || msg.includes('DEAD')) className = 'log-death';
            else if (msg.includes('🎯') || msg.includes('Spawned')) className = 'log-spawn';
            
            // Add to console
            const line = document.createElement('div');
            line.className = className;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleLog.appendChild(line);
            consoleLog.scrollTop = consoleLog.scrollHeight;
            
            // Keep only last 50 lines
            while (consoleLog.children.length > 50) {
                consoleLog.removeChild(consoleLog.firstChild);
            }
            
            originalLog.apply(console, args);
        };
        
        // Test level configuration
        const testLevel = {
            meta: {
                name: "Gore Test Arena",
                version: "1.0"
            },
            
            terrain: {
                size: 200
            },
            
            playerStart: { x: 0, z: 0 },
            
            onLevelStart: (game) => {
                console.log('🎮 Level started! Press SPACE to spawn ragdolls');
                
                // Spawn some obstacles/ramps
                createTestObstacles(game);
                
                // Auto-spawn ragdolls for demo
                setTimeout(() => {
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            game.spawnRagdoll();
                        }, i * 500);
                    }
                }, 1000);
            },
            
            onUpdate: (game) => {
                // Level-specific updates can go here
            }
        };
        
        function createTestObstacles(game) {
            const THREE = window.THREE;
            
            // Create some platforms/obstacles
            const platforms = [
                { pos: [10, 0.5, 0], size: [5, 1, 5], color: 0x666666 },
                { pos: [-10, 0.5, 0], size: [5, 1, 5], color: 0x666666 },
                { pos: [0, 0.5, 10], size: [5, 1, 5], color: 0x666666 },
                { pos: [0, 0.5, -10], size: [5, 1, 5], color: 0x666666 }
            ];
            
            platforms.forEach(plat => {
                const geo = new THREE.BoxGeometry(...plat.size);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: plat.color,
                    roughness: 0.8
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...plat.pos);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                game.scene.add(mesh);
            });
            
            console.log('✅ Test obstacles created');
        }
        
        // Initialize game
        async function init() {
            try {
                console.log('🎮 Initializing APPLESAUCE Gore Test...');
                
                const game = new ApplesauceCore({
                    goreEnabled: true,
                    maxSpeed: 1.0
                });
                
                // Load test level
                await game.loadLevel(testLevel);
                
                // Hide loading screen
                document.getElementById('loading').style.display = 'none';
                
                // Start game loop
                game.start();
                
                console.log('✅ Game started! Controls:');
                console.log('   WASD/Arrows - Move player');
                console.log('   SPACE - Spawn ragdoll');
                
                // Make THREE available globally for test obstacles
                window.THREE = await import('../three.module.js');
                
            } catch (error) {
                console.error('❌ Failed to initialize:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #f00;">❌ INITIALIZATION FAILED</div>
                    <div style="font-size: 14px; margin-top: 20px;">${error.message}</div>
                    <div style="font-size: 12px; margin-top: 10px;">Check console for details</div>
                `;
            }
        }
        
        init();
    </script>
</body>
</html>
