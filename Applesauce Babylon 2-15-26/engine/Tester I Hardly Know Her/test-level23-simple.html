<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Level 23 (SIMPLE VERSION)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        #renderCanvas { width: 100%; height: 100%; display: block; }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #0f0;
            font-size: 14px;
            z-index: 1000;
        }
        
        .hud-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .hud-section {
            margin: 10px 0;
            padding: 10px 0;
            border-top: 1px solid #0f0;
        }
        
        .objective {
            margin: 5px 0;
        }
        
        .objective.complete {
            color: #0f0;
            text-decoration: line-through;
        }
        
        .objective.incomplete {
            color: #ff0;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="hud">
        <div class="hud-title">🛹 PARADELI PARK</div>
        
        <div class="hud-section">
            <div>Score: <span id="score" style="color: #ff0; font-weight: bold;">0</span></div>
            <div>Speed: <span id="speed">0.0</span> m/s</div>
        </div>
        
        <div class="hud-section">
            <div style="color: #888; font-size: 11px; margin-bottom: 5px;">OBJECTIVES</div>
            <div class="objective incomplete" id="obj-roadkill">
                💀 Roadkill: <span id="roadkills">0</span>/10
            </div>
            <div class="objective incomplete" id="obj-kickflip">
                🛹 Kickflips: <span id="kickflips">0</span>/5
            </div>
            <div class="objective" id="obj-boss" style="display: none;">
                👹 Defeat Boss
            </div>
        </div>
        
        <div class="hud-section" style="font-size: 12px; color: #888;">
            <div>WASD - Move</div>
            <div>SPACE - Jump</div>
            <div>E - Kickflip</div>
        </div>
    </div>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    
    <script>
        // SIMPLE VERSION - No modules, just vanilla JavaScript
        
        let canvas, engine, scene, camera, player, playerModule, gore;
        let keys = {};
        let gameState = {
            roadkills: 0,
            kickflips: 0,
            score: 0,
            bossSpawned: false
        };
        
        // Simple Gore System
        class SimpleGore {
            constructor(scene) {
                this.scene = scene;
                this.ragdolls = new Map();
            }
            
            createRagdoll(position) {
                const ragdollId = `ragdoll_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                const root = new BABYLON.TransformNode(ragdollId, this.scene);
                root.position = position.clone();
                
                // Simple ragdoll - just a capsule with physics
                const body = BABYLON.MeshBuilder.CreateCapsule(
                    "body",
                    { height: 2, radius: 0.5 },
                    this.scene
                );
                body.position = position.clone();
                body.parent = root;
                
                const mat = new BABYLON.StandardMaterial("ragdollMat", this.scene);
                mat.diffuseColor = new BABYLON.Color3(1, 0.86, 0.67);
                body.material = mat;
                body.castShadow = true;
                
                const aggregate = new BABYLON.PhysicsAggregate(
                    body,
                    BABYLON.PhysicsShapeType.CAPSULE,
                    { mass: 70, restitution: 0.3, friction: 0.6 },
                    this.scene
                );
                
                this.ragdolls.set(ragdollId, {
                    root: root,
                    body: body,
                    aggregate: aggregate,
                    alive: true,
                    metadata: {}
                });
                
                return root;
            }
        }
        
        function updateHUD() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('roadkills').textContent = gameState.roadkills;
            document.getElementById('kickflips').textContent = gameState.kickflips;
            
            if (playerModule) {
                const vel = playerModule.aggregate.body.getLinearVelocity();
                const speed = Math.sqrt(vel.x * vel.x + vel.z * vel.z);
                document.getElementById('speed').textContent = speed.toFixed(1);
            }
            
            // Update objective classes
            if (gameState.roadkills >= 10) {
                document.getElementById('obj-roadkill').className = 'objective complete';
            }
            if (gameState.kickflips >= 5) {
                document.getElementById('obj-kickflip').className = 'objective complete';
            }
            
            if (gameState.bossSpawned) {
                document.getElementById('obj-boss').style.display = 'block';
            }
        }
        
        async function init() {
            console.log('🎮 Starting APPLESAUCE...');
            
            canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true);
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.53, 0.81, 0.92, 1.0);
            
            // Camera
            camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 15, -25), scene);
            camera.setTarget(new BABYLON.Vector3(0, 10, 0));
            camera.attachControl(canvas, true);
            
            // Light
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;
            
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
            sun.position = new BABYLON.Vector3(50, 100, 50);
            
            // Havok
            console.log('⚡ Loading Havok...');
            const havok = await HavokPhysics();
            const plugin = new BABYLON.HavokPlugin(true, havok);
            scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), plugin);
            console.log('✅ Havok ready');
            
            // Create simple ground
            const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 500 }, scene);
            ground.position.z = 250;
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.34, 0.49, 0.27);
            ground.material = groundMat;
            ground.receiveShadow = true;
            
            new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.BOX, { mass: 0, friction: 0.8 }, scene);
            
            // Create player (simple capsule)
            const playerCapsule = BABYLON.MeshBuilder.CreateCapsule("player", { height: 20, radius: 0.5 }, scene);
            playerCapsule.position = new BABYLON.Vector3(0, 3, 0);
            playerCapsule.isVisible = false;
            
            const playerAggregate = new BABYLON.PhysicsAggregate(
                playerCapsule,
                BABYLON.PhysicsShapeType.CAPSULE,
                { mass: 70, restitution: 0.1, friction: 0.4 },
                scene
            );
            
            playerAggregate.body.setLinearDamping(0.1);
            playerAggregate.body.setAngularDamping(0.5);
            
            playerModule = {
                collider: playerCapsule,
                aggregate: playerAggregate
            };
            
            camera.lockedTarget = playerCapsule;
            
            console.log('✅ Player created');
            
            // Gore system
            gore = new SimpleGore(scene);
            console.log('✅ Gore system ready');
            
            // Spawn some ragdolls
            for (let i = 0; i < 10; i++) {
                const x = (Math.random() - 0.5) * 40;
                const z = 50 + i * 40;
                gore.createRagdoll(new BABYLON.Vector3(x, 3, z));
            }
            console.log('✅ Spawned 10 ragdolls');
            
            // Input
            scene.onKeyboardObservable.add((kbInfo) => {
                const key = kbInfo.event.key.toLowerCase();
                
                if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
                    keys[key] = true;
                    
                    if (key === 'e') {
                        console.log('🛹 Kickflip!');
                        gameState.kickflips++;
                        gameState.score += 1000;
                    }
                } else if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYUP) {
                    keys[key] = false;
                }
            });
            
            // Game loop
            engine.runRenderLoop(() => {
                // Player movement
                const moveForce = 50;
                const turnTorque = 5;
                
                if (keys['w']) {
                    const forward = playerCapsule.forward;
                    playerAggregate.body.applyForce(forward.scale(moveForce), playerCapsule.getAbsolutePosition());
                }
                if (keys['s']) {
                    const backward = playerCapsule.forward.scale(-1);
                    playerAggregate.body.applyForce(backward.scale(moveForce * 0.6), playerCapsule.getAbsolutePosition());
                }
                if (keys['a']) {
                    playerAggregate.body.applyTorque(new BABYLON.Vector3(0, turnTorque, 0));
                }
                if (keys['d']) {
                    playerAggregate.body.applyTorque(new BABYLON.Vector3(0, -turnTorque, 0));
                }
                if (keys[' ']) {
                    playerAggregate.body.applyImpulse(new BABYLON.Vector3(0, 300, 0), playerCapsule.getAbsolutePosition());
                    keys[' '] = false; // Prevent continuous jumping
                }
                
                // Roadkill detection
                const playerPos = playerCapsule.position;
                const vel = playerAggregate.body.getLinearVelocity();
                const speed = Math.sqrt(vel.x * vel.x + vel.z * vel.z);
                
                if (speed > 10) {
                    for (let [id, ragdoll] of gore.ragdolls) {
                        if (!ragdoll.alive) continue;
                        
                        const ragdollPos = ragdoll.root.position;
                        const distance = BABYLON.Vector3.Distance(playerPos, ragdollPos);
                        
                        if (distance < 2.5) {
                            ragdoll.alive = false;
                            gameState.roadkills++;
                            gameState.score += 500;
                            
                            console.log(`💀 ROADKILL! Total: ${gameState.roadkills}/10`);
                            
                            // Launch ragdoll
                            const launchDir = ragdollPos.subtract(playerPos).normalize();
                            const launchForce = launchDir.scale(speed * 100);
                            ragdoll.aggregate.body.applyImpulse(launchForce, ragdollPos);
                        }
                    }
                }
                
                // Check objectives
                if (gameState.roadkills >= 10 && gameState.kickflips >= 5 && !gameState.bossSpawned) {
                    console.log('🎯 OBJECTIVES COMPLETE!');
                    console.log('👹 Boss would spawn here...');
                    gameState.bossSpawned = true;
                }
                
                updateHUD();
                scene.render();
            });
            
            window.addEventListener('resize', () => engine.resize());
            
            console.log('✅ Game started!');
            console.log('🎮 Use WASD to move, SPACE to jump, E for kickflip');
        }
        
        init();
    </script>
</body>
</html>
