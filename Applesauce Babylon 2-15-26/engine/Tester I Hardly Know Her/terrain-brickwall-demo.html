<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terrain + Brick Wall Demo</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Courier New', monospace; 
        }
        #renderCanvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0,0,0,0.92);
            padding: 20px;
            border: 2px solid #0f0;
            max-width: 300px;
        }
        .title {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
        }
        .section {
            margin: 10px 0;
            font-size: 13px;
        }
        .label {
            color: #0a0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="info">
        <div class="title">🧱 BRICK WALL TERRAIN DEMO</div>
        
        <div class="section">
            <div class="label">CONTROLS:</div>
            <div>W/A/S/D - Move</div>
            <div>SPACE - Jump</div>
            <div>Mouse - Look Around</div>
        </div>
        
        <div class="section">
            <div class="label">PHYSICS:</div>
            <div>Velocity: <span id="vel">0.0</span> m/s</div>
            <div>Bricks: <span id="bricks">0</span></div>
        </div>
        
        <div class="section">
            <div class="label">FEATURES:</div>
            <div>✓ Havok Physics</div>
            <div>✓ Dynamic Bricks</div>
            <div>✓ Terrain Module</div>
        </div>
    </div>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script type="module">
        import { BabylonTerrain } from '../terrain/babylon-terrain.js';
        
        let player, playerAggregate, terrain;
        let keys = {};
        
        async function init() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true);
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.5, 0.8, 0.95, 1);
            
            /**
     * Setup camera
     */const camera =
            // 1. Create a Pivot Point (so we don't look at the player's feet)
            this.cameraTarget = new BABYLON.TransformNode("cameraTarget", this.scene);
            this.cameraTarget.parent = this.playerMesh; // Replace with your player variable
            this.cameraTarget.position = new BABYLON.Vector3(0, 1.5, 0); // Eye-level height

            // 2. Initialize ArcRotateCamera
            // Parameters: name, alpha (rotation), beta (pitch), radius, target, scene
            this.camera = new BABYLON.ArcRotateCamera(
                "3rdPersonCam",
                BABYLON.Tools.ToRadians(-90), // Alpha: horizontal angle
                BABYLON.Tools.ToRadians(70),  // Beta: vertical angle (looking down slightly)
                10,                           // Radius: distance from target
                this.cameraTarget.position,   // Target position
                this.scene
            );

            // 3. Link the camera to the pivot node
            this.camera.lockedTarget = this.cameraTarget;

            // 4. Fine-tuning the feel
            this.camera.wheelPrecision = 50;       // Adjust mouse wheel zoom speed
            this.camera.lowerRadiusLimit = 2;      // How close can you zoom in?
            this.camera.upperRadiusLimit = 20;     // How far can you zoom out?
            this.camera.panningSensibility = 0;    // Disable right-click panning (standard for 3rd person)
            
            // 5. Attach controls to the canvas
            this.camera.attachControl(this.scene.getEngine().getRenderingCanvas(), true);

            console.log('📷 ArcRotateCamera configured');
        }
            
            // Lighting
            const light = new BABYLON.HemisphericLight(
                "light", 
                new BABYLON.Vector3(0, 1, 0), 
                this.scene
            );
            light.intensity = 0.8;
            
            // Shadows
            const shadowLight = new BABYLON.DirectionalLight(
                "dirLight",
                new BABYLON.Vector3(-1, -2, -1),
                scene
            );
            shadowLight.position = new BABYLON.Vector3(20, 40, 20);
            shadowLight.intensity = 0.5;
            
            // Initialize Havok Physics
            console.log('🔧 Loading Havok...');
            const havok = await HavokPhysics();
            const plugin = new BABYLON.HavokPlugin(true, havok);
            scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), plugin);
            console.log('✅ Havok ready');
            
            // Initialize terrain system
            terrain = new BabylonTerrain(scene, plugin);
            
            // Generate terrain with brick walls
            terrain.generate({
                type: 'flat',
                size: 80,
                color: { r: 0.35, g: 0.5, b: 0.3 }, // Grass
                objects: [
                    // Main brick wall - right in front of spawn
                    {
                        type: 'brickwall',
                        position: { x: -3, y: 0, z: 8 },
                        rows: 8,
                        columns: 6,
                        brickWidth: 1.2,
                        brickHeight: 0.6,
                        brickDepth: 0.6,
                        brickColor: { r: 0.6, g: 0.2, b: 0.2 },
                        brickMass: 5,
                        friction: 0.8,
                        restitution: 0.1,
                        colorVariation: true
                    },
                    // Second wall - different config
                    {
                        type: 'brickwall',
                        position: { x: 10, y: 0, z: 12 },
                        rows: 6,
                        columns: 4,
                        brickColor: { r: 0.4, g: 0.25, b: 0.15 }, // Darker brown
                        brickMass: 3,
                        colorVariation: true
                    },
                    // Some other objects for fun
                    {
                        type: 'sphere',
                        position: { x: -8, y: 2, z: 5 },
                        diameter: 1,
                        color: { r: 0.9, g: 0.1, b: 0.1 },
                        mass: 10
                    },
                    {
                        type: 'box',
                        position: { x: 8, y: 3, z: 5 },
                        size: { width: 1.5, height: 1.5, depth: 1.5 },
                        color: { r: 0.2, g: 0.6, b: 0.9 },
                        mass: 20
                    }
                ]
            });
            
            // Create player (physics-enabled box)
            player = BABYLON.MeshBuilder.CreateBox(
                "player", 
                { width: 0.8, height: 1.8, depth: 0.8 }, 
                scene
            );
            player.position = new BABYLON.Vector3(0, 2, 0);
            
            const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
            playerMat.diffuseColor = new BABYLON.Color3(1, 0.5, 0);
            player.material = playerMat;
            
            // Player physics
            playerAggregate = new BABYLON.PhysicsAggregate(
                player,
                BABYLON.PhysicsShapeType.BOX,
                { mass: 70, restitution: 0.1, friction: 0.5 },
                scene
            );
            
            // Camera follows player
            camera.parent = player;
            camera.position = new BABYLON.Vector3(0, 0.5, 0);
            
            // Input handling
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
            });
            
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
            
            // Update brick count
            const brickCount = terrain.worldObjects.filter(obj => obj.type === 'brick').length;
            document.getElementById('bricks').textContent = brickCount;
            
            // Render loop
            engine.runRenderLoop(() => {
                // Movement forces
                const moveForce = 80;
                const impulseStrength = 300;
                
                if (keys['w']) {
                    const forward = camera.getDirection(BABYLON.Vector3.Forward());
                    forward.y = 0; // Keep horizontal
                    forward.normalize();
                    playerAggregate.body.applyForce(
                        forward.scale(moveForce),
                        player.getAbsolutePosition()
                    );
                }
                
                if (keys['s']) {
                    const backward = camera.getDirection(BABYLON.Vector3.Backward());
                    backward.y = 0;
                    backward.normalize();
                    playerAggregate.body.applyForce(
                        backward.scale(moveForce),
                        player.getAbsolutePosition()
                    );
                }
                
                if (keys['a']) {
                    const left = camera.getDirection(BABYLON.Vector3.Left());
                    left.y = 0;
                    left.normalize();
                    playerAggregate.body.applyForce(
                        left.scale(moveForce),
                        player.getAbsolutePosition()
                    );
                }
                
                if (keys['d']) {
                    const right = camera.getDirection(BABYLON.Vector3.Right());
                    right.y = 0;
                    right.normalize();
                    playerAggregate.body.applyForce(
                        right.scale(moveForce),
                        player.getAbsolutePosition()
                    );
                }
                
                if (keys[' ']) {
                    playerAggregate.body.applyImpulse(
                        new BABYLON.Vector3(0, impulseStrength, 0),
                        player.getAbsolutePosition()
                    );
                }
                
                // Update HUD
                const vel = playerAggregate.body.getLinearVelocity();
                document.getElementById('vel').textContent = vel.length().toFixed(1);
                
                scene.render();
            });
            
            window.addEventListener('resize', () => engine.resize());
            
            console.log('✅ Scene ready! Smash into those brick walls!');
        
        init();
    </script>
</body>
</html>
