<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Procedural Texture Lab — Havok Physics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'JetBrains Mono', monospace; }
        #renderCanvas { width: 100%; height: 100%; display: block; }

        /* ── HUD overlay ── */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #c8ffa0;
            background: rgba(8, 12, 6, 0.88);
            padding: 14px 18px;
            border: 1px solid rgba(120, 255, 60, 0.25);
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            backdrop-filter: blur(12px);
            pointer-events: none;
            z-index: 10;
        }
        #hud .title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #7fff3c;
            margin-bottom: 6px;
        }
        #hud kbd {
            display: inline-block;
            background: rgba(127, 255, 60, 0.12);
            border: 1px solid rgba(127, 255, 60, 0.3);
            border-radius: 3px;
            padding: 0 5px;
            font-size: 11px;
            color: #a8ff70;
        }
        #hud .val { color: #fff; font-weight: 500; }

        /* ── Debug Panel ── */
        #debugPanel {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 320px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            background: rgba(8, 12, 6, 0.92);
            border: 1px solid rgba(120, 255, 60, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(16px);
            color: #d0d0d0;
            font-size: 11px;
            z-index: 20;
        }
        #debugPanel::-webkit-scrollbar { width: 4px; }
        #debugPanel::-webkit-scrollbar-track { background: transparent; }
        #debugPanel::-webkit-scrollbar-thumb { background: rgba(127,255,60,0.25); border-radius: 2px; }

        .panel-header {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #7fff3c;
            padding: 14px 16px 10px;
            border-bottom: 1px solid rgba(120, 255, 60, 0.12);
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            background: rgba(8, 12, 6, 0.98);
            z-index: 2;
        }
        .panel-header .dot {
            width: 7px; height: 7px;
            background: #7fff3c;
            border-radius: 50%;
            box-shadow: 0 0 6px #7fff3c;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .section {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(120, 255, 60, 0.08);
        }
        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #6a8a55;
            margin-bottom: 10px;
        }

        /* Texture selector buttons */
        .tex-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .tex-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            padding: 7px 4px;
            border: 1px solid rgba(120, 255, 60, 0.15);
            border-radius: 4px;
            background: rgba(120, 255, 60, 0.04);
            color: #8a8a8a;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .tex-btn:hover {
            background: rgba(120, 255, 60, 0.1);
            color: #c0c0c0;
            border-color: rgba(120, 255, 60, 0.3);
        }
        .tex-btn.active {
            background: rgba(127, 255, 60, 0.15);
            color: #7fff3c;
            border-color: rgba(127, 255, 60, 0.5);
            box-shadow: 0 0 8px rgba(127, 255, 60, 0.1);
        }

        /* Slider rows */
        .ctrl-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 8px;
        }
        .ctrl-label {
            font-size: 10px;
            color: #7a9a6a;
            min-width: 85px;
            letter-spacing: 0.3px;
        }
        .ctrl-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 3px;
            background: rgba(120, 255, 60, 0.15);
            border-radius: 2px;
            outline: none;
        }
        .ctrl-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            background: #7fff3c;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(127,255,60,0.4);
        }
        .ctrl-val {
            font-size: 10px;
            color: #aaa;
            min-width: 38px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Color picker */
        .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .color-row label {
            font-size: 10px;
            color: #7a9a6a;
            min-width: 85px;
        }
        .color-row input[type="color"] {
            -webkit-appearance: none;
            width: 28px; height: 20px;
            border: 1px solid rgba(120,255,60,0.25);
            border-radius: 3px;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }
        .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
        .color-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
        .color-hex {
            font-size: 10px;
            color: #666;
        }

        /* Material slot selector */
        .slot-row {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .slot-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            padding: 4px 8px;
            border: 1px solid rgba(120,255,60,0.15);
            border-radius: 3px;
            background: rgba(120,255,60,0.04);
            color: #777;
            cursor: pointer;
            transition: all 0.15s;
        }
        .slot-btn:hover { color: #aaa; border-color: rgba(120,255,60,0.3); }
        .slot-btn.active {
            color: #7fff3c;
            background: rgba(127,255,60,0.12);
            border-color: rgba(127,255,60,0.4);
        }

        /* Texture resolution selector */
        .res-row {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        .res-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            padding: 4px 8px;
            border: 1px solid rgba(120,255,60,0.15);
            border-radius: 3px;
            background: rgba(120,255,60,0.04);
            color: #777;
            cursor: pointer;
            transition: all 0.15s;
        }
        .res-btn:hover { color: #aaa; }
        .res-btn.active {
            color: #7fff3c;
            background: rgba(127,255,60,0.12);
            border-color: rgba(127,255,60,0.4);
        }

        #texProps { min-height: 40px; }

        /* Toggle panel */
        #togglePanel {
            position: absolute;
            top: 16px;
            right: 344px;
            z-index: 25;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 6px 10px;
            border: 1px solid rgba(120,255,60,0.25);
            border-radius: 4px;
            background: rgba(8,12,6,0.88);
            color: #7fff3c;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        #togglePanel:hover { background: rgba(120,255,60,0.1); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="title">⚗ Procedural Texture Lab</div>
        <div><kbd>W</kbd> forward &nbsp; <kbd>A</kbd><kbd>D</kbd> strafe &nbsp; <kbd>Space</kbd> jump</div>
        <div>Velocity: <span class="val" id="vel">—</span></div>
        <div>Position: <span class="val" id="pos">—</span></div>
    </div>

    <!-- Toggle -->
    <button id="togglePanel" onclick="document.getElementById('debugPanel').classList.toggle('hidden')">◧ Panel</button>

    <!-- Debug Panel -->
    <div id="debugPanel">
        <div class="panel-header"><span class="dot"></span> Texture Debug</div>

        <!-- Texture Type -->
        <div class="section">
            <div class="section-title">Texture Type</div>
            <div class="tex-grid" id="texGrid"></div>
        </div>

        <!-- Material Slot -->
        <div class="section">
            <div class="section-title">Material Slot</div>
            <div class="slot-row" id="slotRow"></div>
        </div>

        <!-- Resolution -->
        <div class="section">
            <div class="section-title">Resolution</div>
            <div class="res-row" id="resRow"></div>
        </div>

        <!-- Texture-specific properties -->
        <div class="section">
            <div class="section-title">Properties</div>
            <div id="texProps"></div>
        </div>

        <!-- Ground Settings -->
        <div class="section">
            <div class="section-title">Ground</div>
            <div class="ctrl-row">
                <span class="ctrl-label">Scale U</span>
                <input type="range" min="1" max="20" step="0.5" value="4" id="scaleU">
                <span class="ctrl-val" id="scaleUVal">4</span>
            </div>
            <div class="ctrl-row">
                <span class="ctrl-label">Scale V</span>
                <input type="range" min="1" max="20" step="0.5" value="4" id="scaleV">
                <span class="ctrl-val" id="scaleVVal">4</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>

    <script>
    // ════════════════════════════════════════
    //  STATE
    // ════════════════════════════════════════
    let scene, ground, groundMat, box, boxAggregate, keys = {};
    let currentTexture = null;
    let currentType = 'grass';
    let currentSlot = 'diffuseTexture';
    let currentRes = 512;

    const TEXTURES = {
        grass:  { label: 'Grass',  cls: 'GrassProceduralTexture'  },
        wood:   { label: 'Wood',   cls: 'WoodProceduralTexture'   },
        marble: { label: 'Marble', cls: 'MarbleProceduralTexture' },
        brick:  { label: 'Brick',  cls: 'BrickProceduralTexture'  },
        fire:   { label: 'Fire',   cls: 'FireProceduralTexture'   },
        cloud:  { label: 'Cloud',  cls: 'CloudProceduralTexture'  },
        road:   { label: 'Road',   cls: 'RoadProceduralTexture'   },
        noise:  { label: 'Noise',  cls: 'NoiseProceduralTexture'  },
    };

    const SLOTS = ['diffuseTexture', 'ambientTexture', 'emissiveTexture', 'specularTexture'];
    const RESOLUTIONS = [64, 128, 256, 512, 1024];

    // ════════════════════════════════════════
    //  UI BUILDERS
    // ════════════════════════════════════════

    function buildTexGrid() {
        const grid = document.getElementById('texGrid');
        grid.innerHTML = '';
        for (const [key, info] of Object.entries(TEXTURES)) {
            const btn = document.createElement('button');
            btn.className = 'tex-btn' + (key === currentType ? ' active' : '');
            btn.textContent = info.label;
            btn.onclick = () => switchTexture(key);
            grid.appendChild(btn);
        }
    }

    function buildSlotRow() {
        const row = document.getElementById('slotRow');
        row.innerHTML = '';
        SLOTS.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'slot-btn' + (s === currentSlot ? ' active' : '');
            btn.textContent = s.replace('Texture', '');
            btn.onclick = () => { currentSlot = s; applyTexture(); buildSlotRow(); };
            row.appendChild(btn);
        });
    }

    function buildResRow() {
        const row = document.getElementById('resRow');
        row.innerHTML = '';
        RESOLUTIONS.forEach(r => {
            const btn = document.createElement('button');
            btn.className = 'res-btn' + (r === currentRes ? ' active' : '');
            btn.textContent = r + 'px';
            btn.onclick = () => { currentRes = r; applyTexture(); buildResRow(); };
            row.appendChild(btn);
        });
    }

    // ════════════════════════════════════════
    //  TEXTURE CREATION & PROPERTY UI
    // ════════════════════════════════════════

    function createTexture(type, res) {
        const info = TEXTURES[type];
        if (!info) return null;

        // Noise is in core, others are in the procedural library
        if (type === 'noise') {
            return new BABYLON.NoiseProceduralTexture(type + 'Tex', res, scene);
        }
        return new BABYLON[info.cls](type + 'Tex', res, scene);
    }

    function switchTexture(type) {
        currentType = type;
        applyTexture();
        buildTexGrid();
        buildProps();
    }

    function applyTexture() {
        if (currentTexture) { currentTexture.dispose(); }
        currentTexture = createTexture(currentType, currentRes);
        if (!currentTexture) return;

        // Clear all texture slots first
        SLOTS.forEach(s => { groundMat[s] = null; });
        groundMat[currentSlot] = currentTexture;

        // Apply UV scale
        currentTexture.uScale = parseFloat(document.getElementById('scaleU').value);
        currentTexture.vScale = parseFloat(document.getElementById('scaleV').value);

        buildProps();
    }

    // ── Color3 helper ──
    function c3toHex(c) {
        const r = Math.round(c.r * 255).toString(16).padStart(2, '0');
        const g = Math.round(c.g * 255).toString(16).padStart(2, '0');
        const b = Math.round(c.b * 255).toString(16).padStart(2, '0');
        return '#' + r + g + b;
    }
    function hexToC3(hex) {
        const r = parseInt(hex.substring(1, 3), 16) / 255;
        const g = parseInt(hex.substring(3, 5), 16) / 255;
        const b = parseInt(hex.substring(5, 7), 16) / 255;
        return new BABYLON.Color3(r, g, b);
    }

    function addSlider(container, label, min, max, step, value, onChange) {
        const row = document.createElement('div');
        row.className = 'ctrl-row';

        const lbl = document.createElement('span');
        lbl.className = 'ctrl-label';
        lbl.textContent = label;

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = min; slider.max = max; slider.step = step;
        slider.value = value;

        const val = document.createElement('span');
        val.className = 'ctrl-val';
        val.textContent = parseFloat(value).toFixed(step < 1 ? 2 : 0);

        slider.oninput = () => {
            val.textContent = parseFloat(slider.value).toFixed(step < 1 ? 2 : 0);
            onChange(parseFloat(slider.value));
        };

        row.append(lbl, slider, val);
        container.appendChild(row);
    }

    function addColorPicker(container, label, initialColor3, onChange) {
        const row = document.createElement('div');
        row.className = 'color-row';

        const lbl = document.createElement('label');
        lbl.textContent = label;

        const picker = document.createElement('input');
        picker.type = 'color';
        picker.value = c3toHex(initialColor3);

        const hex = document.createElement('span');
        hex.className = 'color-hex';
        hex.textContent = picker.value;

        picker.oninput = () => {
            hex.textContent = picker.value;
            onChange(hexToC3(picker.value));
        };

        row.append(lbl, picker, hex);
        container.appendChild(row);
    }

    function buildProps() {
        const container = document.getElementById('texProps');
        container.innerHTML = '';
        const tex = currentTexture;
        if (!tex) return;

        switch (currentType) {
            case 'grass': {
                // grassColors is an array of 3 Color3
                const gc = tex.grassColors || [
                    new BABYLON.Color3(0.29, 0.38, 0.02),
                    new BABYLON.Color3(0.36, 0.49, 0.09),
                    new BABYLON.Color3(0.51, 0.60, 0.28),
                ];
                gc.forEach((c, i) => {
                    addColorPicker(container, `Grass ${i + 1}`, c, (nc) => {
                        const arr = tex.grassColors;
                        arr[i] = nc;
                        tex.grassColors = arr;
                    });
                });
                addColorPicker(container, 'Ground', tex.groundColor || new BABYLON.Color3(0.2, 0.1, 0.0), (c) => { tex.groundColor = c; });
                break;
            }
            case 'wood': {
                addColorPicker(container, 'Wood Color', tex.woodColor || new BABYLON.Color3(0.49, 0.25, 0.0), (c) => { tex.woodColor = c; });
                addSlider(container, 'Amp Scale X', 0.1, 10, 0.1, tex.ampScale ? tex.ampScale.x : 1.0, (v) => {
                    tex.ampScale = new BABYLON.Vector2(v, tex.ampScale ? tex.ampScale.y : 1.0);
                });
                addSlider(container, 'Amp Scale Y', 0.1, 10, 0.1, tex.ampScale ? tex.ampScale.y : 1.0, (v) => {
                    tex.ampScale = new BABYLON.Vector2(tex.ampScale ? tex.ampScale.x : 1.0, v);
                });
                break;
            }
            case 'marble': {
                addSlider(container, 'Tiles Height', 1, 20, 1, tex.numberOfTilesHeight || 3, (v) => { tex.numberOfTilesHeight = v; });
                addSlider(container, 'Tiles Width', 1, 20, 1, tex.numberOfTilesWidth || 3, (v) => { tex.numberOfTilesWidth = v; });
                addColorPicker(container, 'Joint Color', tex.jointColor || new BABYLON.Color3(0.58, 0.57, 0.51), (c) => { tex.jointColor = c; });
                break;
            }
            case 'brick': {
                addSlider(container, 'Rows', 1, 20, 1, tex.numberOfBricksHeight || 5, (v) => { tex.numberOfBricksHeight = v; });
                addSlider(container, 'Columns', 1, 20, 1, tex.numberOfBricksWidth || 5, (v) => { tex.numberOfBricksWidth = v; });
                addColorPicker(container, 'Brick Color', tex.brickColor || new BABYLON.Color3(0.45, 0.2, 0.1), (c) => { tex.brickColor = c; });
                addColorPicker(container, 'Joint Color', tex.jointColor || new BABYLON.Color3(0.72, 0.72, 0.72), (c) => { tex.jointColor = c; });
                break;
            }
            case 'fire': {
                addSlider(container, 'Speed X', 0, 2, 0.05, tex.speed ? tex.speed.x : 0.5, (v) => {
                    tex.speed = new BABYLON.Vector2(v, tex.speed ? tex.speed.y : 0.3);
                });
                addSlider(container, 'Speed Y', 0, 2, 0.05, tex.speed ? tex.speed.y : 0.3, (v) => {
                    tex.speed = new BABYLON.Vector2(tex.speed ? tex.speed.x : 0.5, v);
                });
                // Fire color presets
                const presetRow = document.createElement('div');
                presetRow.className = 'slot-row';
                presetRow.style.marginTop = '6px';
                const presets = [
                    { name: 'Default', colors: null },
                    { name: 'Purple', colors: BABYLON.FireProceduralTexture.PurpleFireColors },
                    { name: 'Green', colors: BABYLON.FireProceduralTexture.GreenFireColors },
                    { name: 'Red', colors: BABYLON.FireProceduralTexture.RedFireColors },
                    { name: 'Blue', colors: BABYLON.FireProceduralTexture.BlueFireColors },
                ];
                presets.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = 'slot-btn';
                    btn.textContent = p.name;
                    btn.onclick = () => { if (p.colors) tex.fireColors = p.colors; };
                    presetRow.appendChild(btn);
                });
                container.appendChild(presetRow);
                break;
            }
            case 'cloud': {
                addColorPicker(container, 'Sky Color', tex.skyColor || new BABYLON.Color3(0.15, 0.68, 1.0), (c) => { tex.skyColor = c; });
                addColorPicker(container, 'Cloud Color', tex.cloudColor || new BABYLON.Color3(1, 1, 1), (c) => { tex.cloudColor = c; });
                break;
            }
            case 'road': {
                addColorPicker(container, 'Road Color', tex.roadColor || new BABYLON.Color3(0.53, 0.53, 0.53), (c) => { tex.roadColor = c; });
                break;
            }
            case 'noise': {
                addSlider(container, 'Brightness', 0, 1, 0.01, tex.brightness ?? 0.2, (v) => { tex.brightness = v; });
                addSlider(container, 'Octaves', 1, 12, 1, tex.octaves ?? 3, (v) => { tex.octaves = v; });
                addSlider(container, 'Persistence', 0, 2, 0.01, tex.persistence ?? 0.8, (v) => { tex.persistence = v; });
                addSlider(container, 'Anim Speed', 0, 5, 0.1, tex.animationSpeedFactor ?? 1, (v) => { tex.animationSpeedFactor = v; });
                break;
            }
        }
    }

    // ════════════════════════════════════════
    //  UV SCALE LISTENERS
    // ════════════════════════════════════════
    document.getElementById('scaleU').oninput = function () {
        document.getElementById('scaleUVal').textContent = parseFloat(this.value).toFixed(1);
        if (currentTexture) currentTexture.uScale = parseFloat(this.value);
    };
    document.getElementById('scaleV').oninput = function () {
        document.getElementById('scaleVVal').textContent = parseFloat(this.value).toFixed(1);
        if (currentTexture) currentTexture.vScale = parseFloat(this.value);
    };

    // ════════════════════════════════════════
    //  MAIN INIT
    // ════════════════════════════════════════
    async function init() {
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { stencil: true });
        scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.42, 0.65, 0.82, 1);

        // ── Camera ──
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 3, 18, BABYLON.Vector3.Zero(), scene);
        camera.lowerRadiusLimit = 5;
        camera.upperRadiusLimit = 50;
        camera.attachControl(canvas, true);

        // ── Lights ──
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemi.intensity = 0.85;
        const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-0.5, -1, 0.5), scene);
        dir.intensity = 0.5;

        // ── Havok Physics ──
        console.log('Loading Havok...');
        const havok = await HavokPhysics();
        const plugin = new BABYLON.HavokPlugin(true, havok);
        scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), plugin);
        console.log('✅ Havok ready');

        // ── Ground ──
        ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 3000, height: 3000 }, scene);
        groundMat = new BABYLON.StandardMaterial("groundMat", scene);
        ground.material = groundMat;
        new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.BOX, { mass: 0, friction: 0.6 }, scene);

        // Apply initial grass texture
        applyTexture();

        // ── Test Box (player stand-in) ──
        box = BABYLON.MeshBuilder.CreateBox("box", { width: 1, height: 2, depth: 0.5 }, scene);
        box.position = new BABYLON.Vector3(0, 5, 0);
        const boxMat = new BABYLON.StandardMaterial("boxMat", scene);
        boxMat.diffuseColor = new BABYLON.Color3(0.85, 0.15, 0.15);
        boxMat.specularColor = new BABYLON.Color3(0.4, 0.1, 0.1);
        box.material = boxMat;

        boxAggregate = new BABYLON.PhysicsAggregate(
            box,
            BABYLON.PhysicsShapeType.BOX,
            { mass: 70, restitution: 0.1, friction: 0.4 },
            scene
        );

        console.log('Box physics body ready — mass:', boxAggregate.body.getMassProperties().mass);

        // ── A few extra boxes for fun ──
        for (let i = 0; i < 5; i++) {
            const b = BABYLON.MeshBuilder.CreateBox("crate" + i, { size: 0.8 }, scene);
            b.position = new BABYLON.Vector3((Math.random() - 0.5) * 10, 3 + i * 2, (Math.random() - 0.5) * 10);
            const m = new BABYLON.StandardMaterial("crateMat" + i, scene);
            m.diffuseColor = new BABYLON.Color3(0.6 + Math.random() * 0.3, 0.3, 0.1);
            b.material = m;
            new BABYLON.PhysicsAggregate(b, BABYLON.PhysicsShapeType.BOX, { mass: 15, restitution: 0.3 }, scene);
        }

        // ── Input ──
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // ── Render Loop ──
        engine.runRenderLoop(() => {
            const force = 120;
            if (keys['w']) boxAggregate.body.applyForce(new BABYLON.Vector3(0, 0, force), box.getAbsolutePosition());
            if (keys['s']) boxAggregate.body.applyForce(new BABYLON.Vector3(0, 0, -force), box.getAbsolutePosition());
            if (keys['a']) boxAggregate.body.applyForce(new BABYLON.Vector3(-force, 0, 0), box.getAbsolutePosition());
            if (keys['d']) boxAggregate.body.applyForce(new BABYLON.Vector3(force, 0, 0), box.getAbsolutePosition());
            if (keys[' ']) {
                boxAggregate.body.applyImpulse(new BABYLON.Vector3(0, 300, 0), box.getAbsolutePosition());
                keys[' '] = false; // one-shot jump
            }

            // HUD
            const vel = boxAggregate.body.getLinearVelocity();
            const pos = box.position;
            document.getElementById('vel').textContent =
                `[${vel.x.toFixed(1)}, ${vel.y.toFixed(1)}, ${vel.z.toFixed(1)}] ${vel.length().toFixed(1)} m/s`;
            document.getElementById('pos').textContent =
                `[${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}]`;

            scene.render();
        });

        window.addEventListener('resize', () => engine.resize());
        console.log('✅ Ready — WASD + Space');
    }

    // Build UI, then start engine
    buildTexGrid();
    buildSlotRow();
    buildResRow();
    init();
    </script>
</body>
</html>
