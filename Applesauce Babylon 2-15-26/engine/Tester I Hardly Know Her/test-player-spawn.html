<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>APPLESAUCE - Player Spawn Test</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        #log {
            white-space: pre-wrap;
            font-size: 14px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🛹 APPLESAUCE Player Spawn Test</h1>
    <p>This minimal test isolates player spawning issues.</p>
    
    <div>
        <button onclick="testPlayerSpawn()">🔍 Test Player Spawn</button>
        <button onclick="showAllObjects()">📋 Show All Objects</button>
        <button onclick="tryFixPosition()">🔧 Try Fix Position</button>
        <button onclick="clearLog()">🗑️ Clear Log</button>
    </div>
    
    <h2>Log:</h2>
    <div id="log"></div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { ApplesauceCore } from './engine/applesauce-core-babylon.js';
        
        // Global references
        window.game = null;
        window.logOutput = [];
        
        function log(message, color = '#0f0') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;
            window.logOutput.push(entry);
            
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.textContent = entry;
            line.style.color = color;
            logDiv.appendChild(line);
            
            console.log(message);
        }
        
        window.clearLog = function() {
            document.getElementById('log').innerHTML = '';
            window.logOutput = [];
        };
        
        window.testPlayerSpawn = async function() {
            log('='.repeat(60));
            log('🔍 TESTING PLAYER SPAWN', '#ff0');
            log('='.repeat(60));
            
            try {
                // Initialize game
                log('1️⃣ Creating ApplesauceCore instance...');
                window.game = new ApplesauceCore({
                    goreEnabled: false,
                    dialogueEnabled: false,
                    enemiesEnabled: false
                });
                log('   ✅ Core created', '#0f0');
                
                // Add a simple test cube to verify scene works
                log('2️⃣ Adding test cube to scene...');
                const cubeGeo = new THREE.BoxGeometry(5, 5, 5);
                const cubeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const testCube = new THREE.Mesh(cubeGeo, cubeMat);
                testCube.position.set(0, 2.5, -10);
                game.scene.add(testCube);
                log('   ✅ Test cube added at (0, 2.5, -10)', '#0f0');
                
                // Start the game
                log('3️⃣ Starting game loop...');
                game.start();
                log('   ✅ Game started', '#0f0');
                
                // Wait for initialization
                log('4️⃣ Waiting 5 frames for player initialization...');
                for (let i = 0; i < 5; i++) {
                    await new Promise(resolve => requestAnimationFrame(resolve));
                    log(`   Frame ${i + 1}/5...`);
                }
                
                // Check for player objects
                log('5️⃣ Checking for player objects...', '#ff0');
                const candidates = [
                    'player',
                    'skater',
                    'character',
                    'controller',
                    'playerController',
                    'mesh',
                    'body'
                ];
                
                let foundPlayer = null;
                for (const name of candidates) {
                    if (game[name]) {
                        log(`   ✅ Found: game.${name}`, '#0f0');
                        if (!foundPlayer) foundPlayer = { name, obj: game[name] };
                    } else {
                        log(`   ❌ Not found: game.${name}`, '#f00');
                    }
                }
                
                // Check camera
                log('6️⃣ Checking camera...');
                if (game.camera) {
                    log(`   ✅ Camera exists`, '#0f0');
                    log(`   📍 Camera position: (${game.camera.position.x.toFixed(2)}, ${game.camera.position.y.toFixed(2)}, ${game.camera.position.z.toFixed(2)})`);
                } else {
                    log(`   ❌ No camera found!`, '#f00');
                }
                
                // Try to position player
                log('7️⃣ Attempting to position player...', '#ff0');
                const targetPos = { x: 0, y: 2, z: -5 };
                
                if (foundPlayer) {
                    log(`   Using: game.${foundPlayer.name}`, '#0f0');
                    foundPlayer.obj.position.set(targetPos.x, targetPos.y, targetPos.z);
                    log(`   ✅ Set position to: (${targetPos.x}, ${targetPos.y}, ${targetPos.z})`, '#0f0');
                    
                    // Verify it stuck
                    await new Promise(resolve => requestAnimationFrame(resolve));
                    const actualPos = foundPlayer.obj.position;
                    log(`   📍 Actual position: (${actualPos.x.toFixed(2)}, ${actualPos.y.toFixed(2)}, ${actualPos.z.toFixed(2)})`);
                    
                    if (actualPos.y < 0) {
                        log(`   ⚠️ Player Y is negative! Falling through floor?`, '#fa0');
                    }
                } else if (game.camera) {
                    log(`   No player object, using camera as fallback`, '#fa0');
                    game.camera.position.set(targetPos.x, targetPos.y, targetPos.z);
                    log(`   ✅ Set camera position`, '#0f0');
                } else {
                    log(`   ❌ No player or camera object to position!`, '#f00');
                }
                
                log('='.repeat(60));
                log('✅ TEST COMPLETE', '#0f0');
                log('Check the viewport above. You should see a red cube.', '#ff0');
                log('='.repeat(60));
                
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, '#f00');
                log(`Stack: ${error.stack}`, '#f00');
            }
        };
        
        window.showAllObjects = function() {
            if (!window.game) {
                log('❌ No game instance. Run "Test Player Spawn" first!', '#f00');
                return;
            }
            
            log('='.repeat(60));
            log('📋 ALL GAME OBJECTS', '#ff0');
            log('='.repeat(60));
            
            const keys = Object.keys(game);
            log(`Found ${keys.length} properties on game object:`);
            
            keys.forEach(key => {
                const value = game[key];
                const type = value?.constructor?.name || typeof value;
                
                if (value && value.position) {
                    log(`  ✅ ${key}: ${type} - position: (${value.position.x.toFixed(2)}, ${value.position.y.toFixed(2)}, ${value.position.z.toFixed(2)})`, '#0f0');
                } else if (typeof value === 'object' && value !== null) {
                    log(`  📦 ${key}: ${type}`);
                } else if (typeof value === 'function') {
                    log(`  ⚙️ ${key}: function`);
                } else {
                    log(`  📄 ${key}: ${type} = ${value}`);
                }
            });
            
            log('='.repeat(60));
        };
        
        window.tryFixPosition = function() {
            if (!window.game) {
                log('❌ No game instance. Run "Test Player Spawn" first!', '#f00');
                return;
            }
            
            log('='.repeat(60));
            log('🔧 ATTEMPTING POSITION FIX', '#ff0');
            log('='.repeat(60));
            
            const targetPos = { x: 0, y: 5, z: 0 };
            let fixed = false;
            
            // Try all possible player objects
            const candidates = ['player', 'skater', 'character', 'controller', 'camera'];
            for (const name of candidates) {
                if (game[name] && game[name].position) {
                    log(`Trying game.${name}...`);
                    game[name].position.set(targetPos.x, targetPos.y, targetPos.z);
                    log(`✅ Set game.${name} to (${targetPos.x}, ${targetPos.y}, ${targetPos.z})`, '#0f0');
                    fixed = true;
                }
            }
            
            if (!fixed) {
                log('❌ Could not find any positionable object!', '#f00');
            }
            
            log('='.repeat(60));
        };
        
        // Auto-run test on load
        log('Page loaded. Click "Test Player Spawn" to begin.', '#ff0');
    </script>
</body>
</html>
