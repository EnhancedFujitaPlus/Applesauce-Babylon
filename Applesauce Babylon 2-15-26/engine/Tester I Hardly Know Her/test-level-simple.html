<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - HAVOK EDITION</title>
    
    <!-- Babylon.js + Havok -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 100;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }
        
        #score {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        #combo {
            font-size: 32px;
            color: #FF1493;
            margin-bottom: 10px;
        }
        
        #trick {
            font-size: 28px;
            color: #00FF00;
            margin-bottom: 10px;
            min-height: 35px;
        }
        
        #speed {
            font-size: 24px;
            color: #00FFFF;
        }
        
        #kills {
            font-size: 20px;
            color: #FF0000;
            margin-top: 5px;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }
        
        #title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
            pointer-events: none;
        }
        
        #title h1 {
            font-size: 72px;
            color: #FF0000;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
        
        #title p {
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }
        
        .fade-out {
            animation: fadeOut 2s forwards;
        }
        
        @keyframes fadeOut {
            to { opacity: 0; }
        }
        
        /* Blood flash */
        #bloodFlash {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(255,0,0,0.7) 0%, rgba(139,0,0,0) 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            transition: opacity 0.15s;
        }
        
        .blood-splatter {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139,0,0,0.9) 20%, rgba(255,0,0,0.5) 50%, transparent 70%);
            pointer-events: none;
            z-index: 60;
            animation: bloodFade 2.5s ease-out forwards;
        }
        
        @keyframes bloodFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }
    </style>
</head>
<body>
    <div id="title">
        <h1>APPLESAUCE</h1>
        <p>Level 1: DOWNHILL BOMB</p>
        <p style="font-size: 16px; margin-top: 10px; color: #FF0000;">⚠️ HAVOK DESTRUCTION MODE ⚠️</p>
    </div>
    
    <div id="bloodFlash"></div>
    
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="combo">COMBO: 0x</div>
        <div id="trick"></div>
        <div id="speed">SPEED: 0</div>
        <div id="kills">KILLS: 0</div>
        <div id="debris" style="font-size: 16px; color: #FFA500; margin-top: 5px;">DEBRIS: 0</div>
    </div>
    
    <div id="controls">
        <strong>HAVOK CONTROLS:</strong><br>
        WASD - Move & Steer<br>
        SPACE - Ollie<br>
        Q - Kickflip | E - Heelflip<br>
        Hit buildings FAST = DESTRUCTION<br>
        Hit enemies at speed = ROADKILL<br>
        Click to lock mouse
    </div>
    
    <canvas id="renderCanvas"></canvas>
    
    <script>
        // ==========================================
        // BABYLON.JS + HAVOK SETUP
        // ==========================================
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let scene, camera, skater, skaterBody;
        let goreSystem, destructionSystem;
        let gameState = {
            score: 0,
            combo: 0,
            comboTimer: 0,
            kills: 0,
            debris: 0,
            currentTrick: '',
            trickTimer: 0,
            speed: 0,
            grounded: false,
            grinding: false,
            jumping: false,
            jumpVelocity: 0,
            flipRotation: 0,
            spinRotation: 0
        };
        
        const keys = {};
        
        // ==========================================
        // GORE SYSTEM (HAVOK VERSION)
        // ==========================================
        
        class HavokGoreSystem {
            constructor(scene) {
                this.scene = scene;
                this.bloodParticles = [];
                this.gibs = [];
                this.maxBlood = 500;
                this.maxGibs = 50;
                this.materials = this.createMaterials();
            }
            
            createMaterials() {
                const bloodMat = new BABYLON.StandardMaterial("bloodMat", this.scene);
                bloodMat.diffuseColor = new BABYLON.Color3(0.54, 0, 0);
                bloodMat.emissiveColor = new BABYLON.Color3(0.3, 0, 0);
                bloodMat.alpha = 0.9;
                
                const gibMat = new BABYLON.StandardMaterial("gibMat", this.scene);
                gibMat.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.15);
                
                return { bloodMat, gibMat };
            }
            
            triggerBloodFlash() {
                const flash = document.getElementById('bloodFlash');
                flash.style.opacity = '1';
                setTimeout(() => flash.style.opacity = '0', 150);
            }
            
            createLensSplatter(count = 3) {
                for (let i = 0; i < count; i++) {
                    const splatter = document.createElement('div');
                    splatter.className = 'blood-splatter';
                    
                    const edge = Math.floor(Math.random() * 4);
                    const offset = Math.random() * 80 + 10;
                    const size = 80 + Math.random() * 120;
                    
                    splatter.style.width = size + 'px';
                    splatter.style.height = size + 'px';
                    
                    switch(edge) {
                        case 0: splatter.style.left = offset + '%'; splatter.style.top = '-50px'; break;
                        case 1: splatter.style.right = '-50px'; splatter.style.top = offset + '%'; break;
                        case 2: splatter.style.left = offset + '%'; splatter.style.bottom = '-50px'; break;
                        case 3: splatter.style.left = '-50px'; splatter.style.top = offset + '%'; break;
                    }
                    
                    document.body.appendChild(splatter);
                    setTimeout(() => splatter.remove(), 2500);
                }
            }
            
            createBloodSplatter(position, velocity, count = 50) {
                if (this.bloodParticles.length > this.maxBlood) {
                    const toRemove = this.bloodParticles.splice(0, count);
                    toRemove.forEach(p => {
                        p.mesh.dispose();
                        if (p.aggregate) p.aggregate.dispose();
                    });
                }
                
                for (let i = 0; i < count; i++) {
                    const blood = BABYLON.MeshBuilder.CreateSphere(
                        "blood",
                        { diameter: 0.05 + Math.random() * 0.1, segments: 4 },
                        this.scene
                    );
                    
                    blood.position = position.clone();
                    blood.material = this.materials.bloodMat;
                    
                    const aggregate = new BABYLON.PhysicsAggregate(
                        blood,
                        BABYLON.PhysicsShapeType.SPHERE,
                        { mass: 0.01, restitution: 0.3, friction: 0.8 },
                        this.scene
                    );
                    
                    const vel = velocity.clone().scale(0.3 + Math.random() * 0.7);
                    vel.x += (Math.random() - 0.5) * 8;
                    vel.y += Math.random() * 5 + 3;
                    vel.z += (Math.random() - 0.5) * 8;
                    
                    aggregate.body.applyImpulse(vel, blood.getAbsolutePosition());
                    
                    this.bloodParticles.push({
                        mesh: blood,
                        aggregate: aggregate,
                        lifetime: 300 + Math.random() * 200
                    });
                }
            }
            
            createGibs(position, velocity, count = 5) {
                if (this.gibs.length > this.maxGibs) {
                    const toRemove = this.gibs.splice(0, count);
                    toRemove.forEach(g => {
                        g.mesh.dispose();
                        if (g.aggregate) g.aggregate.dispose();
                    });
                }
                
                const gibTypes = [
                    { size: [0.3, 1, 0.3], type: 'box' },
                    { size: [0.35, 1.2, 0.35], type: 'box' },
                    { size: 0.5, type: 'sphere' }
                ];
                
                for (let i = 0; i < count; i++) {
                    const gibDef = gibTypes[Math.floor(Math.random() * gibTypes.length)];
                    
                    let gib;
                    if (gibDef.type === 'sphere') {
                        gib = BABYLON.MeshBuilder.CreateSphere(
                            "gib",
                            { diameter: gibDef.size },
                            this.scene
                        );
                    } else {
                        gib = BABYLON.MeshBuilder.CreateBox(
                            "gib",
                            { width: gibDef.size[0], height: gibDef.size[1], depth: gibDef.size[2] },
                            this.scene
                        );
                    }
                    
                    gib.position = position.clone();
                    gib.material = this.materials.gibMat;
                    
                    const aggregate = new BABYLON.PhysicsAggregate(
                        gib,
                        gibDef.type === 'sphere' ? BABYLON.PhysicsShapeType.SPHERE : BABYLON.PhysicsShapeType.BOX,
                        { mass: 0.5, restitution: 0.4, friction: 0.6 },
                        this.scene
                    );
                    
                    const vel = velocity.clone().scale(0.5 + Math.random());
                    vel.x += (Math.random() - 0.5) * 12;
                    vel.y += Math.random() * 8 + 5;
                    vel.z += (Math.random() - 0.5) * 12;
                    
                    aggregate.body.applyImpulse(vel, gib.getAbsolutePosition());
                    
                    const torque = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20
                    );
                    aggregate.body.applyAngularImpulse(torque);
                    
                    this.gibs.push({
                        mesh: gib,
                        aggregate: aggregate,
                        lifetime: 600
                    });
                }
            }
            
            createKillEffect(position, velocity) {
                this.triggerBloodFlash();
                this.createLensSplatter(5);
                this.createBloodSplatter(position, velocity, 100);
                this.createGibs(position, velocity, 8);
            }
            
            update() {
                // Update blood
                for (let i = this.bloodParticles.length - 1; i >= 0; i--) {
                    const particle = this.bloodParticles[i];
                    particle.lifetime--;
                    
                    if (particle.lifetime <= 0) {
                        particle.mesh.dispose();
                        if (particle.aggregate) particle.aggregate.dispose();
                        this.bloodParticles.splice(i, 1);
                    }
                }
                
                // Update gibs
                for (let i = this.gibs.length - 1; i >= 0; i--) {
                    const gib = this.gibs[i];
                    gib.lifetime--;
                    
                    if (gib.lifetime <= 0) {
                        gib.mesh.dispose();
                        if (gib.aggregate) gib.aggregate.dispose();
                        this.gibs.splice(i, 1);
                    }
                }
            }
        }
        
        // ==========================================
        // DESTRUCTION SYSTEM
        // ==========================================
        
        class DestructionSystem {
            constructor(scene) {
                this.scene = scene;
                this.buildings = [];
                this.debris = [];
                this.maxDebris = 200;
            }
            
            createDestructibleBuilding(position, size) {
                const building = BABYLON.MeshBuilder.CreateBox(
                    "building",
                    { width: size.width, height: size.height, depth: size.depth },
                    this.scene
                );
                
                building.position = position.clone();
                
                const mat = new BABYLON.StandardMaterial("buildingMat", this.scene);
                mat.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.65);
                building.material = mat;
                building.castShadow = true;
                
                // Hollow building - trigger volume only
                const aggregate = new BABYLON.PhysicsAggregate(
                    building,
                    BABYLON.PhysicsShapeType.BOX,
                    { mass: 0 }, // Static
                    this.scene
                );
                
                // Enable collision callbacks
                aggregate.body.setCollisionCallbackEnabled(true);
                
                this.buildings.push({
                    mesh: building,
                    aggregate: aggregate,
                    size: size,
                    health: 100,
                    destroyed: false
                });
                
                return building;
            }
            
            destroyBuilding(building, impactPoint, impactVelocity) {
                if (building.destroyed) return;
                
                building.destroyed = true;
                building.mesh.dispose();
                building.aggregate.dispose();
                
                // Create debris fragments
                const fragmentCount = 15;
                const fragmentSize = Math.min(building.size.width, building.size.height, building.size.depth) / 3;
                
                for (let i = 0; i < fragmentCount; i++) {
                    if (this.debris.length > this.maxDebris) {
                        const old = this.debris.shift();
                        old.mesh.dispose();
                        old.aggregate.dispose();
                    }
                    
                    const fragment = BABYLON.MeshBuilder.CreateBox(
                        "debris",
                        { 
                            width: fragmentSize * (0.5 + Math.random() * 0.5),
                            height: fragmentSize * (0.5 + Math.random() * 0.5),
                            depth: fragmentSize * (0.5 + Math.random() * 0.5)
                        },
                        this.scene
                    );
                    
                    fragment.position = building.mesh.position.clone().add(new BABYLON.Vector3(
                        (Math.random() - 0.5) * building.size.width,
                        (Math.random() - 0.5) * building.size.height,
                        (Math.random() - 0.5) * building.size.depth
                    ));
                    
                    const mat = new BABYLON.StandardMaterial("debrisMat", this.scene);
                    mat.diffuseColor = new BABYLON.Color3(
                        0.5 + Math.random() * 0.2,
                        0.5 + Math.random() * 0.2,
                        0.5 + Math.random() * 0.2
                    );
                    fragment.material = mat;
                    fragment.castShadow = true;
                    
                    const aggregate = new BABYLON.PhysicsAggregate(
                        fragment,
                        BABYLON.PhysicsShapeType.BOX,
                        { mass: 5 + Math.random() * 10, restitution: 0.3, friction: 0.6 },
                        this.scene
                    );
                    
                    // Explosion force
                    const explosionDir = fragment.position.subtract(impactPoint).normalize();
                    const force = explosionDir.scale(100 + Math.random() * 200);
                    force.y += 50 + Math.random() * 100;
                    
                    aggregate.body.applyImpulse(force, fragment.getAbsolutePosition());
                    
                    // Random spin
                    const torque = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 50,
                        (Math.random() - 0.5) * 50,
                        (Math.random() - 0.5) * 50
                    );
                    aggregate.body.applyAngularImpulse(torque);
                    
                    this.debris.push({
                        mesh: fragment,
                        aggregate: aggregate,
                        lifetime: 600 + Math.random() * 400
                    });
                }
                
                gameState.debris += fragmentCount;
                gameState.score += 500;
                
                console.log(`🏢 Building destroyed! ${fragmentCount} debris created`);
            }
            
            update() {
                // Remove old debris
                for (let i = this.debris.length - 1; i >= 0; i--) {
                    const piece = this.debris[i];
                    piece.lifetime--;
                    
                    if (piece.lifetime <= 0) {
                        piece.mesh.dispose();
                        piece.aggregate.dispose();
                        this.debris.splice(i, 1);
                    }
                }
            }
        }
        
        // ==========================================
        // SCENE CREATION
        // ==========================================
        
        const createScene = async function() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.5, 0.7, 0.9);
            
            // Camera
            camera = new BABYLON.UniversalCamera(
                "camera",
                new BABYLON.Vector3(0, 10, -20),
                scene
            );
            camera.setTarget(new BABYLON.Vector3(0, 5, 0));
            camera.attachControl(canvas, true);
            
            // Lights
            const hemi = new BABYLON.HemisphericLight(
                "hemi",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemi.intensity = 0.7;
            
            const dir = new BABYLON.DirectionalLight(
                "dir",
                new BABYLON.Vector3(-1, -2, 1),
                scene
            );
            dir.intensity = 0.5;
            
            // Initialize Havok
            const havokInstance = await HavokPhysics();
            const havokPlugin = new BABYLON.HavokPlugin(true, havokInstance);
            scene.enablePhysics(new BABYLON.Vector3(0, -30, 0), havokPlugin);
            
            // Ground (sloped for downhill)
            const ground = BABYLON.MeshBuilder.CreateGround(
                "ground",
                { width: 200, height: 500, subdivisions: 50 },
                scene
            );
            
            // Slope the ground
            const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                const z = positions[i + 2];
                positions[i + 1] = z * 0.15; // 15% grade downhill
            }
            ground.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            ground.createNormals(true);
            
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            ground.material = groundMat;
            ground.receiveShadow = true;
            
            new BABYLON.PhysicsAggregate(
                ground,
                BABYLON.PhysicsShapeType.MESH,
                { mass: 0, friction: 0.8 },
                scene
            );
            
            // Create skater
            skater = BABYLON.MeshBuilder.CreateCapsule(
                "skater",
                { height: 1.8, radius: 0.4 },
                scene
            );
            skater.position = new BABYLON.Vector3(0, 5, -100);
            
            const skaterMat = new BABYLON.StandardMaterial("skaterMat", scene);
            skaterMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.9);
            skater.material = skaterMat;
            skater.castShadow = true;
            
            skaterBody = new BABYLON.PhysicsAggregate(
                skater,
                BABYLON.PhysicsShapeType.CAPSULE,
                { mass: 70, restitution: 0.1, friction: 0.3 },
                scene
            );
            
            // Prevent tipping over
            skaterBody.body.setAngularDamping(0.99);
            
            // Enable collision callbacks for skater
            skaterBody.body.setCollisionCallbackEnabled(true);
            
            // Initialize systems
            goreSystem = new HavokGoreSystem(scene);
            destructionSystem = new DestructionSystem(scene);
            
            // Create destructible buildings
            for (let i = 0; i < 8; i++) {
                const x = (Math.random() - 0.5) * 60;
                const z = i * 50 - 50;
                const height = 10 + Math.random() * 20;
                
                destructionSystem.createDestructibleBuilding(
                    new BABYLON.Vector3(x, height / 2, z),
                    { width: 8, height: height, depth: 8 }
                );
            }
            
            // Create enemies
            for (let i = 0; i < 15; i++) {
                createEnemy(
                    new BABYLON.Vector3(
                        (Math.random() - 0.5) * 80,
                        2,
                        i * 25 - 50
                    )
                );
            }
            
            // Collision handling
            scene.onBeforePhysicsObservable.add(() => {
                // Check skater collisions with buildings
                destructionSystem.buildings.forEach(building => {
                    if (building.destroyed) return;
                    
                    const dist = BABYLON.Vector3.Distance(
                        skater.position,
                        building.mesh.position
                    );
                    
                    if (dist < (building.size.width / 2 + 1)) {
                        const velocity = skaterBody.body.getLinearVelocity();
                        const speed = velocity.length();
                        
                        if (speed > 10) { // Fast enough to destroy
                            destructionSystem.destroyBuilding(
                                building,
                                skater.position,
                                velocity
                            );
                        }
                    }
                });
            });
            
            // Fade title
            setTimeout(() => {
                document.getElementById('title').classList.add('fade-out');
            }, 3000);
            
            return scene;
        };
        
        // ==========================================
        // ENEMY SYSTEM
        // ==========================================
        
        const enemies = [];
        
        function createEnemy(position) {
            const enemy = BABYLON.MeshBuilder.CreateCylinder(
                "enemy",
                { height: 2, diameter: 0.8 },
                scene
            );
            enemy.position = position.clone();
            
            const mat = new BABYLON.StandardMaterial("enemyMat", scene);
            mat.diffuseColor = new BABYLON.Color3(0.8, 0.3, 0.2);
            enemy.material = mat;
            enemy.castShadow = true;
            
            const aggregate = new BABYLON.PhysicsAggregate(
                enemy,
                BABYLON.PhysicsShapeType.CYLINDER,
                { mass: 60, restitution: 0.2 },
                scene
            );
            
            aggregate.body.setCollisionCallbackEnabled(true);
            
            enemies.push({
                mesh: enemy,
                aggregate: aggregate,
                alive: true
            });
        }
        
        // ==========================================
        // GAME LOOP
        // ==========================================
        
        function update() {
            if (!skater || !skaterBody) return;
            
            // Get velocity
            const velocity = skaterBody.body.getLinearVelocity();
            gameState.speed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
            
            // Movement input
            const forward = camera.getForwardRay().direction;
            forward.y = 0;
            forward.normalize();
            
            const right = BABYLON.Vector3.Cross(forward, BABYLON.Vector3.Up());
            
            const moveForce = 30;
            const steerForce = 20;
            
            if (keys['w'] || keys['ArrowUp']) {
                skaterBody.body.applyForce(
                    forward.scale(moveForce),
                    skater.getAbsolutePosition()
                );
            }
            if (keys['s'] || keys['ArrowDown']) {
                skaterBody.body.applyForce(
                    forward.scale(-moveForce * 0.5),
                    skater.getAbsolutePosition()
                );
            }
            if (keys['a'] || keys['ArrowLeft']) {
                skaterBody.body.applyForce(
                    right.scale(-steerForce),
                    skater.getAbsolutePosition()
                );
            }
            if (keys['d'] || keys['ArrowRight']) {
                skaterBody.body.applyForce(
                    right.scale(steerForce),
                    skater.getAbsolutePosition()
                );
            }
            
            // Jump
            if (keys[' '] && !gameState.jumping) {
                skaterBody.body.applyImpulse(
                    new BABYLON.Vector3(0, 400, 0),
                    skater.getAbsolutePosition()
                );
                gameState.jumping = true;
                gameState.score += 10;
            }
            
            // Reset jump when grounded
            if (skater.position.y < 3 && gameState.jumping) {
                gameState.jumping = false;
            }
            
            // Check enemy collisions
            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                
                const dist = BABYLON.Vector3.Distance(skater.position, enemy.mesh.position);
                if (dist < 1.5 && gameState.speed > 5) {
                    enemy.alive = false;
                    gameState.kills++;
                    gameState.score += 100;
                    gameState.combo++;
                    
                    // Gore effect
                    goreSystem.createKillEffect(
                        enemy.mesh.position,
                        velocity
                    );
                    
                    // Remove enemy
                    enemy.mesh.dispose();
                    enemy.aggregate.dispose();
                }
            });
            
            // Update systems
            goreSystem.update();
            destructionSystem.update();
            
            // Update combo timer
            if (gameState.comboTimer > 0) {
                gameState.comboTimer--;
                if (gameState.comboTimer === 0) {
                    gameState.combo = 0;
                }
            }
            
            // Camera follow
            const cameraOffset = forward.scale(-15);
            cameraOffset.y = 8;
            camera.position = BABYLON.Vector3.Lerp(
                camera.position,
                skater.position.add(cameraOffset),
                0.1
            );
            camera.setTarget(skater.position.add(new BABYLON.Vector3(0, 2, 0)));
            
            // Update HUD
            document.getElementById('score').textContent = `SCORE: ${Math.floor(gameState.score)}`;
            document.getElementById('combo').textContent = `COMBO: ${gameState.combo}x`;
            document.getElementById('trick').textContent = gameState.currentTrick;
            document.getElementById('kills').textContent = `KILLS: ${gameState.kills}`;
            document.getElementById('debris').textContent = `DEBRIS: ${gameState.debris}`;
            
            const speedDisplay = Math.floor(gameState.speed * 10);
            const speedElement = document.getElementById('speed');
            if (speedDisplay >= 50) {
                speedElement.style.color = '#FF0000';
                speedElement.textContent = `SPEED: ${speedDisplay} [LETHAL]`;
            } else {
                speedElement.style.color = '#00FFFF';
                speedElement.textContent = `SPEED: ${speedDisplay}`;
            }
        }
        
        // ==========================================
        // INPUT
        // ==========================================
        
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // ==========================================
        // START
        // ==========================================
        
        createScene().then(scene => {
            engine.runRenderLoop(() => {
                update();
                scene.render();
            });
        });
        
        window.addEventListener('resize', () => engine.resize());
        
        console.log('🛹 APPLESAUCE - Havok Edition loaded');
        console.log('⚡ Destructible buildings enabled');
        console.log('🩸 Gore system active');
    </script>
</body>
</html>
