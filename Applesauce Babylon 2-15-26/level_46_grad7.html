<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Applesauce - Gradient Core</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ff00; pointer-events: none; z-index: 10; }
        #wave-toggle {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: none; /* Hidden until archive triggers */
        }
        #wave-toggle button {
            background: transparent; border: 1px solid #00ff00; color: #00ff00;
            font-family: monospace; padding: 8px 16px; margin: 4px; cursor: pointer;
        }
        #wave-toggle button:hover { background: #00ff0022; }
        #wave-toggle button.active { background: #00ff0044; }
    </style>
</head>
<body>
    <div id="ui">CORE: APPLESAUCE_v1.1<br>STATUS: ROLLING</div>
    <div id="wave-toggle">
        <button id="btn-straight" class="active">STRAIGHT WAVE</button>
        <button id="btn-circular">CIRCULAR WAVE</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.182.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- DOM REFS ---
        const ui = document.getElementById('ui');
        const waveTogglePanel = document.getElementById('wave-toggle');
        const btnStraight = document.getElementById('btn-straight');
        const btnCircular = document.getElementById('btn-circular');

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- THE TERRAIN FUNCTION ---
        // A minimalist "skatepark" generated by math
        function getTerrainHeight(x, z) {
            // Rare violent vertical pillar (checked before normal return)
            if (Math.random() > 0.999) return 50;

            // Overlapping waves create "bowls" and "hips"
            const wave1 = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3;
            const wave2 = Math.sin(x * 0.05 + z * 0.05) * 2;
            return wave1 + wave2;
        }

        // Deterministic version for rendering (no random spikes)
        function getTerrainHeightStable(x, z) {
            const wave1 = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3;
            const wave2 = Math.sin(x * 0.05 + z * 0.05) * 2;
            return wave1 + wave2;
        }

        // --- GRADIENT CALCULATION ---
        function getSlopeData(x, z) {
            const e = 0.01;
            const dx = getTerrainHeightStable(x + e, z) - getTerrainHeightStable(x - e, z);
            const dz = getTerrainHeightStable(x, z + e) - getTerrainHeightStable(x, z - e);

            return {
                direction: Math.atan2(dz, dx),
                angle: Math.sqrt(dx * dx + dz * dz) * 10
            };
        }

        function getCorruptedSlope(x, z) {
            const base = getSlopeData(x, z);
            const corruption = Math.min(ego * 0.05 + risk * 0.1, 2.5);

            return {
                direction: base.direction + Math.sin(ego + x * 0.01) * 0.1,
                angle: base.angle * (1 + corruption)
            };
        }

        // --- VISUALS: TERRAIN ---
        const geo = new THREE.PlaneGeometry(200, 200, 100, 100);
        geo.rotateX(-Math.PI / 2);
        const vertices = geo.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            vertices[i + 1] = getTerrainHeightStable(vertices[i], vertices[i + 2]);
        }
        geo.computeVertexNormals();
        const terrain = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true }));
        scene.add(terrain);

        // --- VISUALS: SKATER ---
        const skater = new THREE.Mesh(
            new THREE.BoxGeometry(1, 0.2, 2),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        scene.add(skater);

        // ============================================================
        // --- WAVE SHADER SYSTEM (Three.js replacement for Babylon) --
        // ============================================================
        // A grid of bars that animate with vertex-driven wave displacement.
        // Two modes: straight wave (planar) and circular wave (radial).
        // Activated when the archive condition triggers.

        const waveShaderState = {
            active: false,
            straightWave: 1.0, // 1.0 = straight, 0.0 = circular
            barGroup: null
        };

        const waveVertexShader = `
            uniform float uTime;
            uniform float uStraightWave;
            uniform float uMinX;
            uniform float uMaxX;
            uniform float uMinZ;
            uniform float uMaxZ;
            varying vec3 vColor;
            varying float vHeight;

            void main() {
                vec3 pos = position;

                // Normalize position within grid bounds
                float nx = (pos.x - uMinX) / (uMaxX - uMinX);
                float nz = (pos.z - uMinZ) / (uMaxZ - uMinZ);

                // Straight wave: travels along X axis
                float straightDisp = sin(nx * 12.0 + uTime * 2.0) * 1.5;

                // Circular wave: radiates from center
                float dist = distance(vec2(nx, nz), vec2(0.5, 0.5));
                float circularDisp = sin(dist * 16.0 - uTime * 3.0) * 1.5;

                // Blend between modes
                float displacement = mix(circularDisp, straightDisp, uStraightWave);

                // Only displace Y for vertices above base (top of bars)
                if (pos.y > 0.1) {
                    pos.y += displacement;
                }

                vHeight = displacement;
                // Color by random-ish value based on grid position
                float colorSeed = fract(sin(dot(vec2(nx, nz), vec2(12.9898, 78.233))) * 43758.5453);
                vColor = mix(
                    vec3(0.0, 0.8, 0.2),
                    vec3(0.0, 0.3, 1.0),
                    colorSeed
                );

                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const waveFragmentShader = `
            varying vec3 vColor;
            varying float vHeight;

            void main() {
                // Brighten peaks, darken troughs
                float brightness = 0.5 + vHeight * 0.25;
                gl_FragColor = vec4(vColor * brightness, 1.0);
            }
        `;

        function createWaveShaderBars() {
            const barGroup = new THREE.Group();
            const gridX = 30, gridZ = 30;
            const spacing = 1.2;
            const barWidth = 0.8, barDepth = 0.8, barHeight = 3.0;
            const offsetX = (gridX * spacing) / 2;
            const offsetZ = (gridZ * spacing) / 2;

            const barGeo = new THREE.BoxGeometry(barWidth, barHeight, barDepth);
            // Shift geometry so base sits at y=0
            barGeo.translate(0, barHeight / 2, 0);

            // Merge into a single geometry for performance
            const mergedGeo = new THREE.BufferGeometry();
            const tempMatrix = new THREE.Matrix4();
            const geometries = [];

            for (let ix = 0; ix < gridX; ix++) {
                for (let iz = 0; iz < gridZ; iz++) {
                    const clone = barGeo.clone();
                    tempMatrix.makeTranslation(
                        ix * spacing - offsetX,
                        0,
                        iz * spacing - offsetZ
                    );
                    clone.applyMatrix4(tempMatrix);
                    geometries.push(clone);
                }
            }

            // Use BufferGeometryUtils-style merge (manual)
            const merged = mergeGeometries(geometries);

            const waveMaterial = new THREE.ShaderMaterial({
                vertexShader: waveVertexShader,
                fragmentShader: waveFragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uStraightWave: { value: 1.0 },
                    uMinX: { value: -offsetX },
                    uMaxX: { value: offsetX },
                    uMinZ: { value: -offsetZ },
                    uMaxZ: { value: offsetZ }
                }
            });

            const mesh = new THREE.Mesh(merged, waveMaterial);
            barGroup.add(mesh);

            // Position the bar field above terrain near player
            barGroup.position.set(0, 8, 0);
            barGroup.visible = false;
            scene.add(barGroup);

            waveShaderState.barGroup = barGroup;
            return barGroup;
        }

        // Simple geometry merge helper
        function mergeGeometries(geos) {
            let totalVerts = 0, totalIdx = 0;
            for (const g of geos) {
                totalVerts += g.attributes.position.count;
                totalIdx += g.index ? g.index.count : 0;
            }

            const positions = new Float32Array(totalVerts * 3);
            const indices = new Uint32Array(totalIdx);
            let vOffset = 0, iOffset = 0, indexOffset = 0;

            for (const g of geos) {
                const pos = g.attributes.position.array;
                positions.set(pos, vOffset * 3);

                if (g.index) {
                    const idx = g.index.array;
                    for (let i = 0; i < idx.length; i++) {
                        indices[iOffset + i] = idx[i] + vOffset;
                    }
                    iOffset += idx.length;
                }
                vOffset += g.attributes.position.count;
            }

            const merged = new THREE.BufferGeometry();
            merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            merged.setIndex(new THREE.BufferAttribute(indices, 1));
            return merged;
        }

        // Build the wave bars (hidden until archive triggers)
        const waveBarGroup = createWaveShaderBars();

        function updateWaveShader(time) {
            if (!waveShaderState.active || !waveShaderState.barGroup) return;

            const mesh = waveShaderState.barGroup.children[0];
            if (mesh && mesh.material.uniforms) {
                mesh.material.uniforms.uTime.value = time;
                mesh.material.uniforms.uStraightWave.value = waveShaderState.straightWave;
            }

            // Center wave field on skater
            waveShaderState.barGroup.position.set(pos.x, pos.y + 10, pos.z);
        }

        function activateWaveShader() {
            if (waveShaderState.active) return;
            waveShaderState.active = true;
            waveShaderState.barGroup.visible = true;
            waveTogglePanel.style.display = 'block';
        }

        // --- WAVE TOGGLE BUTTONS ---
        btnStraight.addEventListener('click', () => {
            waveShaderState.straightWave = 1.0;
            btnStraight.classList.add('active');
            btnCircular.classList.remove('active');
        });
        btnCircular.addEventListener('click', () => {
            waveShaderState.straightWave = 0.0;
            btnCircular.classList.add('active');
            btnStraight.classList.remove('active');
        });

        // --- PHYSICS STATE ---
        let pos = new THREE.Vector3(0, 10, 0);
        let vel = new THREE.Vector3(0, 0, 0);
        const input = { x: 0, z: 0 };
        let accel = 30; // Changed from const → let (archive condition needs to zero this)
        const friction = 0.8, gravity = 20, maxSpeed = 250, slopeInfluence = 80;

        // --- PSYCHOLOGICAL STATE ---
        let risk = 0;
        let ego = 0;
        let helmetOn = false;
        let airtime = 0;
        let lastTelemetry = { decel: 0, helmet: 'ABSENT', note: '' };
        let archived = false;

        function updateRisk(dt, speed) {
            if (!helmetOn) {
                risk += Math.pow(speed / maxSpeed, 2) * dt * 0.8;
                ego  += speed * dt * 0.02;
            } else {
                risk *= 0.98;
                ego  *= 0.95;
            }

            // Airtime feeds ego more than risk
            ego += airtime * dt * 0.5;

            // Risk decays slowly, ego does not
            risk = Math.max(0, risk - dt * 0.1);
        }

        // --- IMPACT / TELEMETRY ---
        let impactFlash = 0;

        function checkImpact(prevVelY, currentVelY) {
            const impactForce = Math.abs(prevVelY - currentVelY);

            if (impactForce > 18 && !helmetOn) {
                impactFlash = 0.15;
                lastTelemetry = {
                    decel: Math.round(impactForce * 320),
                    helmet: "ABSENT",
                    note: "TRAUMATIC SIMILARITY DETECTED"
                };
            }
        }

        function renderTelemetry(dt) {
            if (archived) return; // Archive has its own UI
            if (impactFlash > 0) {
                impactFlash -= dt;
                ui.innerHTML =
                    `CORE: APPLESAUCE_v1.1<br>` +
                    `ANGULAR DECEL: ${lastTelemetry.decel}<br>` +
                    `HELMET: ${lastTelemetry.helmet}<br>` +
                    `${lastTelemetry.note}`;
            } else {
                ui.innerHTML =
                    `CORE: APPLESAUCE_v1.1<br>STATUS: ROLLING<br>` +
                    `RISK: ${risk.toFixed(2)} | EGO: ${ego.toFixed(2)}`;
            }
        }

        // --- STILLNESS / CATHEDRAL ---
        let stillness = 0;
        let cathedralUnlocked = false;

        function updateStillness(dt, speed) {
            if (speed < 5 && Math.abs(input.x) + Math.abs(input.z) > 0) {
                stillness += dt;
            } else {
                stillness *= 0.95;
            }

            if (stillness > 12 && !cathedralUnlocked) {
                cathedralUnlocked = true;
                warpTerrainIntoCathedral();
            }
        }

        function warpTerrainIntoCathedral() {
            const verts = terrain.geometry.attributes.position.array;

            for (let i = 0; i < verts.length; i += 3) {
                const x = verts[i];
                const z = verts[i + 2];
                const radius = Math.sqrt(x * x + z * z);
                if (radius < 40) {
                    verts[i + 1] =
                        Math.pow(Math.cos(radius * 0.05), 3) * 18 +
                        Math.sin(x * 0.02) * 2;
                }
            }

            terrain.geometry.attributes.position.needsUpdate = true;
            terrain.geometry.computeVertexNormals();
        }

        // --- PERCEPTION (FOV warping) ---
        function applyPerception() {
            if (!helmetOn) {
                camera.fov = 75 + Math.sin(performance.now() * 0.002) * ego * 0.5;
            } else {
                camera.fov = THREE.MathUtils.lerp(camera.fov, 75, 0.05);
            }
            camera.updateProjectionMatrix();
        }

        // --- ARCHIVE CONDITION (triggers wave shader) ---
        function checkArchiveCondition() {
            if (archived) return;

            if (!helmetOn && risk > 8 && ego > 6) {
                archived = true;
                input.x = 0;
                input.z = 0;
                accel = 0;

                ui.innerHTML =
                    "STATUS: ROLLING<br>" +
                    "ARCHIVE FLAG: TRUE<br>" +
                    "SUBJECT MOTION PRESERVED<br>" +
                    "<br>WAVE SHADER: ONLINE";

                // Activate the wave shader visualization
                activateWaveShader();
            }
        }

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (archived) return; // Lock controls after archive
            if (e.key === 'w') input.z = -1;
            if (e.key === 's') input.z = 1;
            if (e.key === 'a') input.x = -1;
            if (e.key === 'd') input.x = 1;
            if (e.key === 'h') helmetOn = !helmetOn; // Toggle helmet
        });
        window.addEventListener('keyup', (e) => {
            if (['w', 's'].includes(e.key)) input.z = 0;
            if (['a', 'd'].includes(e.key)) input.x = 0;
        });

        // --- MAIN LOOP ---
        let last = performance.now();
        function loop() {
            requestAnimationFrame(loop);
            const now = performance.now();
            const dt = Math.min((now - last) / 1000, 0.1);
            last = now;

            const prevVelY = vel.y;

            // 1. Basic Movement (User Input)
            vel.x += input.x * accel * dt;
            vel.z += input.z * accel * dt;

            // 2. Friction & Gravity
            vel.x *= (1 - friction * dt);
            vel.z *= (1 - friction * dt);
            vel.y -= gravity * dt;

            // 3. Speed Limit
            const speed = Math.sqrt(vel.x ** 2 + vel.z ** 2);
            if (speed > maxSpeed) {
                vel.x = (vel.x / speed) * maxSpeed;
                vel.z = (vel.z / speed) * maxSpeed;
            }

            // 4. Position Update
            pos.x += vel.x * dt;
            pos.y += vel.y * dt;
            pos.z += vel.z * dt;

            // 5. Terrain Following
            const groundY = getTerrainHeightStable(pos.x, pos.z);
            const onGround = pos.y <= groundY;

            if (onGround) {
                pos.y = groundY;
                checkImpact(prevVelY, 0);
                vel.y = 0;
                airtime = 0;

                // 6. Slope Influence
                const slope = getCorruptedSlope(pos.x, pos.z);
                vel.x -= Math.cos(slope.direction) * slope.angle * slopeInfluence * dt;
                vel.z -= Math.sin(slope.direction) * slope.angle * slopeInfluence * dt;
            } else {
                airtime += dt;
            }

            // --- UPDATE ALL SYSTEMS ---
            updateRisk(dt, speed);
            updateStillness(dt, speed);
            applyPerception();
            checkArchiveCondition();
            renderTelemetry(dt);

            // --- WAVE SHADER UPDATE ---
            updateWaveShader(now * 0.001);

            // --- UPDATE VISUALS ---
            skater.position.copy(pos);
            skater.rotation.y = Math.atan2(-vel.x, -vel.z);

            if (archived) {
                // Slow cinematic pull-up
                camera.position.lerp(
                    new THREE.Vector3(pos.x, pos.y + 40, pos.z + 10),
                    0.01
                );
            } else {
                camera.position.lerp(
                    new THREE.Vector3(pos.x, pos.y + 8, pos.z + 15),
                    0.1
                );
            }
            camera.lookAt(pos);

            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
