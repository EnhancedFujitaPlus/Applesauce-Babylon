<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Babylon 8 - Level 22 Prototype</title>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; background: #1a0000; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="level_22.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const config = window.Level22Config; // Your uploaded config

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);

            // --- 1. CONFIG-DRIVEN ENVIRONMENT ---
            // Set the orange-red sky from config
            scene.clearColor = BABYLON.Color3.FromIntUint8(255, 69, 0); 
            
            // Fog settings from level_22.js
            scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
            scene.fogColor = new BABYLON.Color3(0.16, 0, 0); // 0x2A0000
            scene.fogStart = config.scene.fog.near;
            scene.fogEnd = config.scene.fog.far;

            // --- 2. CAMERA & LIGHTS ---
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.5;

            // --- 3. THE LAVA FOCUS ---
            // Placeholder for your Node Material (NME)
            // This is where you'll flesh out the molten aesthetics
            const lavaMaterial = new BABYLON.StandardMaterial("lavaMat", scene);
            lavaMaterial.emissiveColor = new BABYLON.Color3(1, 0.2, 0);
            lavaMaterial.specularColor = new BABYLON.Color3(0, 0, 0);

            // --- 4. PROCEDURAL TERRAIN (MOCKUP) ---
            // Example of using the config's 'valley' data
            const lavaPlane = BABYLON.MeshBuilder.CreateGround("lavaPlane", {
                width: config.terrain.segments[2].width, 
                height: config.terrain.segments[2].length
            }, scene);
            lavaPlane.position.y = config.terrain.segments[2].depth; // -20
            lavaPlane.material = lavaMaterial;

            // --- 5. VOLCANO SPAWNER ---
            config.weather.volcanoes.forEach((v, index) => {
                const cone = BABYLON.MeshBuilder.CreateCylinder("volcano_" + index, {
                    diameterTop: 0,
                    diameterBottom: v.baseRadius * 2,
                    height: v.height,
                    tessellation: 12
                }, scene);
                cone.position.set(v.position.x, v.height / 2, v.position.z);
                cone.material = new BABYLON.StandardMaterial("rock", scene);
                cone.material.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            });

            // --- 6. GLOW EFFECT ---
            const glow = new BABYLON.GlowLayer("glow", scene);
            glow.intensity = 1.2;

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => {
                scene.render();
            });
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
