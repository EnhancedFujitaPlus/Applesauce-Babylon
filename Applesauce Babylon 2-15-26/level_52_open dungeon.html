<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE — Castle Dungeon v2 (Room Graph + Verticality)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a0c;
            font-family: 'Courier New', monospace;
            color: #c8b89a;
        }
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        /* ── HUD ── */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 14px 20px;
            pointer-events: none;
            z-index: 10;
        }
        #hud-left, #hud-right {
            background: rgba(5, 5, 8, 0.8);
            border: 1px solid rgba(200, 184, 154, 0.12);
            padding: 10px 16px;
            border-radius: 2px;
        }
        #hud h1 { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #e8d8b8; margin-bottom: 3px; }
        #hud .sub { font-size: 9px; color: #7a6a5a; letter-spacing: 1px; }
        #hud-right { text-align: right; font-size: 10px; line-height: 1.7; }
        .key {
            display: inline-block;
            background: rgba(200, 184, 154, 0.1);
            border: 1px solid rgba(200, 184, 154, 0.2);
            padding: 1px 5px; border-radius: 2px; font-size: 9px; margin: 0 1px;
        }
        #room-label {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(5, 5, 8, 0.8);
            border: 1px solid rgba(200, 168, 104, 0.2);
            padding: 8px 20px; border-radius: 2px;
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
            color: #c8a868; z-index: 10; pointer-events: none;
            transition: opacity 0.4s;
        }
        #floor-label {
            position: fixed; top: 50%; right: 20px; transform: translateY(-50%);
            background: rgba(5, 5, 8, 0.8);
            border: 1px solid rgba(200, 168, 104, 0.15);
            padding: 10px 14px; border-radius: 2px;
            font-size: 10px; letter-spacing: 1px; text-align: center;
            color: #8a7a6a; z-index: 10; pointer-events: none;
        }
        #floor-label .current { color: #e8d8b8; font-size: 18px; display: block; margin: 4px 0; }

        /* ── Config Panel ── */
        #config-panel {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(5, 5, 8, 0.88);
            border: 1px solid rgba(200, 184, 154, 0.12);
            padding: 10px 18px; border-radius: 2px;
            display: flex; gap: 14px; align-items: center;
            z-index: 10; font-size: 10px;
        }
        #config-panel label { color: #6a5a4a; letter-spacing: 1px; text-transform: uppercase; font-size: 8px; }
        #config-panel select {
            background: rgba(200, 184, 154, 0.08);
            border: 1px solid rgba(200, 184, 154, 0.18);
            color: #c8b89a; padding: 3px 6px; font-family: inherit; font-size: 10px; border-radius: 2px;
        }
        #config-panel button {
            background: rgba(200, 168, 104, 0.18);
            border: 1px solid rgba(200, 168, 104, 0.35);
            color: #e8d8b8; padding: 5px 14px; font-family: inherit; font-size: 10px;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px;
            transition: all 0.2s;
        }
        #config-panel button:hover { background: rgba(200, 168, 104, 0.35); }

        /* ── Loading ── */
        #loading {
            position: fixed; inset: 0; background: #0a0a0c;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.8s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading h1 { font-size: 16px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; color: #e8d8b8; }
        #loading .bar-track { width: 280px; height: 2px; background: rgba(200, 184, 154, 0.12); border-radius: 2px; overflow: hidden; }
        #loading .bar-fill { height: 100%; background: #c8a868; width: 0%; transition: width 0.3s; }
        #loading .status { margin-top: 10px; font-size: 9px; color: #5a4a3a; letter-spacing: 2px; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="loading">
        <h1>Somebody Call LA this place is a palace!</h1>
        <div class="bar-track"><div class="bar-fill" id="loadBar"></div></div>
        <div class="status" id="loadStatus">Init Init Chew Tua...</div>
    </div>

    <div id="hud">
        <div id="hud-left">
            <h1>Producer Lives Here</h1>
            <div class="sub">Test His Patients</div>
        </div>
        <div id="hud-right">
            <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move
            <span class="key">Space</span> Jump
            <span class="key">Mouse</span> Look
        </div>
    </div>

    <div id="room-label">Entrance Hall</div>
    <div id="floor-label">
        <div style="font-size:8px;letter-spacing:1px;">FLOOR</div>
        <div class="current">1</div>
        <div style="font-size:8px;color:#5a4a3a;">of 3</div>
    </div>

    <div id="config-panel">
        <div>
            <label>Layout</label><br>
            <select id="cfgLayout">
                <option value="tower">Tower (3 floors)</option>
                <option value="keep" selected>Castle Keep</option>
                <option value="catacombs">Catacombs</option>
            </select>
        </div>
        <div>
            <label>God Rays</label><br>
            <select id="cfgRays">
                <option value="extreme" selected>Extreme</option>
                <option value="medium">Medium</option>
                <option value="off">Off</option>
            </select>
        </div>
        <div>
            <label>Skybox</label><br>
            <select id="cfgSkybox">
                <option value="dawn" selected>Dawn</option>
                <option value="dusk">Dusk</option>
                <option value="night">Night</option>
                <option value="overcast">Overcast</option>
            </select>
        </div>
        <button onclick="rebuildDungeon()">Rebuild</button>
    </div>
