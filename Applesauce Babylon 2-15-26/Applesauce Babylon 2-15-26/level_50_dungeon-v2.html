            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);

            position: fixed; top: 50%; right: 20px; transform: translateY(-50%);

        /* ── Config Panel ── */
        #config-panel {

        #config-panel select {
            background: rgba(200, 184, 154, 0.08);
            border: 1px solid rgba(200, 184, 154, 0.18);
            color: #c8b89a; padding: 3px 6px; font-family: inherit; font-size: 10px; border-radius: 2px;

        #config-panel button {
            background: rgba(200, 168, 104, 0.18);
            border: 1px solid rgba(200, 168, 104, 0.35);
            color: #e8d8b8; padding: 5px 14px; font-family: inherit; font-size: 10px;

            z-index: 100; transition: opacity 0.8s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading h1 { font-size: 16px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; color: #e8d8b8; }
        #loading .bar-track { width: 280px; height: 2px; background: rgba(200, 184, 154, 0.12); border-radius: 2px; overflow: hidden; }
        #loading .bar-fill { height: 100%; background: #c8a868; width: 0%; transition: width 0.3s; }
        #loading .status { margin-top: 10px; font-size: 9px; color: #5a4a3a; letter-spacing: 2px; }
    </style>
</head>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
// LOADING
// ═══════════════════════════════════════════════════════════════
function setLoad(p, m) {
    document.getElementById('loadBar').style.width = p + '%';
    document.getElementById('loadStatus').textContent = m;
}

// ═══════════════════════════════════════════════════════════════
// ROOM GRAPH SYSTEM
// ═══════════════════════════════════════════════════════════════
// Each node in the graph is a "room" with a type, position, size,
// and a list of connections to other rooms.
// The graph is walked to generate geometry.
//
// Room types:
//   hallway    — narrow corridor with torches
//   room       — standard stone room
//   large_room — bigger room, higher ceiling, more windows
//   courtyard  — open-topped room (no ceiling, skybox visible)
//   staircase  — ramp connecting two Y levels
//
// Connections define which wall of room A links to which wall of room B.
// The builder places rooms and carves doorways at connection points.

class RoomGraph {
    constructor() {
        this.nodes = [];    // { id, type, label, width, depth, height, position:{x,y,z}, windows, torchCount }
        this.edges = [];    // { from, to, fromWall, toWall }
        this._nextId = 0;
    }

    addRoom(type, label, opts = {}) {
        const defaults = this._getDefaults(type);
        const node = {
            id: this._nextId++,
            type,
            label: label || type,
            width: opts.width || defaults.width,
            depth: opts.depth || defaults.depth,
            height: opts.height || defaults.height,
            position: null,  // calculated during layout
            windows: opts.windows || defaults.windows,
            torchCount: opts.torchCount !== undefined ? opts.torchCount : defaults.torchCount,
            openTop: type === 'courtyard',
            floorLevel: opts.floorLevel || 0,
            ...opts
        };
        this.nodes.push(node);
        return node;
    }

    connect(fromId, toId, fromWall = 'south', toWall = 'north') {
        this.edges.push({ from: fromId, to: toId, fromWall, toWall });
    }

    _getDefaults(type) {
        switch (type) {
            case 'hallway':
                return { width: 14, depth: 12, height: 4, windows: 0, torchCount: 2 };
            case 'room':
                return { width: 14, depth: 10, height: 5.5, windows: 1, torchCount: 4 };
            case 'large_room':
                return { width: 22, depth: 16, height: 7, windows: 3, torchCount: 6 };
            case 'courtyard':
                return { width: 20, depth: 20, height: 8, windows: 0, torchCount: 4 };
            case 'staircase':
                return { width: 5, depth: 14, height: 5, windows: 1, torchCount: 2 };
            default:
                return { width: 12, depth: 10, height: 5, windows: 1, torchCount: 3 };
        }
    }

    /**
     * Calculate world positions for all rooms by walking the graph.
     * The first room is placed at origin. Each subsequent room is
     * positioned based on its connection wall and the parent's wall.
     */
    layout() {
        if (this.nodes.length === 0) return;

        const placed = new Set();
        const queue = [];

        // Place first room at origin
        const wallThickness = 0.8;
        this.nodes[0].position = { x: 0, y: this.nodes[0].floorLevel * 6, z: 0 };
        placed.add(this.nodes[0].id);
        queue.push(this.nodes[0]);

        while (queue.length > 0) {
            const current = queue.shift();

            // Find all edges from this node
            const outEdges = this.edges.filter(e => e.from === current.id && !placed.has(e.to));
            const inEdges = this.edges.filter(e => e.to === current.id && !placed.has(e.from));

            // Process outgoing connections
            outEdges.forEach(edge => {
                const target = this.nodes.find(n => n.id === edge.to);
                if (!target || placed.has(target.id)) return;

                target.position = this._calcPosition(
                    current, target, edge.fromWall, edge.toWall, wallThickness
                );
                placed.add(target.id);
                queue.push(target);
            });

            // Process incoming connections
            inEdges.forEach(edge => {
                const source = this.nodes.find(n => n.id === edge.from);
                if (!source || placed.has(source.id)) return;

                source.position = this._calcPosition(
                    current, source, edge.toWall, edge.fromWall, wallThickness
                );
                placed.add(source.id);
                queue.push(source);
            });
        }
    }

    _calcPosition(parent, child, parentWall, childWall, wt) {
        const px = parent.position.x;
        const py = parent.position.y;
        const pz = parent.position.z;

        // Y level from floorLevel
        const cy = child.floorLevel !== undefined ? child.floorLevel * 6 : py;

        // Gap between rooms (wall thickness * 2 for both walls)
        const gap = wt * 2;

        let x = px, z = pz;

        // Parent wall offset — push out from parent center
        if (parentWall === 'south') z = pz + parent.depth / 2 + child.depth / 2 + gap;
        else if (parentWall === 'north') z = pz - parent.depth / 2 - child.depth / 2 - gap;
        else if (parentWall === 'east')  x = px + parent.width / 2 + child.width / 2 + gap;
        else if (parentWall === 'west')  x = px - parent.width / 2 - child.width / 2 - gap;

        return { x, y: cy, z };
    }
}


// ═══════════════════════════════════════════════════════════════
// PRESET LAYOUTS
// ═══════════════════════════════════════════════════════════════

function createLayout_CastleKeep() {
    const g = new RoomGraph();

    // Floor 1: Ground level
    const entrance  = g.addRoom('hallway',    'Entrance Hall',    { floorLevel: 0 });
    const greatHall = g.addRoom('large_room', 'Great Hall',       { floorLevel: 0, windows: 4 });
    const courtyard = g.addRoom('courtyard',  'Inner Courtyard',  { floorLevel: 0 });
    const armory    = g.addRoom('room',       'Armory',           { floorLevel: 0, windows: 1 });
    const stairsUp  = g.addRoom('staircase',  'Spiral Staircase', { floorLevel: 0 });

    // Floor 2: Upper level
    const gallery   = g.addRoom('hallway',    'Upper Gallery',    { floorLevel: 1, depth: 16 });
    const throneRm  = g.addRoom('large_room', 'Throne Room',      { floorLevel: 1, windows: 4 });
    const stairs2   = g.addRoom('staircase',  'Tower Stairs',     { floorLevel: 1 });

    // Floor 3: Tower top
    const tower     = g.addRoom('room',       'Tower Chamber',    { floorLevel: 2, windows: 3 });

    // Connections — Floor 1
    g.connect(entrance.id, greatHall.id, 'south', 'north');
    g.connect(greatHall.id, courtyard.id, 'south', 'north');
    g.connect(greatHall.id, armory.id, 'east', 'west');
    g.connect(courtyard.id, stairsUp.id, 'east', 'west');

    // Floor 1 → Floor 2
    g.connect(stairsUp.id, gallery.id, 'south', 'north');

    // Floor 2
    g.connect(gallery.id, throneRm.id, 'south', 'north');
    g.connect(throneRm.id, stairs2.id, 'east', 'west');

    // Floor 2 → Floor 3
    g.connect(stairs2.id, tower.id, 'south', 'north');

    return g;
}

function createLayout_Tower() {
    const g = new RoomGraph();

    const base     = g.addRoom('room',       'Base Chamber',   { floorLevel: 0, windows: 2 });
    const stairs1  = g.addRoom('staircase',  'Stone Stairs',   { floorLevel: 0 });
    const mid      = g.addRoom('room',       'Guard Room',     { floorLevel: 1, windows: 2 });
    const stairs2  = g.addRoom('staircase',  'Winding Stairs', { floorLevel: 1 });
    const top      = g.addRoom('large_room', 'Observatory',    { floorLevel: 2, windows: 4 });

    g.connect(base.id, stairs1.id, 'south', 'north');
    g.connect(stairs1.id, mid.id, 'south', 'north');
    g.connect(mid.id, stairs2.id, 'south', 'north');
    g.connect(stairs2.id, top.id, 'south', 'north');

    return g;
}

function createLayout_Catacombs() {
    const g = new RoomGraph();

    const entry    = g.addRoom('hallway',    'Descent',         { floorLevel: 0 });
    const crypt1   = g.addRoom('room',       'Outer Crypt',     { floorLevel: 0 });
    const hall     = g.addRoom('hallway',    'Bone Corridor',   { floorLevel: 0, depth: 16 });
    const chamber  = g.addRoom('large_room', 'Burial Chamber',  { floorLevel: 0, windows: 0 });
    const stDown   = g.addRoom('staircase',  'Deep Stairs',     { floorLevel: 0 });
    const depths   = g.addRoom('room',       'The Depths',      { floorLevel: -1, windows: 0 });
    const vault    = g.addRoom('large_room', 'Ancient Vault',   { floorLevel: -1, windows: 0 });

    g.connect(entry.id, crypt1.id, 'south', 'north');
    g.connect(crypt1.id, hall.id, 'south', 'north');
    g.connect(hall.id, chamber.id, 'south', 'north');
    g.connect(chamber.id, stDown.id, 'east', 'west');
    g.connect(stDown.id, depths.id, 'south', 'north');
    g.connect(depths.id, vault.id, 'south', 'north');

    return g;
}


// ═══════════════════════════════════════════════════════════════
// PROCEDURAL TEXTURES
// ═══════════════════════════════════════════════════════════════

const ProceduralTextures = {
    stoneWall(scene, size = 512) {
        const tex = new BABYLON.DynamicTexture("stoneTex_" + Math.random(), size, scene, true);
        const ctx = tex.getContext();
        ctx.fillStyle = '#3a3632';
        ctx.fillRect(0, 0, size, size);
        const bRows = 8, bCols = 4;
        const bw = size / bCols, bh = size / bRows, mw = 3;
        for (let r = 0; r < bRows; r++) {
            const off = (r % 2) * (bw * 0.5);
            for (let c = -1; c <= bCols; c++) {
                const x = c * bw + off + (Math.random() - 0.5) * 4;
                const y = r * bh + (Math.random() - 0.5) * 3;
                const w = bw - mw + (Math.random() - 0.5) * 6;
                const h = bh - mw + (Math.random() - 0.5) * 4;
                const sh = 0.22 + Math.random() * 0.15;
                ctx.fillStyle = `rgb(${Math.floor((sh + Math.random()*0.03)*255)},${Math.floor(sh*255)},${Math.floor((sh-0.02)*255)})`;
                ctx.fillRect(x + mw, y + mw, w, h);
                for (let i = 0; i < 20; i++) {
                    ctx.fillStyle = `rgba(${Math.random()>0.5?200:30},${Math.random()>0.5?180:20},${Math.random()>0.5?150:20},${Math.random()*0.06})`;
                    ctx.fillRect(x+mw+Math.random()*w, y+mw+Math.random()*h, 1+Math.random()*3, 1+Math.random()*3);
                }
            }
        }
        ctx.strokeStyle = '#1a1816'; ctx.lineWidth = mw;
        for (let r = 1; r < bRows; r++) {
            ctx.beginPath(); ctx.moveTo(0, r*bh+(Math.random()-0.5)*2);
            ctx.lineTo(size, r*bh+(Math.random()-0.5)*2); ctx.stroke();
        }
        tex.update(); return tex;
    },

    stoneFloor(scene, size = 512) {
        const tex = new BABYLON.DynamicTexture("floorTex_" + Math.random(), size, scene, true);
        const ctx = tex.getContext();
        ctx.fillStyle = '#2d2a28'; ctx.fillRect(0, 0, size, size);
        const ss = size / 4, gap = 4;
        for (let r = 0; r < 4; r++) {
            const off = (r%2)*(ss*0.5);
            for (let c = -1; c <= 4; c++) {
                const x = c*ss+off, y = r*ss;
                const sh = 0.18+Math.random()*0.1;
                ctx.fillStyle = `rgb(${Math.floor(sh*255)},${Math.floor((sh-0.01)*255)},${Math.floor((sh-0.02)*255)})`;
                ctx.fillRect(x+gap, y+gap, ss-gap*2, ss-gap*2);
                for (let i = 0; i < 10; i++) {
                    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.1})`;
                    ctx.fillRect(x+gap+Math.random()*(ss-gap*2), y+gap+Math.random()*(ss-gap*2), Math.random()*7, Math.random()*7);
                }
            }
        }
        ctx.strokeStyle = '#100e0d'; ctx.lineWidth = gap;
        for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0,i*ss); ctx.lineTo(size,i*ss); ctx.stroke(); }
        tex.update(); return tex;
    },

    ceiling(scene, size = 512) {
        const tex = new BABYLON.DynamicTexture("ceilTex_" + Math.random(), size, scene, true);
        const ctx = tex.getContext();
        ctx.fillStyle = '#1a1917'; ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 120; i++) {
            const sh = Math.random()*0.05;
            ctx.fillStyle = `rgba(${80+Math.random()*80},${60+Math.random()*60},${40+Math.random()*50},${sh})`;
            ctx.fillRect(Math.random()*size, Math.random()*size, 2+Math.random()*10, 2+Math.random()*10);
        }
        for (let i = 0; i < 5; i++) {
            const cx = Math.random()*size, cy = Math.random()*size, r = 20+Math.random()*50;
            const gr = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
            gr.addColorStop(0, 'rgba(30,50,35,0.1)'); gr.addColorStop(1, 'rgba(30,50,35,0)');
            ctx.fillStyle = gr; ctx.fillRect(cx-r,cy-r,r*2,r*2);
        }
        tex.update(); return tex;
    },

    wood(scene, size = 256) {
        const tex = new BABYLON.DynamicTexture("woodTex_" + Math.random(), size, scene, true);
        const ctx = tex.getContext();
        ctx.fillStyle = '#4a3525'; ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 30; i++) {
            const y = Math.random()*size;
            ctx.strokeStyle = `rgba(${60+Math.random()*30},${40+Math.random()*20},${20+Math.random()*15},${0.15+Math.random()*0.2})`;
            ctx.lineWidth = 1+Math.random()*2;
            ctx.beginPath(); ctx.moveTo(0,y);
            for (let x = 0; x < size; x += 10) ctx.lineTo(x, y+Math.sin(x*0.02+i)*3);
            ctx.stroke();
        }
        tex.update(); return tex;
    },

    stairStone(scene, size = 256) {
        const tex = new BABYLON.DynamicTexture("stairTex_" + Math.random(), size, scene, true);
        const ctx = tex.getContext();
        ctx.fillStyle = '#332f2c'; ctx.fillRect(0, 0, size, size);
        // Worn step grooves
        for (let i = 0; i < 8; i++) {
            const y = (i / 8) * size;
            ctx.fillStyle = `rgba(20,18,16,${0.3+Math.random()*0.2})`;
            ctx.fillRect(0, y, size, size/16);
            // Wear in center
            const cx = size/2, w = size*0.6;
            const gr = ctx.createRadialGradient(cx, y+size/16, 0, cx, y+size/16, w/2);
            gr.addColorStop(0, 'rgba(0,0,0,0.15)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gr; ctx.fillRect(cx-w/2, y, w, size/8);
        }
        tex.update(); return tex;
    }
};


// ═══════════════════════════════════════════════════════════════
// PROCEDURAL SKYBOX
// ═══════════════════════════════════════════════════════════════
// Instead of rendering live terrain, we paint a skybox with:
//   - Gradient sky
//   - Mountain/hill silhouettes
//   - Optional moon/sun glow
// This gives the illusion of terrain outside windows at zero render cost.

function createProceduralSkybox(scene, preset = 'dawn') {
    const palettes = {
        dawn: {
            top: [15, 12, 35],
            mid: [80, 45, 30],
            horizon: [200, 120, 60],
            ground: [20, 25, 15],
            mountains: [30, 25, 20],
            sunGlow: [255, 180, 80],
            sunY: 0.35, fogAlpha: 0.15
        },
        dusk: {
            top: [10, 8, 25],
            mid: [60, 20, 40],
            horizon: [160, 60, 40],
            ground: [15, 15, 12],
            mountains: [25, 18, 18],
            sunGlow: [220, 80, 40],
            sunY: 0.3, fogAlpha: 0.2
        },
        night: {
            top: [5, 5, 15],
            mid: [8, 8, 20],
            horizon: [15, 15, 30],
            ground: [8, 10, 8],
            mountains: [10, 10, 15],
            sunGlow: [80, 100, 150],
            sunY: 0.6, fogAlpha: 0.05
        },
        overcast: {
            top: [40, 42, 48],
            mid: [55, 55, 58],
            horizon: [70, 68, 65],
            ground: [25, 28, 22],
            mountains: [35, 35, 32],
            sunGlow: [90, 88, 82],
            sunY: 0.45, fogAlpha: 0.25
        }
    };

    const pal = palettes[preset] || palettes.dawn;
    const faceSize = 512;

    // Create 6 faces for the skybox cubemap
    // We paint each face procedurally
    const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 800 }, scene);
    const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
    skyMat.backFaceCulling = false;
    skyMat.disableLighting = true;

    // Create cubemap from 6 DynamicTextures
    const faces = [];
    const faceNames = ['px', 'py', 'pz', 'nx', 'ny', 'nz'];

    faceNames.forEach((name, fi) => {
        const tex = new BABYLON.DynamicTexture(`sky_${name}`, faceSize, scene, true);
        const ctx = tex.getContext();

        // Draw sky gradient
        for (let y = 0; y < faceSize; y++) {
            const t = y / faceSize;
            let r, g, b;

            if (name === 'py') {
                // Top face: zenith color
                r = pal.top[0]; g = pal.top[1]; b = pal.top[2];
            } else if (name === 'ny') {
                // Bottom face: ground
                r = pal.ground[0]; g = pal.ground[1]; b = pal.ground[2];
            } else {
                // Side faces: gradient from top to horizon to ground
                if (t < 0.35) {
                    const lt = t / 0.35;
                    r = pal.top[0] + (pal.mid[0] - pal.top[0]) * lt;
                    g = pal.top[1] + (pal.mid[1] - pal.top[1]) * lt;
                    b = pal.top[2] + (pal.mid[2] - pal.top[2]) * lt;
                } else if (t < 0.55) {
                    const lt = (t - 0.35) / 0.2;
                    r = pal.mid[0] + (pal.horizon[0] - pal.mid[0]) * lt;
                    g = pal.mid[1] + (pal.horizon[1] - pal.mid[1]) * lt;
                    b = pal.mid[2] + (pal.horizon[2] - pal.mid[2]) * lt;
                } else {
                    const lt = (t - 0.55) / 0.45;
                    r = pal.horizon[0] + (pal.ground[0] - pal.horizon[0]) * lt;
                    g = pal.horizon[1] + (pal.ground[1] - pal.horizon[1]) * lt;
                    b = pal.horizon[2] + (pal.ground[2] - pal.horizon[2]) * lt;
                }
            }

            ctx.fillStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
            ctx.fillRect(0, y, faceSize, 1);
        }

        // Mountain silhouettes on side faces
        if (name !== 'py' && name !== 'ny') {
            const mColor = pal.mountains;
            ctx.fillStyle = `rgb(${mColor[0]},${mColor[1]},${mColor[2]})`;
            ctx.beginPath();
            ctx.moveTo(0, faceSize * 0.6);

            // Generate mountain profile with seeded randomness per face
            const seed = fi * 1337;
            for (let x = 0; x <= faceSize; x += 4) {
                const nx = x / faceSize;
                const h1 = Math.sin(nx * 3.5 + seed) * 0.08;
                const h2 = Math.sin(nx * 7.3 + seed * 0.7) * 0.04;
                const h3 = Math.sin(nx * 15.1 + seed * 0.3) * 0.015;
                const peak = Math.sin(nx * Math.PI) * 0.06; // Higher in center
                const mountainY = 0.52 - h1 - h2 - h3 - peak;
                ctx.lineTo(x, mountainY * faceSize);
            }
            ctx.lineTo(faceSize, faceSize);
            ctx.lineTo(0, faceSize);
            ctx.closePath();
            ctx.fill();

            // Second mountain layer (closer, darker)
            ctx.fillStyle = `rgb(${Math.floor(mColor[0]*0.7)},${Math.floor(mColor[1]*0.7)},${Math.floor(mColor[2]*0.7)})`;
            ctx.beginPath();
            ctx.moveTo(0, faceSize * 0.65);
            for (let x = 0; x <= faceSize; x += 4) {
                const nx = x / faceSize;
                const h1 = Math.sin(nx * 4.2 + seed + 2) * 0.05;
                const h2 = Math.sin(nx * 9.1 + seed + 5) * 0.025;
                const mountainY = 0.58 - h1 - h2;
                ctx.lineTo(x, mountainY * faceSize);
            }
            ctx.lineTo(faceSize, faceSize);
            ctx.lineTo(0, faceSize);
            ctx.closePath();
            ctx.fill();

            // Sun/moon glow on one face
            if (fi === 2) { // pz face
                const sx = faceSize * 0.5;
                const sy = faceSize * pal.sunY;
                const sr = faceSize * 0.2;
                const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
                gr.addColorStop(0, `rgba(${pal.sunGlow[0]},${pal.sunGlow[1]},${pal.sunGlow[2]},0.5)`);
                gr.addColorStop(0.4, `rgba(${pal.sunGlow[0]},${pal.sunGlow[1]},${pal.sunGlow[2]},0.15)`);
                gr.addColorStop(1, `rgba(${pal.sunGlow[0]},${pal.sunGlow[1]},${pal.sunGlow[2]},0)`);
                ctx.fillStyle = gr;
                ctx.fillRect(0, 0, faceSize, faceSize);
            }

            // Atmospheric haze near horizon
            const hazeGr = ctx.createLinearGradient(0, faceSize * 0.45, 0, faceSize * 0.65);
            hazeGr.addColorStop(0, `rgba(${pal.horizon[0]},${pal.horizon[1]},${pal.horizon[2]},0)`);
            hazeGr.addColorStop(1, `rgba(${pal.horizon[0]},${pal.horizon[1]},${pal.horizon[2]},${pal.fogAlpha})`);
            ctx.fillStyle = hazeGr;
            ctx.fillRect(0, faceSize * 0.45, faceSize, faceSize * 0.2);
        }

        tex.update();
        faces.push(tex);
    });

    // Apply as emissive textures per face via a simple approach:
    // Use a single reflectionTexture approach with a RawCubeTexture
    // For simplicity, just make the skybox emissive with a basic texture
    skyMat.emissiveColor = new BABYLON.Color3(1, 1, 1);

    // Use the PZ face as diffuse for now (it'll be visible through windows mostly)
    skyMat.emissiveTexture = faces[2]; // PZ face has the sun glow
    skyMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    skyMat.specularColor = new BABYLON.Color3(0, 0, 0);
    skybox.material = skyMat;
    skybox.infiniteDistance = true;
    skybox.renderingGroupId = 0;

    // Better approach: create individual planes for each direction
    // so different faces show different views
    skybox.dispose();
    skyMat.dispose();

    const skyParent = new BABYLON.TransformNode("skyboxParent", scene);
    const directions = [
        { name: 'front',  rot: 0,             faceIdx: 2 },
        { name: 'back',   rot: Math.PI,       faceIdx: 5 },
        { name: 'left',   rot: -Math.PI/2,    faceIdx: 0 },
        { name: 'right',  rot: Math.PI/2,     faceIdx: 3 },
    ];

    const skyMeshes = [];
    const skyDist = 390;

    directions.forEach(dir => {
        const plane = BABYLON.MeshBuilder.CreatePlane(`sky_${dir.name}`, {
            width: 800, height: 800
        }, scene);
        plane.rotation.y = dir.rot;
        plane.position.x = Math.sin(dir.rot) * skyDist;
        plane.position.z = Math.cos(dir.rot) * skyDist;
        plane.parent = skyParent;

        const mat = new BABYLON.StandardMaterial(`skyMat_${dir.name}`, scene);
        mat.emissiveTexture = faces[dir.faceIdx];
        mat.emissiveColor = new BABYLON.Color3(1, 1, 1);
        mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
        mat.specularColor = new BABYLON.Color3(0, 0, 0);
        mat.disableLighting = true;
        mat.backFaceCulling = false;
        plane.material = mat;
        plane.isPickable = false;
        skyMeshes.push(plane);
    });

    // Top
    const topPlane = BABYLON.MeshBuilder.CreatePlane("sky_top", { width: 800, height: 800 }, scene);
    topPlane.rotation.x = Math.PI / 2;
    topPlane.position.y = skyDist;
    topPlane.parent = skyParent;
    const topMat = new BABYLON.StandardMaterial("skyMat_top", scene);
    topMat.emissiveTexture = faces[1];
    topMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
    topMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    topMat.disableLighting = true;
    topMat.backFaceCulling = false;
    topPlane.material = topMat;
    topPlane.isPickable = false;
    skyMeshes.push(topPlane);

    console.log(`🌅 Procedural skybox created (${preset})`);
    return { parent: skyParent, meshes: skyMeshes, textures: faces };
}


// ═══════════════════════════════════════════════════════════════
// DUNGEON BUILDER (with room graph support + enhanced light shafts)
// ═══════════════════════════════════════════════════════════════

class DungeonBuilder {
    constructor(scene, havokPlugin, shadowGenerator) {
        this.scene = scene;
        this.havokPlugin = havokPlugin;
        this.shadowGenerator = shadowGenerator;
        this.meshes = [];
        this.lights = [];
        this.torchAnims = [];
        this.windows = [];
        this.dustSystems = []; // Particle systems for dust in light shafts
        this.roomBounds = [];  // For room detection

        this.textures = {
            wall: ProceduralTextures.stoneWall(scene),
            floor: ProceduralTextures.stoneFloor(scene),
            ceiling: ProceduralTextures.ceiling(scene),
            wood: ProceduralTextures.wood(scene),
            stairs: ProceduralTextures.stairStone(scene)
        };
        this.materials = this._createMaterials();
    }

    _createMaterials() {
        const s = this.scene;
        const make = (name, tex, uS, vS, spec) => {
            const m = new BABYLON.StandardMaterial(name + "_" + Math.random(), s);
            m.diffuseTexture = tex; m.diffuseTexture.uScale = uS; m.diffuseTexture.vScale = vS;
            m.specularColor = new BABYLON.Color3(spec, spec, spec);
            return m;
        };
        return {
            wall:    make("dWall", this.textures.wall, 2, 2, 0.05),
            floor:   make("dFloor", this.textures.floor, 3, 3, 0.08),
            ceiling: make("dCeil", this.textures.ceiling, 2, 2, 0.02),
            wood:    make("dWood", this.textures.wood, 1, 1, 0.08),
            stairs:  make("dStairs", this.textures.stairs, 1, 2, 0.04)
        };
    }

    // ── Build from Room Graph ──

    buildFromGraph(graph, godRayLevel, camera) {
        graph.layout();

        graph.nodes.forEach(node => {
            if (!node.position) return;

            switch (node.type) {
                case 'hallway':
                    this._buildHallway(node);
                    break;
                case 'staircase':
                    this._buildStaircase(node, graph);
                    break;
                case 'courtyard':
                    this._buildCourtyard(node);
                    break;
                case 'room':
                case 'large_room':
                default:
                    this._buildStandardRoom(node, graph);
                    break;
            }

            // Track room bounds for HUD label
            this.roomBounds.push({
                label: node.label,
                floor: node.floorLevel || 0,
                x: node.position.x,
                y: node.position.y,
                z: node.position.z,
                hw: node.width / 2,
                hd: node.depth / 2
            });
        });

        // Light shafts
        if (godRayLevel !== 'off' && this.windows.length > 0) {
            this._createLightShafts(camera, godRayLevel);
        }
    }

    _getConnectedWalls(nodeId, graph) {
        const walls = new Set();
        graph.edges.forEach(e => {
            if (e.from === nodeId) walls.add(e.fromWall);
            if (e.to === nodeId) walls.add(e.toWall);
        });
        return walls;
    }

    // ── Standard Room ──

    _buildStandardRoom(node, graph) {
        const { width, depth, height, position: pos } = node;
        const wt = 0.8;
        const connectedWalls = this._getConnectedWalls(node.id, graph);

        // Floor
        this._box(`floor_${node.id}`, width, wt, depth,
            pos.x, pos.y - wt/2, pos.z, this.materials.floor, 0, true);

        // Ceiling
        this._box(`ceil_${node.id}`, width, wt, depth,
            pos.x, pos.y + height + wt/2, pos.z, this.materials.ceiling, 0, true);

        // Walls
        const wallDefs = this._getWallDefs(pos, width, depth, height, wt);

        wallDefs.forEach(wd => {
            const isConnected = connectedWalls.has(wd.name);
            const isXWall = wd.name === 'north' || wd.name === 'south';
            const wallLen = isXWall ? width : depth;

            if (isConnected) {
                // Doorway opening
                this._buildWallWithHole(wd, wallLen, isXWall, {
                    position: 0.5, width: 4, height: height * 0.75, isWindow: false, bottom: 0
                });
            } else {
                // Check for windows
                const windowCount = this._windowsForWall(node, wd.name);
                if (windowCount > 0) {
                    for (let wi = 0; wi < windowCount; wi++) {
                        const wPos = (wi + 1) / (windowCount + 1);
                        this._buildWallWithHole(wd, wallLen, isXWall, {
                            position: wPos, width: 1.8, height: 1.6, isWindow: true, bottom: height * 0.4
                        });
                    }
                } else {
                    this._box(`wall_${wd.name}_${node.id}`, wd.w, wd.h, wd.d,
                        wd.px, wd.py, wd.pz, this.materials.wall, 0, true, true);
                }
            }

            // Torches
            if (node.torchCount > 0 && !isConnected) {
                const torchesPerWall = Math.ceil(node.torchCount / 4);
                for (let ti = 0; ti < torchesPerWall; ti++) {
                    const tp = (ti + 1) / (torchesPerWall + 1);
                    this._placeTorch(wd, tp, pos, width, depth, height, isXWall);
                }
            }
        });
    }

    // ── Hallway ──

    _buildHallway(node) {
        const { width, depth, height, position: pos } = node;
        const wt = 0.8;

        // Floor
        this._box(`hFloor_${node.id}`, width, wt, depth,
            pos.x, pos.y - wt/2, pos.z, this.materials.floor, 0, true);

        // Ceiling
        this._box(`hCeil_${node.id}`, width, wt, depth,
            pos.x, pos.y + height + wt/2, pos.z, this.materials.ceiling, 0, true);

        // Side walls (east and west — hallways run north-south)
        this._box(`hWallE_${node.id}`, wt, height, depth,
            pos.x + width/2 + wt/2, pos.y + height/2, pos.z,
            this.materials.wall, 0, true, true);

        this._box(`hWallW_${node.id}`, wt, height, depth,
            pos.x - width/2 - wt/2, pos.y + height/2, pos.z,
            this.materials.wall, 0, true, true);

        // Torches along hallway
        const spacing = depth / (node.torchCount + 1);
        for (let i = 0; i < node.torchCount; i++) {
            const tz = pos.z - depth/2 + spacing * (i + 1);
            const side = i % 2 === 0 ? 1 : -1;
            this.placeTorchAt(
                pos.x + side * (width/2 - 0.4),
                pos.y + height * 0.55,
                tz
            );
        }
    }

    // ── Staircase ──

    _buildStaircase(node, graph) {
        const { width, depth, height, position: pos } = node;
        const wt = 0.8;

        // Figure out height change
        // Look at connected rooms to determine if going up or down
        let heightChange = 6; // one floor = 6 units
        const connEdges = graph.edges.filter(e => e.from === node.id || e.to === node.id);
        connEdges.forEach(e => {
            const otherId = e.from === node.id ? e.to : e.from;
            const other = graph.nodes.find(n => n.id === otherId);
            if (other && other.position) {
                const dy = other.position.y - pos.y;
                if (Math.abs(dy) > 1) heightChange = dy;
            }
        });

        const totalHeight = Math.abs(heightChange) + height;
        const goingUp = heightChange >= 0;

        // Side walls — tall enough for the full staircase
        this._box(`stWallE_${node.id}`, wt, totalHeight, depth,
            pos.x + width/2 + wt/2, pos.y + totalHeight/2, pos.z,
            this.materials.wall, 0, true, true);

        this._box(`stWallW_${node.id}`, wt, totalHeight, depth,
            pos.x - width/2 - wt/2, pos.y + totalHeight/2, pos.z,
            this.materials.wall, 0, true, true);

        // Ceiling at top
        this._box(`stCeil_${node.id}`, width, wt, depth,
            pos.x, pos.y + totalHeight + wt/2, pos.z, this.materials.ceiling, 0, true);

        // Build stair steps as a ramp with step texture
        const stepCount = 12;
        const stepDepth = depth / stepCount;
        const stepHeight = Math.abs(heightChange) / stepCount;

        for (let i = 0; i < stepCount; i++) {
            const stepZ = pos.z - depth/2 + stepDepth * i + stepDepth/2;
            const stepY = goingUp
                ? pos.y + stepHeight * i + stepHeight/2
                : pos.y + Math.abs(heightChange) - stepHeight * i - stepHeight/2;

            const step = this._box(`step_${node.id}_${i}`, width - 0.2, stepHeight, stepDepth,
                pos.x, stepY, stepZ, this.materials.stairs, 0, true);
        }

        // Window on staircase
        if (node.windows > 0) {
            const midY = pos.y + totalHeight * 0.4;
            // Create a window opening in the east wall
            const winPos = new BABYLON.Vector3(
                pos.x + width/2 + wt/2,
                midY,
                pos.z
            );
            this.windows.push({
                position: winPos,
                normal: new BABYLON.Vector3(-1, 0, 0),
                width: 1.5,
                height: 1.2
            });
        }

        // Torch
        this.placeTorchAt(pos.x - width/2 + 0.5, pos.y + height * 0.6, pos.z);
    }

    // ── Courtyard (open top) ──

    _buildCourtyard(node) {
        const { width, depth, height, position: pos } = node;
        const wt = 0.8;

        // Floor — different material (could be cobblestone)
        this._box(`cyFloor_${node.id}`, width, wt, depth,
            pos.x, pos.y - wt/2, pos.z, this.materials.floor, 0, true);

        // NO ceiling — open to sky

        // Walls on all 4 sides (with battlements-style top)
        const wallDefs = this._getWallDefs(pos, width, depth, height, wt);
        wallDefs.forEach(wd => {
            // Main wall (lower section)
            this._box(`cyWall_${wd.name}_${node.id}`, wd.w, wd.h * 0.7, wd.d,
                wd.px, pos.y + wd.h * 0.35, wd.pz, this.materials.wall, 0, true, true);

            // Battlements (alternating merlons)
            const isXWall = wd.name === 'north' || wd.name === 'south';
            const wallLen = isXWall ? width : depth;
            const merlonCount = Math.floor(wallLen / 2.5);
            for (let m = 0; m < merlonCount; m++) {
                if (m % 2 === 0) {
                    const merlonH = wd.h * 0.3;
                    const merlonW = 1.5;
                    const mPos = -wallLen/2 + (m + 0.5) * (wallLen / merlonCount);

                    let mx = wd.px, mz = wd.pz;
                    if (isXWall) mx += mPos;
                    else mz += mPos;

                    this._box(`merlon_${wd.name}_${m}_${node.id}`,
                        isXWall ? merlonW : wd.d,
                        merlonH,
                        isXWall ? wd.d : merlonW,
                        mx, pos.y + wd.h * 0.7 + merlonH/2, mz,
                        this.materials.wall, 0, true, true);
                }
            }
        });

        // Corner torches
        const corners = [
            [pos.x - width/2 + 1, pos.z - depth/2 + 1],
            [pos.x + width/2 - 1, pos.z - depth/2 + 1],
            [pos.x - width/2 + 1, pos.z + depth/2 - 1],
            [pos.x + width/2 - 1, pos.z + depth/2 - 1]
        ];
        corners.forEach(([cx, cz]) => {
            this.placeTorchAt(cx, pos.y + height * 0.5, cz);
        });
    }

    // ── Wall helpers ──

    _getWallDefs(pos, width, depth, height, wt) {
        return [
            { name: 'north', w: width, h: height, d: wt,
              px: pos.x, py: pos.y + height/2, pz: pos.z - depth/2 - wt/2,
              normalDir: new BABYLON.Vector3(0, 0, 1) },
            { name: 'south', w: width, h: height, d: wt,
              px: pos.x, py: pos.y + height/2, pz: pos.z + depth/2 + wt/2,
              normalDir: new BABYLON.Vector3(0, 0, -1) },
            { name: 'east', w: wt, h: height, d: depth,
              px: pos.x + width/2 + wt/2, py: pos.y + height/2, pz: pos.z,
              normalDir: new BABYLON.Vector3(-1, 0, 0) },
            { name: 'west', w: wt, h: height, d: depth,
              px: pos.x - width/2 - wt/2, py: pos.y + height/2, pz: pos.z,
              normalDir: new BABYLON.Vector3(1, 0, 0) }
        ];
    }

    _windowsForWall(node, wallName) {
        if (node.windows <= 0) return 0;
        // Distribute windows: east and west walls get them
        if (wallName === 'east') return Math.ceil(node.windows / 2);
        if (wallName === 'west') return Math.floor(node.windows / 2);
        return 0;
    }

    _buildWallWithHole(wd, wallLen, isXWall, hole) {
        const holeW = hole.width;
        const holeH = hole.height;
        const holeBtm = hole.bottom || 0;
        const holePos = (hole.position || 0.5) * wallLen - wallLen / 2;
        const roomH = wd.h;
        const uid = Math.random();

        // Left segment
        const lw = wallLen/2 + holePos - holeW/2;
        if (lw > 0.1) {
            const off = -wallLen/2 + lw/2;
            this._box(`ws_L_${uid}`,
                isXWall ? lw : wd.w, wd.h, isXWall ? wd.d : lw,
                wd.px + (isXWall ? off : 0), wd.py, wd.pz + (isXWall ? 0 : off),
                this.materials.wall, 0, true, true);
        }

        // Right segment
        const rStart = holePos + holeW/2;
        const rw = wallLen/2 - rStart;
        if (rw > 0.1) {
            const off = rStart + rw/2;
            this._box(`ws_R_${uid}`,
                isXWall ? rw : wd.w, wd.h, isXWall ? wd.d : rw,
                wd.px + (isXWall ? off : 0), wd.py, wd.pz + (isXWall ? 0 : off),
                this.materials.wall, 0, true, true);
        }

        // Above
        const aboveH = roomH - (holeBtm + holeH);
        if (aboveH > 0.1) {
            this._box(`ws_A_${uid}`,
                isXWall ? holeW : wd.w, aboveH, isXWall ? wd.d : holeW,
                wd.px + (isXWall ? holePos : 0),
                wd.py + (holeBtm + holeH + aboveH/2) - roomH/2,
                wd.pz + (isXWall ? 0 : holePos),
                this.materials.wall, 0, true, true);
        }

        // Below (sill)
        if (holeBtm > 0.1) {
            this._box(`ws_B_${uid}`,
                isXWall ? holeW : wd.w, holeBtm, isXWall ? wd.d : holeW,
                wd.px + (isXWall ? holePos : 0),
                wd.py + holeBtm/2 - roomH/2,
                wd.pz + (isXWall ? 0 : holePos),
                this.materials.wall, 0, true, true);
        }

        // Track window
        if (hole.isWindow) {
            this.windows.push({
                position: new BABYLON.Vector3(
                    wd.px + (isXWall ? holePos : 0),
                    wd.py + holeBtm + holeH/2 - roomH/2,
                    wd.pz + (isXWall ? 0 : holePos)
                ),
                normal: wd.normalDir,
                width: holeW,
                height: holeH
            });
        }
    }

    // ── ENHANCED LIGHT SHAFTS ──

    _createLightShafts(camera, level) {
        const isExtreme = level === 'extreme';

        this.windows.forEach((win, i) => {
            // Bright emissive plane
            const lp = BABYLON.MeshBuilder.CreatePlane(`lSrc_${i}`, {
                width: win.width * 0.75, height: win.height * 0.75
            }, this.scene);
            lp.position = win.position.clone();

            if (Math.abs(win.normal.z) > 0.5)
                lp.rotation.y = win.normal.z > 0 ? 0 : Math.PI;
            else
                lp.rotation.y = win.normal.x > 0 ? Math.PI/2 : -Math.PI/2;

            const lpMat = new BABYLON.StandardMaterial(`lpM_${i}`, this.scene);
            lpMat.emissiveColor = new BABYLON.Color3(1.0, 0.95, 0.82);
            lpMat.disableLighting = true;
            lpMat.alpha = isExtreme ? 0.7 : 0.4;
            lp.material = lpMat;
            this.meshes.push(lp);

            // ── God Rays Post-Process ──
            try {
                const gr = new BABYLON.VolumetricLightScatteringPostProcess(
                    `gr_${i}`, 1.0, camera, lp,
                    isExtreme ? 80 : 40,
                    BABYLON.Texture.BILINEAR_SAMPLINGMODE,
                    this.scene.getEngine(), false
                );
                // EXTREME: crank these values
                gr.exposure = isExtreme ? 0.4 : 0.2;
                gr.decay    = isExtreme ? 0.985 : 0.97;
                gr.weight   = isExtreme ? 0.9 : 0.45;
                gr.density  = isExtreme ? 0.95 : 0.7;
            } catch (e) {
                console.warn(`God rays fallback window ${i}`);
            }

            // ── Spotlight for real illumination ──
            const spotDir = win.normal.scale(1);
            const spot = new BABYLON.SpotLight(
                `wSpot_${i}`,
                win.position.add(win.normal.scale(-1.5)),
                spotDir,
                isExtreme ? Math.PI / 3 : Math.PI / 4,
                isExtreme ? 1.5 : 3,
                this.scene
            );
            spot.diffuse = new BABYLON.Color3(1.0, 0.95, 0.85);
            spot.intensity = isExtreme ? 2.5 : 1.2;
            spot.range = isExtreme ? 30 : 18;
            this.lights.push(spot);

            // ── DUST PARTICLES IN LIGHT BEAM ──
            // This is what makes the shafts REALLY visible
            if (isExtreme) {
                this._createDustParticles(win, i);
            }
        });
    }

    _createDustParticles(win, idx) {
        // Create a particle system that emits dust motes in the light beam
        const ps = new BABYLON.ParticleSystem(`dust_${idx}`, 300, this.scene);

        // Use a simple circle texture generated in-memory
        const dustTex = new BABYLON.DynamicTexture(`dustTex_${idx}`, 32, this.scene, true);
        const dctx = dustTex.getContext();
        const gr = dctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gr.addColorStop(0, 'rgba(255, 240, 200, 1)');
        gr.addColorStop(0.5, 'rgba(255, 240, 200, 0.3)');
        gr.addColorStop(1, 'rgba(255, 240, 200, 0)');
        dctx.fillStyle = gr;
        dctx.fillRect(0, 0, 32, 32);
        dustTex.update();
        ps.particleTexture = dustTex;

        // Emitter: a box volume in front of the window, extending into the room
        const beamDepth = 12;
        const emitPos = win.position.add(win.normal.scale(beamDepth / 2));
        ps.emitter = emitPos;

        // Box emitter spanning the light beam volume
        ps.createBoxEmitter(
            new BABYLON.Vector3(-0.02, 0.02, -0.02),  // direction1
            new BABYLON.Vector3(0.02, -0.02, 0.02),    // direction2
            new BABYLON.Vector3(-win.width/2, -win.height/2, -beamDepth/2),  // minBox
            new BABYLON.Vector3(win.width/2, win.height/2, beamDepth/2)      // maxBox
        );

        // Particle properties — slow drifting motes
        ps.minLifeTime = 4;
        ps.maxLifeTime = 8;
        ps.emitRate = 40;

        ps.minSize = 0.02;
        ps.maxSize = 0.08;

        ps.color1 = new BABYLON.Color4(1.0, 0.95, 0.8, 0.25);
        ps.color2 = new BABYLON.Color4(1.0, 0.9, 0.7, 0.15);
        ps.colorDead = new BABYLON.Color4(1.0, 0.9, 0.7, 0);

        ps.minEmitPower = 0.01;
        ps.maxEmitPower = 0.05;

        ps.gravity = new BABYLON.Vector3(0, -0.005, 0); // Very slight downward drift

        ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
        ps.updateSpeed = 0.005;

        ps.start();
        this.dustSystems.push(ps);
    }

    // ── Torch ──

    _placeTorch(wallDef, posRatio, roomPos, roomWidth, roomDepth, roomHeight, isXWall) {
        const wallLen = isXWall ? roomWidth : roomDepth;
        const posAlong = posRatio * wallLen - wallLen / 2;
        const ty = roomPos.y + roomHeight * 0.6;
        const inset = 0.4;

        let tx = wallDef.px, tz = wallDef.pz;
        if (isXWall) {
            tx += posAlong;
            tz += wallDef.normalDir.z * inset;
        } else {
            tz += posAlong;
            tx += wallDef.normalDir.x * inset;
        }

        this.placeTorchAt(tx, ty, tz);
    }

    placeTorchAt(x, y, z) {
        // Bracket
        const br = BABYLON.MeshBuilder.CreateCylinder("tbr_" + Math.random(), {
            height: 0.5, diameter: 0.07, tessellation: 6
        }, this.scene);
        br.position = new BABYLON.Vector3(x, y - 0.2, z);
        br.material = this.materials.wood;
        this.meshes.push(br);

        // Light
        const light = new BABYLON.PointLight(`tl_${Math.random()}`,
            new BABYLON.Vector3(x, y + 0.3, z), this.scene);
        light.diffuse = new BABYLON.Color3(1.0, 0.65, 0.3);
        light.specular = new BABYLON.Color3(0.3, 0.2, 0.06);
        light.intensity = 0.85;
        light.range = 14;
        light._baseIntensity = 0.85;
        light._flickerOffset = Math.random() * 1000;
        this.lights.push(light);
        this.torchAnims.push(light);

        // Flame
        const fl = BABYLON.MeshBuilder.CreateSphere("fl_" + Math.random(), {
            diameter: 0.12, segments: 6
        }, this.scene);
        fl.position = new BABYLON.Vector3(x, y + 0.18, z);
        const fm = new BABYLON.StandardMaterial("fm_" + Math.random(), this.scene);
        fm.emissiveColor = new BABYLON.Color3(1.0, 0.55, 0.12);
        fm.disableLighting = true;
        fl.material = fm;
        this.meshes.push(fl);
    }

    // ── Atmosphere ──

    setupAtmosphere(scene) {
        scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.03, 1.0);
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.008;
        scene.fogColor = new BABYLON.Color3(0.04, 0.035, 0.05);

        const amb = scene.getLightByName("ambient");
        if (amb) {
            amb.intensity = 0.05;
            amb.diffuse = new BABYLON.Color3(0.1, 0.08, 0.15);
            amb.groundColor = new BABYLON.Color3(0.03, 0.025, 0.04);
        }
        const sun = scene.getLightByName("sun");
        if (sun) sun.intensity = 0.02;
    }

    // ── Update ──

    update(time) {
        this.torchAnims.forEach(l => {
            const t = time * 0.001 + l._flickerOffset;
            l.intensity = l._baseIntensity * (1.0
                + Math.sin(t * 8.3) * 0.09
                + Math.sin(t * 13.7) * 0.06
                + Math.sin(t * 23.1) * 0.03
                + (Math.random() - 0.5) * 0.04);
        });
    }

    // ── Room detection (for HUD label) ──

    getRoomAt(x, y, z) {
        for (const rb of this.roomBounds) {
            if (Math.abs(x - rb.x) < rb.hw + 2 &&
                Math.abs(z - rb.z) < rb.hd + 2 &&
                Math.abs(y - rb.y) < 10) {
                return rb;
            }
        }
        return null;
    }

    // ── Primitive helper ──

    _box(name, w, h, d, px, py, pz, mat, mass, receiveShadow, castShadow) {
        const m = BABYLON.MeshBuilder.CreateBox(name, { width: w, height: h, depth: d }, this.scene);
        m.position = new BABYLON.Vector3(px, py, pz);
        m.material = mat;
        if (receiveShadow) m.receiveShadow = true;
        if (castShadow) {
            m.castShadow = true;
            if (this.shadowGenerator) this.shadowGenerator.addShadowCaster(m);
        }
        if (this.havokPlugin) {
            try {
                new BABYLON.PhysicsAggregate(m, BABYLON.PhysicsShapeType.BOX, {
                    mass: mass, friction: 0.8
                }, this.scene);
            } catch(e) {}
        }
        this.meshes.push(m);
        return m;
    }

    // ── Cleanup ──

    dispose() {
        this.meshes.forEach(m => { try { if (m && !m.isDisposed()) m.dispose(); } catch(e){} });
        this.lights.forEach(l => { try { l.dispose(); } catch(e){} });
        this.dustSystems.forEach(ps => { try { ps.dispose(); } catch(e){} });
        this.meshes = []; this.lights = []; this.torchAnims = [];
        this.windows = []; this.dustSystems = []; this.roomBounds = [];
    }
}


// ═══════════════════════════════════════════════════════════════
// ENGINE BOOTSTRAP
// ═══════════════════════════════════════════════════════════════

let engine, scene, camera, havokPlugin, shadowGenerator;
let dungeonBuilder = null;
let skyboxData = null;
let startTime = 0;
let player = null;
let playerAggregate = null;
let keys = {};

async function boot() {
    setLoad(5, 'Creating engine...');

    const canvas = document.getElementById('renderCanvas');
    engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.03, 1.0);

    setLoad(15, 'Loading Havok physics...');
    try {
        const hk = await HavokPhysics();
        havokPlugin = new BABYLON.HavokPlugin(true, hk);
        scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), havokPlugin);
        setLoad(35, 'Physics loaded');
    } catch (e) {
        console.warn('Havok unavailable');
        setLoad(35, 'Physics skipped');
    }

    // Lights
    const amb = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0,1,0), scene);
    amb.intensity = 0.6; amb.groundColor = new BABYLON.Color3(0.2, 0.2, 0.3);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1,-2,-1), scene);
    sun.position = new BABYLON.Vector3(50, 100, 50); sun.intensity = 0.8;

    shadowGenerator = new BABYLON.ShadowGenerator(1024, sun);
    shadowGenerator.useBlurExponentialShadowMap = true;
    shadowGenerator.blurScale = 2; shadowGenerator.setDarkness(0.5);

    setLoad(45, 'Creating player...');

    // Player
    const pb = BABYLON.MeshBuilder.CreateBox("player", { width: 0.7, height: 1.7, depth: 0.7 }, scene);
    pb.position = new BABYLON.Vector3(0, 2, 0);
    const pm = new BABYLON.StandardMaterial("pMat", scene);
    pm.diffuseColor = new BABYLON.Color3(0.5, 0.15, 0.15); pm.alpha = 0.35;
    pb.material = pm;

    if (havokPlugin) {
        playerAggregate = new BABYLON.PhysicsAggregate(pb, BABYLON.PhysicsShapeType.BOX, {
            mass: 70, restitution: 0.05, friction: 0.5
        }, scene);
    }
    player = pb;

    // Camera
    camera = new BABYLON.ArcRotateCamera("cam",
        BABYLON.Tools.ToRadians(-90), BABYLON.Tools.ToRadians(72), 7,
        pb.position, scene);
    camera.lockedTarget = pb;
    camera.attachControl(canvas, true);
    camera.wheelPrecision = 80;
    camera.lowerRadiusLimit = 1; camera.upperRadiusLimit = 14;
    camera.panningSensibility = 0;
    camera.lowerBetaLimit = BABYLON.Tools.ToRadians(20);
    camera.upperBetaLimit = BABYLON.Tools.ToRadians(85);

    // Input
    scene.onKeyboardObservable.add((kb) => {
        const k = kb.event.key.toLowerCase();
        keys[k] = kb.type === BABYLON.KeyboardEventTypes.KEYDOWN;
    });

    setLoad(55, 'Building dungeon...');
    await buildDungeon({ layout: 'keep', rays: 'extreme', skybox: 'dawn' });

    setLoad(95, 'Starting render...');

    let lastRoomLabel = '';
    engine.runRenderLoop(() => {
        updatePlayer();
        if (dungeonBuilder) {
            dungeonBuilder.update(performance.now() - startTime);

            // Room label HUD
            if (player) {
                const room = dungeonBuilder.getRoomAt(player.position.x, player.position.y, player.position.z);
                if (room && room.label !== lastRoomLabel) {
                    lastRoomLabel = room.label;
                    document.getElementById('room-label').textContent = room.label;
                    document.querySelector('#floor-label .current').textContent = (room.floor || 0) + 1;
                }
            }
        }
        scene.render();
    });

    window.addEventListener('resize', () => engine.resize());

    setLoad(100, 'Ready');
    setTimeout(() => document.getElementById('loading').classList.add('hidden'), 400);
}

async function buildDungeon(opts) {
    if (dungeonBuilder) { dungeonBuilder.dispose(); dungeonBuilder = null; }
    if (skyboxData) {
        skyboxData.meshes.forEach(m => m.dispose());
        skyboxData.textures.forEach(t => t.dispose());
        skyboxData = null;
    }

    // Remove old post-processes
    camera.detachPostProcess && scene.postProcesses && scene.postProcesses.forEach(pp => {
        try { pp.dispose(); } catch(e) {}
    });

    // Create layout from graph
    let graph;
    switch (opts.layout) {
        case 'tower': graph = createLayout_Tower(); break;
        case 'catacombs': graph = createLayout_Catacombs(); break;
        case 'keep':
        default: graph = createLayout_CastleKeep(); break;
    }

    dungeonBuilder = new DungeonBuilder(scene, havokPlugin, shadowGenerator);
    dungeonBuilder.setupAtmosphere(scene);
    startTime = performance.now();

    // Build geometry from graph
    dungeonBuilder.buildFromGraph(graph, opts.rays, camera);

    // Skybox
    skyboxData = createProceduralSkybox(scene, opts.skybox);

    // Update floor count in HUD
    const maxFloor = Math.max(...graph.nodes.map(n => (n.floorLevel || 0) + 1));
    document.querySelector('#floor-label div:last-child').textContent = `of ${maxFloor}`;

    // Reset player
    if (player) {
        const firstNode = graph.nodes[0];
        player.position = new BABYLON.Vector3(
            firstNode.position.x,
            firstNode.position.y + 2,
            firstNode.position.z
        );
        if (playerAggregate) {
            playerAggregate.body.setLinearVelocity(BABYLON.Vector3.Zero());
            playerAggregate.body.setAngularVelocity(BABYLON.Vector3.Zero());
        }
    }

    console.log(`🏰 Dungeon built: ${graph.nodes.length} rooms, ${dungeonBuilder.windows.length} windows, ${dungeonBuilder.lights.length} lights`);
}


// ═══════════════════════════════════════════════════════════════
// PLAYER MOVEMENT
// ═══════════════════════════════════════════════════════════════

function updatePlayer() {
    if (!player || !playerAggregate) return;
    const body = playerAggregate.body;
    const force = 3500;

    const camDir = camera.getTarget().subtract(camera.position).normalize();
    const fwd = new BABYLON.Vector3(camDir.x, 0, camDir.z).normalize();
    const right = BABYLON.Vector3.Cross(BABYLON.Vector3.Up(), fwd).normalize();

    let mv = BABYLON.Vector3.Zero();
    if (keys['w'] || keys['arrowup'])    mv.addInPlace(fwd);
    if (keys['s'] || keys['arrowdown'])  mv.subtractInPlace(fwd);
    if (keys['a'] || keys['arrowleft'])  mv.addInPlace(right);
    if (keys['d'] || keys['arrowright']) mv.subtractInPlace(right);

    if (mv.length() > 0) {
        mv.normalize();
        body.applyForce(mv.scale(force), player.position);
    }

    if (keys[' ']) {
        const vel = body.getLinearVelocity();
        if (Math.abs(vel.y) < 1.5) {
            body.applyImpulse(new BABYLON.Vector3(0, 2800, 0), player.position);
        }
        keys[' '] = false;
    }

    const vel = body.getLinearVelocity();
    body.setLinearVelocity(new BABYLON.Vector3(vel.x * 0.91, vel.y, vel.z * 0.91));
    body.setAngularVelocity(BABYLON.Vector3.Zero());
}


// ═══════════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════════

function rebuildDungeon() {
    buildDungeon({
        layout: document.getElementById('cfgLayout').value,
        rays: document.getElementById('cfgRays').value,
        skybox: document.getElementById('cfgSkybox').value
    });
}

boot().catch(err => { console.error(err); setLoad(0, 'Error: ' + err.message); });
</script>
