<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - TRAINTOWN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
        }
        
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #D2691E;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 18px;
            z-index: 100;
            font-weight: bold;
        }
        
        #objectives {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 16px;
            z-index: 100;
            text-align: right;
        }
        
        #dialogue {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 69, 19, 0.9);
            padding: 20px 30px;
            border: 3px solid #FFD700;
            color: #FFF;
            max-width: 600px;
            display: none;
            z-index: 100;
        }
        
        #dialogue h3 {
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #D2691E;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 14px;
            z-index: 100;
        }
        
        #interaction-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(139, 69, 19, 0.95);
            padding: 20px 40px;
            border: 3px solid #FFD700;
            color: #FFD700;
            font-size: 20px;
            font-weight: bold;
            display: none;
            z-index: 150;
            text-align: center;
            animation: pulse 1s infinite;
        }
        
        #title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #D2691E 0%, #8B4513 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #FFD700;
            text-align: center;
        }
        
        #title-screen h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.8);
        }
        
        #title-screen p {
            font-size: 24px;
            margin-bottom: 40px;
        }
        
        #title-screen button {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            padding: 15px 40px;
            background: #8B4513;
            color: #FFD700;
            border: 3px solid #FFD700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #title-screen button:hover {
            background: #FFD700;
            color: #8B4513;
            transform: scale(1.1);
        }
        
        #title-screen button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .warning {
            color: #FF4444;
            font-size: 18px;
            margin-top: 20px;
            animation: pulse 1s infinite;
        }
        
        .error-message {
            color: #FF4444;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #FF4444;
            max-width: 600px;
            font-size: 14px;
            text-align: left;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Title Screen -->
    <div id="title-screen">
        <h1>🤠 HIGH NOON SHOWDOWN 🤠</h1>
        <p>A dying town. A broken train. And something sinister afoot...</p>
        <button id="start-btn">START GAME</button>
        <p class="warning">⚠️ WARNING: Contains gore and moral consequences ⚠️</p>
        <div id="error-display"></div>
    </div>
    
    <!-- HUD -->
    <div id="hud">
        <div>Speed: <span id="speed">0</span></div>
        <div>Score: <span id="score">0</span></div>
        <div>Combo: <span id="combo">0</span>x</div>
    </div>
    
    <!-- Objectives -->
    <div id="objectives">
        <h3>OBJECTIVES:</h3>
        <div id="objective-list"></div>
    </div>
    
    <!-- Dialogue Box -->
    <div id="dialogue">
        <h3 id="dialogue-speaker"></h3>
        <p id="dialogue-text"></p>
    </div>
    
    <!-- Controls -->
    <div id="controls">
        WASD: Move | SPACE: Jump | Q/E: Tricks | E: Interact | F: Talk to NPCs
    </div>
    
    <!-- Interaction Prompt -->
    <div id="interaction-prompt">Press E to interact</div>

    <script type="module">
        // Error handling
        function showError(message, error) {
            const errorDiv = document.getElementById('error-display');
            errorDiv.innerHTML = `
                <div class="error-message">
                    <strong>ERROR:</strong> ${message}<br><br>
                    <strong>Details:</strong> ${error.message}<br><br>
                    <strong>Check console for full error</strong>
                </div>
            `;
            console.error('Full error:', error);
        }
        
        let game = null;
        let levelConfig = null;
        
        // Load modules with error handling
        async function loadModules() {
            try {
                console.log('Loading ApplesauceCore...');
                const coreModule = await import('./engine/applesauce-core-33.js');
                const ApplesauceCore = coreModule.ApplesauceCore;
                
                console.log('Loading HighNoonShowdown level...');
                const levelModule = await import('./configs/applesauce-level-wildwest.js');
                levelConfig = levelModule.HighNoonShowdown;
                
                console.log('✅ All modules loaded successfully!');
                return ApplesauceCore;
            } catch (error) {
                console.error('❌ Module loading failed:', error);
                
                // Provide helpful error messages
                if (error.message.includes('three.module.js')) {
                    showError('Cannot find three.module.js', error);
                    throw new Error('Missing three.module.js - make sure it\'s in the same directory');
                } else if (error.message.includes('applesauce-core')) {
                    showError('Cannot find applesauce-core_copy_2.js', error);
                } else if (error.message.includes('applesauce-level-wildwest')) {
                    showError('Cannot find applesauce-level-wildwest.js', error);
                } else {
                    showError('Module loading error', error);
                }
                throw error;
            }
        }
        
        // Start game function
        async function startGame() {
            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = true;
            startBtn.textContent = 'LOADING...';
            
            try {
                // Load modules
                const ApplesauceCore = await loadModules();
                
                // Hide title screen
                document.getElementById('title-screen').style.display = 'none';
                
                // Initialize core with config
                game = new ApplesauceCore({
                    goreEnabled: true,
                    dialogueEnabled: true,
                    enemiesEnabled: true,
                    objectivesEnabled: true,
                    collisionEnabled: true,
                    maxSpeed: 1.0
                });
                
                // Load the Wild West level
                await game.loadLevel(levelConfig);
                
                // Add custom update hook for level-specific logic
                game.customUpdate = function() {
                    if (levelConfig.onUpdate) {
                        levelConfig.onUpdate(game);
                    }
                };
                
                // Override core update to include custom logic
                const originalUpdate = game.update.bind(game);
                game.update = function() {
                    originalUpdate();
                    if (game.customUpdate) {
                        game.customUpdate();
                    }
                };
                
                // Start the game loop
                game.start();
                
                console.log('🤠 High Noon Showdown loaded!');
            } catch (error) {
                console.error('Failed to start game:', error);
                startBtn.disabled = false;
                startBtn.textContent = 'RETRY';
                showError('Failed to start game', error);
            }
        }
        
        // Attach to button
        document.getElementById('start-btn').addEventListener('click', startGame);
        
        // Update HUD periodically
        setInterval(() => {
            if (game && game.state) {
                const speedEl = document.getElementById('speed');
                const scoreEl = document.getElementById('score');
                const comboEl = document.getElementById('combo');
                
                if (speedEl) speedEl.textContent = Math.abs(game.state.speed).toFixed(2);
                if (scoreEl) scoreEl.textContent = game.state.score;
                if (comboEl) comboEl.textContent = game.state.combo;
            }
            
            // Update objectives
            if (game && game.modules && game.modules.objectives && game.modules.objectives.objectives) {
                const objectives = game.modules.objectives.objectives;
                const listEl = document.getElementById('objective-list');
                if (listEl) {
                    listEl.innerHTML = objectives.map(obj => {
                        const status = obj.completed ? '✅' : '⏳';
                        return `<div>${status} ${obj.description}</div>`;
                    }).join('');
                }
            }
        }, 100);
    </script>
</body>
</html>
