<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Main Menu</title>
    <link rel="stylesheet" href="engine/skater/skater-editor.css">
    
    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    
    <!-- Havok Physics -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
</head>
<body>
    <!-- Preview Window -->
    <div class="preview-window">
        <h3>YOUR SKATER</h3>
        <canvas id="previewCanvas" class="preview-3d"></canvas>
        <div id="equippedInfo" style="margin-top: 10px; text-align: center; font-size: 0.9em;">
            <p>Deck: <span id="equippedDeck">Default</span></p>
            <p>Helmet: <span id="equippedHelmet">Default</span></p>
        </div>
    </div>

    <!-- Main Editor Container -->
    <div class="skater-editor">
        <div class="currency">
            <h2 id="helmetCounter">🪖 0</h2>
            <p style="margin-top: 10px; opacity: 0.8;">Collect helmets to unlock gear</p>
        </div>

        <div id="editor-container">
            <!-- Generated by SkaterEditor.generateUI() -->
        </div>
    </div>

    <!-- Main game modules -->
    <script type="module">
        import { SaveSystem } from './applesauce-save-system.js';
        import { StoreSystem } from './applesauce-store-system.js';
        import { SkaterEditor } from './example-level-25.js';

        // ============================================
        // INITIALIZE SYSTEMS
        // ============================================
        
        const saveSystem = new SaveSystem();
        const storeSystem = new StoreSystem(saveSystem);
        const editor = new SkaterEditor(saveSystem, storeSystem);
        
        // Make globally accessible for button clicks
        window.editor = editor;
        window.saveSystem = saveSystem;
        window.storeSystem = storeSystem;
        
        // ============================================
        // UPDATE UI
        // ============================================
        
        function updateUI() {
            // Update helmet counter
            document.getElementById('helmetCounter').textContent = `🪖 ${saveSystem.getHelmets()}`;
            
            // Update equipped items display
            const equipped = saveSystem.getEquipped();
            document.getElementById('equippedDeck').textContent = equipped.deck;
            document.getElementById('equippedHelmet').textContent = equipped.helmet;
            
            // Regenerate editor UI
            document.getElementById('editor-container').innerHTML = editor.generateUI();
        }
        
        // Initial UI update
        updateUI();
        
        // ============================================
        // SETUP PREVIEW CANVAS (Optional 3D preview)
        // ============================================
        
        const previewCanvas = document.getElementById('previewCanvas');
        const previewEngine = new BABYLON.Engine(previewCanvas, true);
        const previewScene = new BABYLON.Scene(previewEngine);
        previewScene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);
        
        // Camera
        const previewCamera = new BABYLON.ArcRotateCamera(
            "previewCam",
            Math.PI / 2,
            Math.PI / 3,
            5,
            BABYLON.Vector3.Zero(),
            previewScene
        );
        previewCamera.attachControl(previewCanvas, true);
        
        // Light
        const light = new BABYLON.HemisphericLight(
            "light",
            new BABYLON.Vector3(0, 1, 0),
            previewScene
        );
        
        // Placeholder skater model (you'd replace with actual model)
        const skater = BABYLON.MeshBuilder.CreateBox(
            "skater",
            { size: 1 },
            previewScene
        );
        
        // Render preview
        previewEngine.runRenderLoop(() => {
            previewScene.render();
        });
        
        window.addEventListener('resize', () => {
            previewEngine.resize();
        });
        
        // ============================================
        // GLOBAL FUNCTIONS FOR BUTTONS
        // ============================================
        
        window.buyItem = function(category, itemId) {
            const result = editor.buyItem(category, itemId);
            
            if (result.success) {
                showNotification(`✅ Bought ${result.item.name}!`, 'success');
                updateUI();
            } else {
                showNotification(`❌ ${result.reason}`, 'error');
            }
        };
        
        window.equipItem = function(category, itemId) {
            if (editor.equipItem(category, itemId)) {
                showNotification(`👕 Equipped ${itemId}`, 'success');
                updateUI();
            }
        };
        
        // ============================================
        // NOTIFICATION SYSTEM
        // ============================================
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.5s ease';
                setTimeout(() => {
                    notification.remove();
                }, 500);
            }, 3000);
        }
        
        // ============================================
        // DEBUG COMMANDS (available in console)
        // ============================================
        
        window.debug = {
            addHelmets: (amount) => {
                saveSystem.addHelmets(amount);
                updateUI();
                console.log(`Added ${amount} helmets`);
            },
            
            unlockAll: () => {
                ['decks', 'helmets', 'wheels', 'outfits'].forEach(category => {
                    storeSystem.getCategory(category).forEach(item => {
                        saveSystem.unlock(category, item.id);
                    });
                });
                updateUI();
                console.log('Unlocked all items!');
            },
            
            resetSave: () => {
                if (confirm('Reset all progress?')) {
                    saveSystem.reset();
                    updateUI();
                    console.log('Save data reset!');
                }
            },
            
            showSave: () => {
                console.log('Current save data:', saveSystem.data);
            },
            
            exportSave: () => {
                const saveData = saveSystem.export();
                console.log('Save data (copy this):', saveData);
                navigator.clipboard.writeText(saveData);
                alert('Save data copied to clipboard!');
            },
            
            importSave: (jsonString) => {
                if (saveSystem.import(jsonString)) {
                    updateUI();
                    console.log('Save imported successfully!');
                } else {
                    console.error('Failed to import save!');
                }
            }
        };
        
        console.log('🎮 APPLESAUCE Debug Commands:');
        console.log('debug.addHelmets(1000) - Add helmets');
        console.log('debug.unlockAll() - Unlock all items');
        console.log('debug.resetSave() - Reset progress');
        console.log('debug.showSave() - View save data');
        console.log('debug.exportSave() - Export save');
        console.log('debug.importSave(json) - Import save');
        
        // ============================================
        // PLAY BUTTON (goes to game)
        // ============================================
        
        window.playGame = function() {
            // Save before playing
            saveSystem.save();
            
            // Redirect to game
            window.location.href = 'game.html';
        };
    </script>
    
    <style>
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }
    </style>
</body>
</html>
