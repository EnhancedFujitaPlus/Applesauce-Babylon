<!DOCTYPE html>
<html>
<head>
    <title>UltraBabylon Gore Facility - Enhanced</title>
    <style>
        body { margin: 0; background: #000; }
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #0f0;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border: 2px solid #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 1000;
        }
        .stat-line { margin: 5px 0; }
        .stat-value { color: #ff0; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Stats Display -->
    <div id="stats">
        <div class="stat-line">🩸 GORE ENGINE ACTIVE</div>
        <div class="stat-line">Impacts: <span class="stat-value" id="impacts">0</span></div>
        <div class="stat-line">Dismemberments: <span class="stat-value" id="dismembers">0</span></div>
        <div class="stat-line">Deaths: <span class="stat-value" id="deaths">0</span></div>
        <div class="stat-line">Alive: <span class="stat-value" id="alive">0</span></div>
    </div>
   <!-- IMPORT MAP - Must come BEFORE any module scripts -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js"
        }
    }
    </script>
    
    <!-- YOUR PHYSICS LIBRARY - Load as a module -->
    <script type="module" src="../applesauce-core-babylon.js"></script>
    
    <script>
// ============================================
// GORE CONFIGURATION
// ============================================
const GORE = {
    enabled: true,
    scale: 1.0,              // Body size (1.0 = realistic)
    severSpeed: 15,          // m/s to sever limbs
    explodeSpeed: 30,        // m/s for catastrophic
    damageSpeed: 8,          // m/s to start damage
    headMultiplier: 3.0,
    torsoMultiplier: 1.0,
    limbMultiplier: 0.7,
    showDamageLog: true,
    bloodParticles: true
};

// ============================================
// GORE TRACKING SYSTEM
// ============================================
class GoreSystem {
    constructor() {
        this.ragdolls = new Map();
        this.bodyVelocities = new Map();
        this.lastPositions = new Map();
        this.severedJoints = new Set();
        this.stats = { totalImpacts: 0, totalDismemberments: 0, totalDeaths: 0 };
    }
    
    registerRagdoll(ragdollId, bodies, joints) {
        this.ragdolls.set(ragdollId, {
            bodies: bodies,
            joints: joints,
            health: 100,
            alive: true
        });
        
        for (let partName in bodies) {
            const bodyId = `${ragdollId}_${partName}`;
            this.bodyVelocities.set(bodyId, { speed: 0 });
        }
    }
    
    update(deltaTime = 0.016) {
        for (let [ragdollId, ragdoll] of this.ragdolls) {
            if (!ragdoll.alive) continue;
            
            for (let partName in ragdoll.bodies) {
                const body = ragdoll.bodies[partName];
                const bodyId = `${ragdollId}_${partName}`;
                
                // YOUR PHYSICS ENGINE: Get position from body
                // This is a placeholder - adapt to your physics engine
                if (!body || !body.getPosition) continue;
                
                const pos = body.getPosition();
                const currentPos = { x: pos.x || 0, y: pos.y || 0, z: pos.z || 0 };
                const lastPos = this.lastPositions.get(bodyId) || currentPos;
                
                const vx = (currentPos.x - lastPos.x) / deltaTime;
                const vy = (currentPos.y - lastPos.y) / deltaTime;
                const vz = (currentPos.z - lastPos.z) / deltaTime;
                const speed = Math.sqrt(vx*vx + vy*vy + vz*vz);
                
                this.bodyVelocities.set(bodyId, { speed, vx, vy, vz });
                this.lastPositions.set(bodyId, { ...currentPos });
            }
        }
    }
    
    onImpact(ragdollId, partName, impactSpeed = null) {
        const ragdoll = this.ragdolls.get(ragdollId);
        if (!ragdoll || !ragdoll.alive) return;
        
        const bodyId = `${ragdollId}_${partName}`;
        const velocityData = this.bodyVelocities.get(bodyId);
        const speed = impactSpeed || (velocityData ? velocityData.speed : 0);
        
        if (speed < GORE.damageSpeed) return;
        
        const zone = partName.includes('head') ? 'head' : 
                    partName.includes('body') ? 'torso' : 'limb';
        const multiplier = zone === 'head' ? GORE.headMultiplier :
                          zone === 'torso' ? GORE.torsoMultiplier : GORE.limbMultiplier;
        
        const damage = speed * 5 * multiplier;
        ragdoll.health -= damage;
        this.stats.totalImpacts++;
        
        console.log(`💥 ${partName} impact: ${speed.toFixed(1)}m/s | dmg: ${damage.toFixed(1)} | hp: ${ragdoll.health.toFixed(1)}`);
        
        if (speed >= GORE.severSpeed) {
            this.checkDismemberment(ragdollId, partName, speed);
        }
        
        if (ragdoll.health <= 0 && ragdoll.alive) {
            ragdoll.alive = false;
            this.stats.totalDeaths++;
            console.log(`☠️ Ragdoll ${ragdollId} DEAD`);
        }
        
        updateStatsDisplay();
    }
    
    checkDismemberment(ragdollId, partName, speed) {
        const jointMap = {
            'head': ['neck'], 'body1': ['neck', 'spine'],
            'body2': ['spine', 'hipL', 'hipR'],
            'armL1': ['shoulderL'], 'armL2': ['elbowL'],
            'armR1': ['shoulderR'], 'armR2': ['elbowR'],
            'legL1': ['hipL'], 'legL2': ['kneeL'],
            'legR1': ['hipR'], 'legR2': ['kneeR']
        };
        
        const joints = jointMap[partName] || [];
        for (let jointName of joints) {
            const jointId = `${ragdollId}_${jointName}`;
            if (this.severedJoints.has(jointId)) continue;
            
            if (speed >= GORE.severSpeed) {
                this.severedJoints.add(jointId);
                this.stats.totalDismemberments++;
                
                const severity = speed >= GORE.explodeSpeed ? 'CATASTROPHIC' : 'SEVERE';
                console.log(`🔪 ${jointName} SEVERED! [${severity}] ${speed.toFixed(1)}m/s`);
                
                // REMOVE THE JOINT FROM YOUR PHYSICS ENGINE HERE
                const ragdoll = this.ragdolls.get(ragdollId);
                if (ragdoll && ragdoll.joints && ragdoll.joints[jointName]) {
                    // Example: phy.remove(ragdoll.joints[jointName]);
                }
                
                updateStatsDisplay();
            }
        }
    }
    
    getStats() {
        return {
            ...this.stats,
            alive: Array.from(this.ragdolls.values()).filter(r => r.alive).length
        };
    }
}

const gore = new GoreSystem();

// ============================================
// STATS DISPLAY UPDATE
// ============================================
function updateStatsDisplay() {
    const stats = gore.getStats();
    document.getElementById('impacts').textContent = stats.totalImpacts;
    document.getElementById('dismembers').textContent = stats.totalDismemberments;
    document.getElementById('deaths').textContent = stats.totalDeaths;
    document.getElementById('alive').textContent = stats.alive;
}

// ============================================
// YOUR ORIGINAL CODE WITH GORE INTEGRATION
// ============================================

const numRagdoll = 100
const debug = false

demo = () => {
    phy.view({ envmap:'bed', ground:true, distance:debug?4:12 })
    phy.set({ substep:1, gravity:[0,debug? 0: -9.81,0]})
    phy.add({ type:'box', size:[30,1,30], pos:[0, -0.5, 0], visible:false })

    if(debug){
        ragdoll({ pos:[0, 2, 0] })
    } else {
        // Add stairs
        let j = 20, n;
        while(j--){
            n = (j*3)*0.1;
            phy.add({ type:'box', size:[8,0.3,1], pos:[0,0.15+n,3-n*1.2], radius:0.02, instance:'stair', ray:false })
        }

        // Add walls
        phy.add({ type:'box', size:[0.5,3,5], pos:[4.25,1.5,1.6], radius:0.02, ray:false })
        phy.add({ type:'box', size:[0.5,3,5], pos:[-4.25,1.5,1.6], radius:0.02, ray:false })
        phy.add({ type:'box', size:[0.5,3,5], pos:[0,1.5,1.6], radius:0.02, ray:false })

        // Add ragdolls
        let i = numRagdoll
        while(i--) ragdoll({ pos:[math.rand(-3, 3), 10+i, -3] })
    }
}

ragdoll = ( o ) => {
    // Generate unique ID for this ragdoll
    const ragdollId = `ragdoll_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`
    
    let s = 0.6 * GORE.scale  // Apply gore scale

    let headHeight = 0.3*s
    let upperBody = 0.35*s
    let lowerBody = 0.35*s
    let bodyRadius = 0.2*s
    let legRadius = 0.1*s
    let legInterval = 0.15*s
    let upperLeg = 0.5*s
    let lowerLeg = 0.5*s
    let armRadius = 0.075*s
    let upperArm = 0.35*s
    let lowerArm = 0.35*s

    const instanced = {
        head:'head', body1: 'body1', body2: 'body2',
        legL1: 'leg1', legL2: 'leg1', legR1: 'leg1', legR2: 'leg1',
        armL1: 'arm1', armL2: 'arm1', armR1: 'arm1', armR2: 'arm1'
    }

    const data = {
        head: { size:[ headHeight / 2 * 0.8, (headHeight / 2 * 0.2)*2], pos:[0, lowerBody + upperBody + bodyRadius + headHeight / 2, 0] },
        body1: { size:[bodyRadius, upperBody], pos:[0, lowerBody + upperBody / 2, 0] },
        body2: { size:[bodyRadius, lowerBody], pos:[0,  lowerBody / 2, 0] },
        legL1: { size:[legRadius, upperLeg], pos:[-legInterval, -upperLeg / 2 - legInterval, 0] },
        legL2: { size:[legRadius, lowerLeg], pos:[-legInterval, -upperLeg - lowerLeg / 2 - legInterval, 0] },
        legR1: { size:[legRadius, upperLeg], pos:[legInterval, -upperLeg / 2 - legInterval, 0] },
        legR2: { size:[legRadius, lowerLeg], pos:[legInterval, -upperLeg - lowerLeg / 2 - legInterval, 0] },
        armL1: { size:[armRadius, upperArm], pos:[-bodyRadius - upperArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] },
        armL2: { size:[armRadius, lowerArm], pos:[-bodyRadius - upperArm - lowerArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] },
        armR1: { size:[armRadius, upperArm], pos:[bodyRadius + upperArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] },
        armR2: { size:[armRadius, lowerArm], pos:[bodyRadius + upperArm + lowerArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] }
    }

    const dataP = {
        head: { size:[ headHeight / 2 * 0.8, (headHeight / 2 * 0.2)*2], pos:[0, lowerBody + upperBody + bodyRadius + headHeight / 2, 0] },
        body1: { size:[bodyRadius, upperBody-bodyRadius], pos:[0,  lowerBody + upperBody / 2, 0] },
        body2: { size:[bodyRadius, lowerBody-bodyRadius], pos:[0,  lowerBody / 2, 0] },
        legL1: { size:[legRadius, upperLeg-legRadius*2], pos:[-legInterval, -upperLeg / 2 - legInterval, 0] },
        legL2: { size:[legRadius, lowerLeg-legRadius*2], pos:[-legInterval, -upperLeg - lowerLeg / 2 - legInterval, 0] },
        legR1: { size:[legRadius, upperLeg-legRadius*2], pos:[legInterval, -upperLeg / 2 - legInterval, 0] },
        legR2: { size:[legRadius, lowerLeg-legRadius*2], pos:[legInterval, -upperLeg - lowerLeg / 2 - legInterval, 0] },
        armL1: { size:[armRadius, upperArm-armRadius*2], pos:[-bodyRadius - upperArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] },
        armL2: { size:[armRadius, lowerArm-armRadius*2], pos:[-bodyRadius - upperArm - lowerArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] },
        armR1: { size:[armRadius, upperArm-armRadius*2], pos:[bodyRadius + upperArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] },
        armR2: { size:[armRadius, lowerArm-armRadius*2], pos:[bodyRadius + upperArm + lowerArm / 2, lowerBody + upperBody, 0], rot:[0,0,90] }
    }

    // ADD BODY
    const b = {}
    
    for( let n in data ){
        b[ n ] = phy.add({ 
            instance:instanced[n],
            type:'capsule', 
            mass:1,
            restitution:0.1, 
            friction:0.4, 
            phySize:dataP[n].size, 
            phyPos:math.addArray( o.pos, dataP[n].pos ),
            size: debug ? dataP[n].size : data[n].size, 
            pos:math.addArray( o.pos, data[n].pos ),
            rot:data[n].rot||[0,0,0],
            material:debug? 'debug':'skinny',
            
            // GORE INTEGRATION: Add collision callback
            callback: function(collision) {
                // Trigger gore impact check on collision
                if (GORE.enabled) {
                    gore.onImpact(ragdollId, n);
                }
            }
        })
    }

    const defJoint = { type:'joint', visible:debug, collision:true }

    // STORE JOINTS FOR GORE SYSTEM
    const joints = {}

    // Body joints
    joints.neck = phy.add({ 
        ...defJoint, mode:'ragdoll', 
        b1:b.body1, b2:b.head, 
        worldAnchor:math.addArray( o.pos, [0,  lowerBody + upperBody + bodyRadius, 0]), 
        worldTwistAxis:[0,1,0], worldSwingAxis:[1,0,0],
        lm:[ ['twist', -90, 90], ['swing1', -90, 90], ['swing2', -70, 70] ]
    })

    joints.spine = phy.add({ 
        ...defJoint, mode:'ragdoll', 
        b1:b.body1, b2:b.body2, 
        worldAnchor:math.addArray( o.pos, [0, lowerBody, 0]), 
        worldTwistAxis:[0,1,0], worldSwingAxis:[1,0,0],
        lm:[ ['twist', -45, 45], ['swing1', -60, 60], ['swing2', -45, 45] ],
        collision:false
    })

    // Left arm joints
    joints.shoulderL = phy.add({ 
        ...defJoint, mode:'ragdoll', 
        b1:b.body1, b2:b.armL1, 
        worldAnchor:math.addArray( o.pos, [-bodyRadius, lowerBody + upperBody, 0]), 
        worldTwistAxis:[1,0,0], worldSwingAxis:[0,0,1],
        lm:[ ['twist', -90, 90], ['swing1', -90, 90], ['swing2', -90, 90] ]
    })

    joints.elbowL = phy.add({ 
        ...defJoint, mode:'revolute', 
        b1:b.armL1, b2:b.armL2, 
        worldAnchor:math.addArray( o.pos, [-bodyRadius - upperArm, lowerBody + upperBody, 0]), 
        worldAxis:[0,1,0], lm:[0,90], sd:[10, 1]
    })

    // Right arm joints
    joints.shoulderR = phy.add({ 
        ...defJoint, mode:'ragdoll', 
        b1:b.body1, b2:b.armR1, 
        worldAnchor:math.addArray( o.pos, [bodyRadius, lowerBody + upperBody, 0]), 
        worldTwistAxis:[-1,0,0], worldSwingAxis:[0,0,1],
        lm:[ ['twist', -90, 90], ['swing1', -90, 90], ['swing2', -90, 90] ]
    })

    joints.elbowR = phy.add({ 
        ...defJoint, mode:'revolute', 
        b1:b.armR1, b2:b.armR2, 
        worldAnchor:math.addArray( o.pos, [bodyRadius + upperArm, lowerBody + upperBody, 0]), 
        worldAxis:[0,-1,0], lm:[0,90], sd:[10, 1]
    })

    // Left leg joints
    joints.hipL = phy.add({ 
        ...defJoint, mode:'ragdoll', 
        b1:b.body2, b2:b.legL1, 
        worldAnchor:math.addArray( o.pos, [-legInterval, -legInterval, 0]), 
        worldTwistAxis:[0,1,0], worldSwingAxis:[1,0,0],
        lm:[ ['twist', -90, 90], ['swing1', -90, 90], ['swing2', -70, 70] ]
    })

    joints.kneeL = phy.add({ 
        ...defJoint, mode:'revolute', 
        b1:b.legL1, b2:b.legL2, 
        worldAnchor:math.addArray( o.pos, [-legInterval, -legInterval - upperLeg, 0]), 
        worldAxis:[1,0,0], lm:[1,100]
    })

    // Right leg joints
    joints.hipR = phy.add({ 
        ...defJoint, mode:'ragdoll', 
        b1:b.body2, b2:b.legR1, 
        worldAnchor:math.addArray( o.pos, [legInterval, -legInterval, 0]), 
        worldTwistAxis:[0,1,0], worldSwingAxis:[1,0,0],
        lm:[ ['twist', -90, 90], ['swing1', -20, 20], ['swing2', -20, 20] ]
    })

    joints.kneeR = phy.add({ 
        ...defJoint, mode:'revolute', 
        b1:b.legR1, b2:b.legR2, 
        worldAnchor:math.addArray( o.pos, [legInterval, -legInterval - upperLeg, 0]), 
        worldAxis:[1,0,0], lm:[1,100]
    })

    // REGISTER WITH GORE SYSTEM
    gore.registerRagdoll(ragdollId, b, joints);
    
    return ragdollId
}

// ============================================
// GORE UPDATE LOOP
// ============================================
let lastGoreUpdate = Date.now();
function updateGoreSystem() {
    const now = Date.now();
    const dt = (now - lastGoreUpdate) / 1000;
    lastGoreUpdate = now;
    
    gore.update(dt);
    requestAnimationFrame(updateGoreSystem);
}

// Start gore tracking
setTimeout(() => {
    updateGoreSystem();
    updateStatsDisplay();
    console.log('🩸 GORE ENGINE ACTIVE');
}, 1000);

    </script>
</body>
