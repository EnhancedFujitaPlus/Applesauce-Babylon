<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Level 23: Paradeli Park</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 24px;
            text-align: center;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 3px solid #0f0;
        }
        
        .loading-spinner {
            border: 4px solid #0f0;
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #0f0;
            font-size: 14px;
            z-index: 1000;
            min-width: 300px;
            display: none;
        }
        
        .hud-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        
        .hud-section {
            margin: 10px 0;
            padding: 10px 0;
            border-top: 1px solid #0f0;
        }
        
        .hud-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .hud-value {
            color: #ff0;
            font-weight: bold;
            font-size: 18px;
        }
        
        .objective {
            margin: 5px 0;
            font-size: 13px;
        }
        
        .objective.complete {
            color: #0f0;
            text-decoration: line-through;
        }
        
        .objective.incomplete {
            color: #ff0;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border: 2px solid #0f0;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }
        
        .control-line {
            margin: 5px 0;
        }
        
        .key {
            display: inline-block;
            background: #0f0;
            color: #000;
            padding: 2px 8px;
            margin-right: 5px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border: 2px solid #0f0;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
            display: none;
        }
        
        .status-good { color: #0f0; }
        .status-warn { color: #ff0; }
        .status-bad { color: #f00; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="loading">
        <div>🛹 LOADING PARADELI PARK 🛹</div>
        <div class="loading-spinner"></div>
        <div id="loading-text" style="font-size: 14px; margin-top: 20px;">Initializing Babylon.js...</div>
    </div>
    
    <div id="hud">
        <div class="hud-title">🛹 PARADELI PARK</div>
        
        <div class="hud-section">
            <div class="hud-label">Score</div>
            <div class="hud-value"><span id="score">0</span></div>
        </div>
        
        <div class="hud-section">
            <div class="hud-label">Speed</div>
            <div><span id="speed">0.0</span> m/s</div>
        </div>
        
        <div class="hud-section">
            <div class="hud-label">Objectives</div>
            <div class="objective" id="obj-roadkill">
                💀 Roadkill: <span id="roadkills">0</span>/10
            </div>
            <div class="objective" id="obj-kickflip">
                🛹 Kickflips: <span id="kickflips">0</span>/5
            </div>
            <div class="objective" id="obj-boss">
                👹 Defeat Boss
            </div>
        </div>
    </div>
    
    <div id="controls">
        <div style="font-weight: bold; margin-bottom: 10px;">CONTROLS</div>
        <div class="control-line"><span class="key">WASD</span> Move</div>
        <div class="control-line"><span class="key">SPACE</span> Jump</div>
        <div class="control-line"><span class="key">E</span> Kickflip</div>
        <div class="control-line"><span class="key">R</span> Spawn Ragdoll (Test)</div>
    </div>
    
    <div id="status">
        <div style="font-weight: bold; margin-bottom: 10px;">🎮 GAME STATUS</div>
        <div id="status-text"></div>
    </div>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    
    <script type="module">
        import { Level23Config } from './level_23_complete.js';
        import { ApplesauceCore } from './applesauce-core-babylon.js';
        import { BabylonSkater } from './babylon-skater-fixed.js';
        import { BabylonTerrain } from './babylon-terrain.js';
        import { BabylonGorePhysics } from './babylon-gore-physics.js';
        
        let game = null;
        
        function updateLoading(text) {
            document.getElementById('loading-text').textContent = text;
        }
        
        function showStatus(text, type = 'good') {
            const statusEl = document.getElementById('status-text');
            const line = document.createElement('div');
            line.className = `status-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            statusEl.appendChild(line);
            
            // Keep only last 10 lines
            while (statusEl.children.length > 10) {
                statusEl.removeChild(statusEl.firstChild);
            }
        }
        
        function updateHUD() {
            if (!game || !game.state) return;
            
            // Update score
            document.getElementById('score').textContent = game.state.score || 0;
            
            // Update speed
            if (game.playerModule) {
                const speed = game.playerModule.getSpeed();
                document.getElementById('speed').textContent = speed.toFixed(1);
            }
            
            // Update objectives
            const roadkills = game.state.roadkills || 0;
            const kickflips = game.state.kickflips || 0;
            
            document.getElementById('roadkills').textContent = roadkills;
            document.getElementById('kickflips').textContent = kickflips;
            
            // Update objective status
            const roadkillObj = document.getElementById('obj-roadkill');
            if (roadkills >= 10) {
                roadkillObj.className = 'objective complete';
            } else {
                roadkillObj.className = 'objective incomplete';
            }
            
            const kickflipObj = document.getElementById('obj-kickflip');
            if (kickflips >= 5) {
                kickflipObj.className = 'objective complete';
            } else {
                kickflipObj.className = 'objective incomplete';
            }
            
            // Boss status
            const bossObj = document.getElementById('obj-boss');
            if (game.bossSpawned) {
                bossObj.className = 'objective incomplete';
                bossObj.style.display = 'block';
            } else {
                bossObj.style.display = 'none';
            }
        }
        
        async function init() {
            try {
                updateLoading('Creating engine...');
                console.log('🎮 Initializing APPLESAUCE...');
                
                // Create core
                game = new ApplesauceCore({
                    goreEnabled: true,
                    maxSpeed: 50
                });
                
                updateLoading('Loading Havok Physics...');
                await game.init();
                showStatus('Havok physics loaded', 'good');
                
                updateLoading('Initializing gore system...');
                // Load gore system BEFORE level
                const { BabylonGorePhysics } = await import('./babylon-gore-physics.js');
                game.gore = new BabylonGorePhysics(game.scene, {
                    enabled: true,
                    damageThreshold: 5,
                    severThreshold: 10,
                    explodeThreshold: 25,
                    showLogs: true
                });
                showStatus('Gore system initialized', 'good');
                
                updateLoading('Building Paradeli Park...');
                await game.loadLevel(Level23Config);
                showStatus('Level loaded: Paradeli Park', 'good');
                showStatus(`Spawned ${Level23Config.enemies.length} enemies`, 'good');
                
                // Add test ragdoll spawner
                game.scene.onKeyboardObservable.add((kbInfo) => {
                    if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN && 
                        kbInfo.event.key.toLowerCase() === 'r') {
                        const x = (Math.random() - 0.5) * 30;
                        const z = game.playerModule.getPosition().z + 20;
                        game.gore.createRagdoll(new BABYLON.Vector3(x, 15, z));
                        showStatus('Test ragdoll spawned', 'warn');
                    }
                });
                
                // Hide loading, show UI
                document.getElementById('loading').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('controls').style.display = 'block';
                document.getElementById('status').style.display = 'block';
                
                // Start game
                game.start();
                
                // Update HUD loop
                setInterval(updateHUD, 100);
                
                console.log('✅ APPLESAUCE started!');
                showStatus('Game started - Go shred!', 'good');
                
                // Welcome message
                setTimeout(() => {
                    showStatus('Bomb the big hill!', 'warn');
                }, 2000);
                
            } catch (error) {
                console.error('❌ Initialization failed:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #f00;">❌ FAILED TO LOAD</div>
                    <div style="font-size: 14px; margin-top: 20px;">${error.message}</div>
                    <div style="font-size: 12px; margin-top: 10px; max-width: 500px;">
                        Make sure all modules are in the same directory:<br>
                        • level_23_complete.js<br>
                        • applesauce-core-babylon.js<br>
                        • babylon-skater-fixed.js<br>
                        • babylon-terrain.js<br>
                        • babylon-gore-physics.js
                    </div>
                `;
            }
        }
        
        if (typeof HavokPhysics === 'undefined') {
            console.error('Havok not loaded!');
        } else {
            init();
        }
    </script>
</body>
</html>
