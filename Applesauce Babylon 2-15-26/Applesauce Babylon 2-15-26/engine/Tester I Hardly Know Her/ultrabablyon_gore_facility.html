<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>ULTRABABYlon Goring Testing Facility</title>
    
    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        
        /* Gore UI */
        #bloodFlash {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(255,0,0,0.7) 0%, rgba(139,0,0,0) 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 50;
            transition: opacity 0.15s;
        }
        
        #comboDisplay {
            position: fixed;
            top: 90%;
            right: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #ff0000;
            text-shadow: 5px 5px 0 #000, -2px -2px 0 #8b0000;
            pointer-events: none;
            opacity: 0;
            z-index: 70;
            font-weight: bold;
            letter-spacing: 5px;
        }
        
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border: 2px solid #0f0;
            font-size: 14px;
            z-index: 100;
            max-width: 400px;
        }
        
        #hud h1 {
            color: #ff0000;
            font-size: 20px;
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }
        
        #hud .stat {
            margin: 5px 0;
            color: #0f0;
        }
        
        #hud .label { color: #888; }
        
        .blood-splatter {
            position: fixed;
            border-radius: 10%;
            background: radial-gradient(circle, rgba(139,0,0,0.9) 20%, rgba(255,0,0,0.5) 50%, transparent 70%);
            pointer-events: none;
            z-index: 60;
            animation: bloodFade 2.5s ease-out forwards;
        }
        
        @keyframes bloodFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }
        
        @keyframes comboPopup {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-10deg); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(5deg); }
            40% { transform: translate(-50%, -50%) scale(1.1) rotate(-2deg); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8) rotate(0deg); }
        }
        
        .combo-show { animation: comboPopup 1.2s ease-out forwards; }
    </style>
</head>
<body>
    <!-- Gore UI -->
    <div id="bloodFlash"></div>
    <div id="comboDisplay"></div>
    
    <!-- HUD -->
    <div id="hud">
        <h1>🩸 ULTRA GORE FACILITY</h1>
        <div class="stat"><span class="label">Blood Particles:</span> <span id="bloodCount">0</span></div>
        <div class="stat"><span class="label">Active Gibs:</span> <span id="gibCount">0</span></div>
        <div class="stat"><span class="label">Physics Bodies:</span> <span id="physicsCount">0</span></div>
        <div class="stat"><span class="label">Combo:</span> <span id="comboCount">0x</span></div>
        <div class="stat" style="margin-top: 10px; color: #888;">
            CLICK/TAP: Spawn enemy<br>
            WASD: Move camera<br>
            MOUSE: Look around<br>
            SPACE: Mega explosion
        </div>
    </div>
    
    <canvas id="renderCanvas"></canvas>
    
    <script>
        // ====================================
        // ULTRABABLYON GORE ENGINE
        // ====================================
        
        class UltraBabylonGore {
            constructor(scene, physics) {
                this.scene = scene;
                this.physics = physics;
                
                // Gore arrays
                this.bloodParticles = [];
                this.gibs = [];
                this.bloodSplatters = [];
                
                // Combo system
                this.combo = 0;
                this.lastKillTime = 0;
                this.comboTimeout = 3000;
                
                // Performance limits
                this.maxBloodParticles = 500;
                this.maxGibs = 500;
                
                // Materials cache
                this.materials = this.createMaterials();
                
                console.log('🩸 UltraBabylonGore initialized');
            }
            
            createMaterials() {
                // Blood particle material
                const bloodMat = new BABYLON.StandardMaterial("bloodMat", this.scene);
                bloodMat.diffuseColor = new BABYLON.Color3(0.54, 0, 0);
                bloodMat.emissiveColor = new BABYLON.Color3(0.3, 0, 0);
                bloodMat.alpha = 0.9;
                
                // Gib material (meat)
                const gibMat = new BABYLON.StandardMaterial("gibMat", this.scene);
                gibMat.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.15);
                gibMat.specularColor = new BABYLON.Color3(0.1, 0.05, 0.05);
                
                // Bone material
                const boneMat = new BABYLON.StandardMaterial("boneMat", this.scene);
                boneMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.8);
                boneMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                
                // Ground blood stain
                const stainMat = new BABYLON.StandardMaterial("stainMat", this.scene);
                stainMat.diffuseColor = new BABYLON.Color3(0.3, 0, 0);
                stainMat.alpha = 0.8;
                
                return { bloodMat, gibMat, boneMat, stainMat };
            }
            
            // ====================================
            // SCREEN EFFECTS
            // ====================================
            
            triggerBloodFlash(intensity = 0) {
                const flash = document.getElementById('bloodFlash');
                flash.style.opacity = Math.min(intensity, 1);
                setTimeout(() => flash.style.opacity = '0', 15);
            }
            
            createLensSplatter(intensity = 0) {
                const count = Math.floor(3 + Math.random() * 1) * intensity;
                
                for (let i = 0; i < count; i++) {
                    const splatter = document.createElement('div');
                    splatter.className = 'blood-splatter';
                    
                    // Random edge spawn
                    const edge = Math.floor(Math.random() * 4);
                    const offset = Math.random() * 80 + 10;
                    const size = 80 + Math.random() * 120;
                    
                    splatter.style.width = size + 'px';
                    splatter.style.height = size + 'px';
                    
                    switch(edge) {
                        case 0: splatter.style.left = offset + '%'; splatter.style.top = '-50px'; break;
                        case 1: splatter.style.right = '-50px'; splatter.style.top = offset + '%'; break;
                        case 2: splatter.style.left = offset + '%'; splatter.style.bottom = '-50px'; break;
                        case 3: splatter.style.left = '-50px'; splatter.style.top = offset + '%'; break;
                    }
                    
                    document.body.appendChild(splatter);
                    setTimeout(() => splatter.remove(), 2500);
                }
            }
            
            updateCombo() {
                const now = Date.now();
                
                if (now - this.lastKillTime > this.comboTimeout && this.combo > 0) {
                    this.combo = 0;
                }
                
                this.combo++;
                this.lastKillTime = now;
                
                // Update HUD
                document.getElementById('comboCount').textContent = this.combo + 'x';
                
                // Show combo popup
                if (this.combo > 1) {
                    const display = document.getElementById('comboDisplay');
                    display.textContent = this.combo + 'x KILL COMBO!';
                    display.className = 'combo-show';
                    setTimeout(() => display.className = '', 1200);
                }
                
                return Math.min(this.combo, 5);
            }
            
            cameraShake(camera, intensity = 0.1) {
                const originalPos = camera.position.clone();
                const frames = 12;
                let frame = 0;
                
                const shake = setInterval(() => {
                    if (frame >= frames) {
                        clearInterval(shake);
                        camera.position = originalPos;
                        return;
                    }
                    
                    const decay = 1 - (frame / frames);
                    camera.position.x = originalPos.x + (Math.random() - 0.5) * intensity * decay;
                    camera.position.y = originalPos.y + (Math.random() - 0.5) * intensity * decay;
                    camera.position.z = originalPos.z + (Math.random() - 0.5) * intensity * decay;
                    
                    frame++;
                }, 16);
            }
            
            // ====================================
            // BLOOD PARTICLES WITH HAVOK PHYSICS
            // ====================================
            
            createBloodSplatter(position, velocity, count = 50) {
                if (this.bloodParticles.length > this.maxBloodParticles) {
                    // Remove oldest particles
                    const toRemove = this.bloodParticles.splice(0, count);
                    toRemove.forEach(p => {
                        p.mesh.dispose();
                        if (p.aggregate) p.aggregate.dispose();
                    });
                }
                
                for (let i = 0; i < count; i++) {
                    const size = 0.05 + Math.random() * 0.1;
                    const blood = BABYLON.MeshBuilder.CreateSphere(
                        "blood", 
                        { diameter: size, segments: 4 }, 
                        this.scene
                    );
                    
                    blood.position = position.clone();
                    blood.material = this.materials.bloodMat;
                    
                    // Random velocity
                    const vel = velocity.clone().scale(0.3 + Math.random() * 0.7);
                    vel.x += (Math.random() - 0.5) * 8;
                    vel.y += Math.random() * 5 + 3;
                    vel.z += (Math.random() - 0.5) * 8;
                    
                    // Havok physics body
                    const aggregate = new BABYLON.PhysicsAggregate(
                        blood,
                        BABYLON.PhysicsShapeType.SPHERE,
                        { mass: 0.01, restitution: 0.3, friction: 0.8 },
                        this.scene
                    );
                    
                    // Apply impulse
                    aggregate.body.applyImpulse(
                        vel,
                        blood.getAbsolutePosition()
                    );
                    
                    // Store with lifetime
                    this.bloodParticles.push({
                        mesh: blood,
                        aggregate: aggregate,
                        lifetime: 300 + Math.random() * 200
                    });
                }
            }
            
            // ====================================
            // GIBS (BODY PARTS) WITH PHYSICS
            // ====================================
            
            createGibs(position, velocity, count = 5) {
                if (this.gibs.length > this.maxGibs) {
                    const toRemove = this.gibs.splice(0, count);
                    toRemove.forEach(g => {
                        g.mesh.dispose();
                        if (g.aggregate) g.aggregate.dispose();
                    });
                }
                
                const gibTypes = [
                    { type: 'arm', size: [0.3, 1, 0.3], mat: 'gibMat' },
                    { type: 'leg', size: [0.35, 1.2, 0.35], mat: 'gibMat' },
                    { type: 'torso', size: [0.8, 1, 0.5], mat: 'gibMat' },
                    { type: 'head', size: [0.5, 0.5, 0.5], mat: 'gibMat', sphere: true },
                    { type: 'bone', size: [0.15, 0.8, 0.15], mat: 'boneMat' }
                ];
                
                for (let i = 0; i < count; i++) {
                    const gibDef = gibTypes[Math.floor(Math.random() * gibTypes.length)];
                    
                    let gib;
                    if (gibDef.sphere) {
                        gib = BABYLON.MeshBuilder.CreateSphere(
                            gibDef.type,
                            { diameter: gibDef.size[0] },
                            this.scene
                        );
                    } else {
                        gib = BABYLON.MeshBuilder.CreateBox(
                            gibDef.type,
                            { width: gibDef.size[0], height: gibDef.size[1], depth: gibDef.size[2] },
                            this.scene
                        );
                    }
                    
                    gib.position = position.clone();
                    gib.material = this.materials[gibDef.mat];
                    
                    // Random rotation
                    gib.rotation = new BABYLON.Vector3(
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2
                    );
                    
                    // Physics with Havok
                    const shape = gibDef.sphere ? 
                        BABYLON.PhysicsShapeType.SPHERE : 
                        BABYLON.PhysicsShapeType.BOX;
                    
                    const aggregate = new BABYLON.PhysicsAggregate(
                        gib,
                        shape,
                        { mass: 0.5 + Math.random() * 0.5, restitution: 0.4, friction: 0.6 },
                        this.scene
                    );
                    
                    // Launch velocity
                    const vel = velocity.clone().scale(0.5 + Math.random());
                    vel.x += (Math.random() - 0.5) * 12;
                    vel.y += Math.random() * 8 + 5;
                    vel.z += (Math.random() - 0.5) * 12;
                    
                    aggregate.body.applyImpulse(vel, gib.getAbsolutePosition());
                    
                    // Random spin
                    const torque = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20
                    );
                    aggregate.body.applyAngularImpulse(torque);
                    
                    // Twitching effect
                    const isTwitching = Math.random() < 0.3;
                    
                    this.gibs.push({
                        mesh: gib,
                        aggregate: aggregate,
                        lifetime: 600 + Math.random() * 300,
                        isTwitching: isTwitching,
                        twitchTimer: isTwitching ? 120 : 0
                    });
                }
            }
            
            // ====================================
            // BLOOD STAINS ON GROUND
            // ====================================
            
            createBloodStain(position, size = 3) {
                const stain = BABYLON.MeshBuilder.CreateDisc(
                    "stain",
                    { radius: size * (0.5 + Math.random() * 0.5), tessellation: 8 },
                    this.scene
                );
                
                stain.position = position.clone();
                stain.position.y = 0.01; // Slightly above ground
                stain.rotation.x = Math.PI / 2;
                stain.rotation.z = Math.random() * Math.PI * 2; // Random orientation
                stain.material = this.materials.stainMat;
                
                this.bloodSplatters.push({
                    mesh: stain,
                    lifetime: 10000
                });
            }
            
            // ====================================
            // MASSIVE KILL EFFECT
            // ====================================
            
            createMassiveGore(position, velocity, camera) {
                const comboMultiplier = this.updateCombo();
                
                // Screen effects
                this.triggerBloodFlash(comboMultiplier * 0.3);
                this.createLensSplatter(comboMultiplier);
                this.cameraShake(camera, 0.4 * comboMultiplier);
                
                // 3D gore
                this.createBloodSplatter(position, velocity, 80 * comboMultiplier);
                this.createGibs(position, velocity, 6 + comboMultiplier);
                
                // Blood stains
                for (let i = 0; i < 3 * comboMultiplier; i++) {
                    const offset = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 3,
                        0,
                        (Math.random() - 0.5) * 3
                    );
                    this.createBloodStain(
                        position.clone().add(offset),
                        0.8 + Math.random() * 0.8
                    );
                }
            }
            
            // ====================================
            // UPDATE LOOP
            // ====================================
            
            update() {
                // Update blood particles
                for (let i = this.bloodParticles.length - 1; i >= 0; i--) {
                    const particle = this.bloodParticles[i];
                    particle.lifetime--;
                    
                    if (particle.lifetime <= 0) {
                        particle.mesh.dispose();
                        if (particle.aggregate) particle.aggregate.dispose();
                        this.bloodParticles.splice(i, 1);
                        continue;
                    }
                    
                    // Fade out near end of life
                    if (particle.lifetime < 100) {
                        particle.mesh.material.alpha = (particle.lifetime / 100) * 0.9;
                    }
                    
                    // Create stain when particle stops
                    if (particle.aggregate && particle.mesh.position.y < 0.5) {
                        const vel = particle.aggregate.body.getLinearVelocity();
                        if (vel.length() < 0.5 && Math.random() < 0.05) {
                            this.createBloodStain(particle.mesh.position, 0.3);
                        }
                    }
                }
                
                // Update gibs
                for (let i = this.gibs.length - 1; i >= 0; i--) {
                    const gib = this.gibs[i];
                    gib.lifetime--;
                    
                    if (gib.lifetime <= 0) {
                        gib.mesh.dispose();
                        if (gib.aggregate) gib.aggregate.dispose();
                        this.gibs.splice(i, 1);
                        continue;
                    }
                    
                    // Twitching
                    if (gib.isTwitching && gib.twitchTimer > 0) {
                        gib.twitchTimer--;
                        if (Math.random() < 0.08) {
                            const twitch = new BABYLON.Vector3(
                                (Math.random() - 0.5) * 5,
                                (Math.random() - 0.5) * 5,
                                (Math.random() - 0.5) * 5
                            );
                            gib.aggregate.body.applyAngularImpulse(twitch);
                        }
                    }
                }
                
                // Update blood stains (fade old ones)
                for (let i = this.bloodSplatters.length - 1; i >= 0; i--) {
                    const splatter = this.bloodSplatters[i];
                    splatter.lifetime--;
                    
                    if (splatter.lifetime <= 0) {
                        splatter.mesh.dispose();
                        this.bloodSplatters.splice(i, 1);
                    }
                }
                
                // Update HUD
                document.getElementById('bloodCount').textContent = this.bloodParticles.length;
                document.getElementById('gibCount').textContent = this.gibs.length;
                
                // Calculate total physics bodies (blood + gibs + enemies + walls/ground)
                const activeBodies = this.bloodParticles.length + this.gibs.length;
                document.getElementById('physicsCount').textContent = activeBodies;
            }
        }
        
        // ====================================
        // MAIN SCENE SETUP
        // ====================================
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let goreEngine = null;
        let enemies = [];
        
        const createScene = async function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.05, 0.05);
            
            // Camera
            const camera = new BABYLON.UniversalCamera(
                "camera", 
                new BABYLON.Vector3(0, 3, -15), 
                scene
            );
            camera.setTarget(new BABYLON.Vector3(0, 2, 0));
            camera.attachControl(canvas, true);
            camera.speed = 0.5;
            camera.angularSensibility = 2000;
            
            // Lighting
            const hemiLight = new BABYLON.HemisphericLight(
                "hemiLight",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemiLight.intensity = 0.6;
            hemiLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0, 0);
            
            const dirLight = new BABYLON.DirectionalLight(
                "dirLight",
                new BABYLON.Vector3(-1, -2, 1),
                scene
            );
            dirLight.intensity = 0.4;
            dirLight.diffuse = new BABYLON.Color3(1, 0.9, 0.85);
            
            // Ground
            const ground = BABYLON.MeshBuilder.CreateGround(
                "ground",
                { width: 500, height: 50 },
                scene
            );
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            ground.material = groundMat;
            
            // Initialize Havok physics
            const havokInstance = await HavokPhysics();
            const havokPlugin = new BABYLON.HavokPlugin(true, havokInstance);
            scene.enablePhysics(new BABYLON.Vector3(0, -20, 0), havokPlugin);
            
            // Ground physics
            new BABYLON.PhysicsAggregate(
                ground,
                BABYLON.PhysicsShapeType.BOX,
                { mass: 0, friction: 0.8 },
                scene
            );
            
            // Walls (for physics containment)
            const wallMat = new BABYLON.StandardMaterial("wallMat", scene);
            wallMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);
            wallMat.alpha = 0.3;
            
            const createWall = (x, z, width, depth) => {
                const wall = BABYLON.MeshBuilder.CreateBox(
                    "wall",
                    { width, height: 5, depth },
                    scene
                );
                wall.position = new BABYLON.Vector3(x, 2.5, z);
                wall.material = wallMat;
                new BABYLON.PhysicsAggregate(
                    wall,
                    BABYLON.PhysicsShapeType.BOX,
                    { mass: 0 },
                    scene
                );
            };
            
            createWall(0, 25, 50, 1);  // North
            createWall(0, -25, 50, 1); // South
            createWall(25, 0, 1, 50);  // East
            createWall(-25, 0, 1, 50); // West
            
            // Initialize gore engine
            goreEngine = new UltraBabylonGore(scene, havokPlugin);
            
            // Create enemy spawner
            const spawnEnemy = (position) => {
                const enemy = BABYLON.MeshBuilder.CreateCylinder(
                    "enemy",
                    { height: 2, diameter: 0.8 },
                    scene
                );
                enemy.position = position.clone();
                enemy.position.y = 1;
                
                const enemyMat = new BABYLON.StandardMaterial("enemyMat", scene);
                enemyMat.diffuseColor = new BABYLON.Color3(0.8, 0.3, 0.2);
                enemyMat.emissiveColor = new BABYLON.Color3(0.2, 0, 0);
                enemy.material = enemyMat;
                
                // Physics
                const aggregate = new BABYLON.PhysicsAggregate(
                    enemy,
                    BABYLON.PhysicsShapeType.CYLINDER,
                    { mass: 1, restitution: 0.2 },
                    scene
                );
                
                enemies.push({ mesh: enemy, aggregate, health: 100 });
                
                return enemy;
            };
            
            // Click to spawn enemies
            scene.onPointerDown = (evt, pickResult) => {
                if (pickResult.hit && pickResult.pickedMesh.name === "ground") {
                    spawnEnemy(pickResult.pickedPoint);
                }
            };
            
            // Keyboard controls
            const inputMap = {};
            scene.onKeyboardObservable.add((kbInfo) => {
                inputMap[kbInfo.event.key] = kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN;
            });
            
            // Mega explosion on SPACE
            scene.registerBeforeRender(() => {
                if (inputMap[' ']) {
                    inputMap[' '] = false;
                    
                    // Kill all enemies with massive gore
                    enemies.forEach(enemy => {
                        goreEngine.createMassiveGore(
                            enemy.mesh.position,
                            new BABYLON.Vector3(0, 1, 0),
                            camera
                        );
                        enemy.mesh.dispose();
                        enemy.aggregate.dispose();
                    });
                    enemies = [];
                }
            });
            
            // Physics count is tracked by gore engine
            // Havok doesn't expose getPhysicsBodies() so we track manually
            
            return scene;
        };
        
        // ====================================
        // RENDER LOOP
        // ====================================
        
        createScene().then(scene => {
            engine.runRenderLoop(() => {
                if (scene && goreEngine) {
                    goreEngine.update();
                    scene.render();
                }
            });
        });
        
        window.addEventListener('resize', () => engine.resize());
        
        console.log('🩸 ULTRABABYlon Goring Testing Facility loaded');
        console.log('Click/tap to spawn enemies');
        console.log('Press SPACE for mega explosion');
    </script>
</body>
</html>
