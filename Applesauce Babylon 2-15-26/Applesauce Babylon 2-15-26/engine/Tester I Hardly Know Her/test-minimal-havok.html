<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal Havok Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #renderCanvas { width: 100%; height: 100%; display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border: 2px solid #0f0;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="info">
        <div style="font-size: 16px; margin-bottom: 10px;">🧪 MINIMAL HAVOK TEST</div>
        <div>Press W to apply force</div>
        <div>Velocity: <span id="vel">N/A</span></div>
        <div>Position: <span id="pos">N/A</span></div>
    </div>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    
    <script>
        let box, boxAggregate, keys = {};
        
        async function init() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true);
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.5, 0.8, 0.9, 1);
            
            // Camera
            const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 15, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            
            // Light
            new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            
            // Havok
            console.log('Loading Havok...');
            const havok = await HavokPhysics();
            const plugin = new BABYLON.HavokPlugin(true, havok);
            scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), plugin);
            console.log('✅ Havok ready');
            
            // Ground
            const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 50, height: 50 }, scene);
            ground.material = new BABYLON.StandardMaterial("groundMat", scene);
            ground.material.diffuseColor = new BABYLON.Color3(0.3, 0.5, 0.3);
            
            new BABYLON.PhysicsAggregate(ground, BABYLON.PhysicsShapeType.BOX, { mass: 0 }, scene);
            
            // Test box (simple physics body)
            box = BABYLON.MeshBuilder.CreateBox("box", { width: 1, height: 2, depth: 0.5 }, scene);
            box.position = new BABYLON.Vector3(0, 5, 0);
            box.material = new BABYLON.StandardMaterial("boxMat", scene);
            box.material.diffuseColor = new BABYLON.Color3(1, 0, 0);
            
            // Add physics - SIMPLEST POSSIBLE
            boxAggregate = new BABYLON.PhysicsAggregate(
                box,
                BABYLON.PhysicsShapeType.BOX,
                { mass: 70, restitution: 0.1, friction: 0.4 },
                scene
            );
            
            console.log('Box aggregate:', boxAggregate);
            console.log('Physics body:', boxAggregate.body);
            console.log('Motion type:', boxAggregate.body.getMotionType());
            console.log('Mass:', boxAggregate.body.getMassProperties().mass);
            
            // Input
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                console.log('Key down:', e.key);
            });
            
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
            
            // Render loop
            engine.runRenderLoop(() => {
                // Apply force when W is pressed
                if (keys['w']) {
                    console.log('Applying forward force...');
                    const force = new BABYLON.Vector3(0, 0, 100); // Forward in Z
                    boxAggregate.body.applyForce(force, box.getAbsolutePosition());
                }
                
                if (keys[' ']) {
                    console.log('Applying upward impulse...');
                    boxAggregate.body.applyImpulse(new BABYLON.Vector3(0, 300, 0), box.getAbsolutePosition());
                }
                
                // Update HUD
                const vel = boxAggregate.body.getLinearVelocity();
                const pos = box.position;
                document.getElementById('vel').textContent = 
                    `[${vel.x.toFixed(2)}, ${vel.y.toFixed(2)}, ${vel.z.toFixed(2)}] = ${vel.length().toFixed(2)} m/s`;
                document.getElementById('pos').textContent = 
                    `[${pos.x.toFixed(2)}, ${pos.y.toFixed(2)}, ${pos.z.toFixed(2)}]`;
                
                scene.render();
            });
            
            window.addEventListener('resize', () => engine.resize());
            
            console.log('✅ Ready! Press W to apply force, SPACE to jump');
        }
        
        init();
    </script>
</body>
</html>
