<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THREE.js Path Test</title>
    <style>
        body { 
            margin: 0; 
            font-family: monospace;
            background: #000;
            color: #0f0;
        }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 2px solid #0f0;
            font-size: 16px;
            max-width: 600px;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="status">
        <h2>THREE.js Module Path Test</h2>
        <div id="results">Testing...</div>
    </div>

    <script type="module">
        const resultsDiv = document.getElementById('results');
        
        function log(message, isError = false) {
            const className = isError ? 'error' : 'success';
            resultsDiv.innerHTML += `<div class="${className}">${message}</div>`;
        }

        // Test different import paths
        async function testImports() {
            const paths = [
                './three.module.js',           // Same directory as HTML
                './engine/three.module.js',    // In engine folder
                '../three.module.js',          // Parent directory
            ];

            for (const path of paths) {
                try {
                    log(`<br>Testing: ${path}`);
                    const THREE = await import(path);
                    log(`✅ SUCCESS! Found THREE.js at: ${path}`, false);
                    log(`THREE.Scene exists: ${typeof THREE.Scene === 'function'}`, false);
                    
                    // Try to create a scene
                    const scene = new THREE.Scene();
                    log(`✅ Created THREE.Scene successfully!`, false);
                    
                    // Show which path worked
                    log(`<br><strong>🎯 USE THIS PATH: ${path}</strong>`, false);
                    
                    // Stop testing after first success
                    return path;
                } catch (error) {
                    log(`❌ FAILED: ${error.message}`, true);
                }
            }
            
            log('<br>❌ None of the paths worked!', true);
            log('Make sure three.module.js exists in one of these locations:', true);
            paths.forEach(p => log(`  - ${p}`, true));
        }

        testImports();
    </script>
</body>
</html>
