<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Tornado Test Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 100;
            text-shadow: 2px 2px 0 #000;
            font-size: 20px;
            line-height: 1.6;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        
        #tornadoWarning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            color: #FF0000;
            text-shadow: 4px 4px 0 #000;
            display: none;
            animation: pulse 1s infinite;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }
        
        button {
            background: #8B4513;
            color: white;
            border: 3px solid #000;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #A0522D;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>🌪️ TORNADO TEST DEMO</div>
        <div>Position: <span id="playerPos">0, 0</span></div>
        <div>Tornado Distance: <span id="tornadoDist">-</span>m</div>
        <div>Wind Force: <span id="windForce">0</span></div>
        <div>Terrain Deform: <span id="deformCount">0</span></div>
    </div>
    
    <div id="tornadoWarning">⚠️ TORNADO! ⚠️</div>
    
    <div id="controls">
        <strong>CONTROLS:</strong><br>
        WASD - Move around<br>
        Mouse - Look around<br>
        Click to lock mouse<br>
        <br>
        <button onclick="spawnNewTornado()">Spawn Tornado</button>
        <button onclick="spawnMultiple()">Spawn 3 Tornados</button>
        <button onclick="clearTornados()">Clear All</button>
        <button onclick="toggleDeformation()">Toggle Deform: <span id="deformStatus">ON</span></button>
    </div>

    <script src="../three.min.js"></script>
    <script>
        // ======= SCENE SETUP =======
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // ======= LIGHTING =======
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 50, 50);
        scene.add(directionalLight);
        
        // ======= TERRAIN WITH DEFORMATION =======
        class DeformableTerrain {
            constructor() {
                this.chunks = [];
                this.heightMap = new Map();
                this.deformCount = 0;
                this.deformationEnabled = true;
                this.createTerrain();
            }
            
            createTerrain() {
                const chunkSize = 100;
                const segments = 50;
                
                for (let i = 0; i < 3; i++) {
                    const geometry = new THREE.PlaneGeometry(chunkSize, chunkSize, segments, segments);
                    geometry.rotateX(-Math.PI / 2);
                    
                    // Add some initial hills
                    const positions = geometry.attributes.position;
                    for (let j = 0; j < positions.count; j++) {
                        const x = positions.getX(j);
                        const z = positions.getY(j);
                        const height = Math.sin(x * 0.1) * 2 + Math.cos(z * 0.1) * 2;
                        positions.setZ(j, height);
                    }
                    
                    geometry.computeVertexNormals();
                    
                    const material = new THREE.MeshLambertMaterial({
                        color: 0x228B22,
                        wireframe: false
                    });
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.z = i * chunkSize - chunkSize;
                    mesh.receiveShadow = true;
                    
                    this.chunks.push({
                        mesh: mesh,
                        startZ: mesh.position.z - chunkSize / 2,
                        endZ: mesh.position.z + chunkSize / 2
                    });
                    
                    scene.add(mesh);
                }
            }
            
            getHeight(x, z) {
                // Simple height lookup
                return 0;
            }
            
            /**
             * DEFORMABLE TERRAIN - YOUR TRICK!
             */
            deform(x, z, radius = 2, depth = 0.5) {
                if (!this.deformationEnabled) return;
                
                const activeChunk = this.chunks.find(c => z >= c.startZ && z <= c.endZ);
                if (!activeChunk || !activeChunk.mesh) return;
                
                const geometry = activeChunk.mesh.geometry;
                const positions = geometry.attributes.position;
                const localZ = z - (activeChunk.startZ + (activeChunk.endZ - activeChunk.startZ) / 2);
                
                let modified = false;
                
                for (let i = 0; i < positions.count; i++) {
                    const vx = positions.getX(i);
                    const vy = positions.getY(i);
                    
                    const dx = vx - x;
                    const dy = vy - localZ;
                    const distanceSq = dx * dx + dy * dy;
                    
                    if (distanceSq < radius * radius) {
                        const currentHeight = positions.getZ(i);
                        const force = (1 - Math.sqrt(distanceSq) / radius) * depth;
                        positions.setZ(i, currentHeight - force);
                        modified = true;
                    }
                }
                
                if (modified) {
                    positions.needsUpdate = true;
                    geometry.computeVertexNormals();
                    this.deformCount++;
                    
                    const key = `${Math.floor(x)},${Math.floor(z)}`;
                    this.heightMap.set(key, this.getHeight(x, z) - depth);
                }
            }
        }
        
        const terrain = new DeformableTerrain();
        
        // ======= TORNADO SYSTEM (EMBEDDED) =======
        class TornadoSystem {
            constructor(scene, terrain, config = {}) {
                this.scene = scene;
                this.terrain = terrain;
                this.position = new THREE.Vector3(
                    config.startX || 0,
                    0,
                    config.startZ || 0
                );
                this.velocity = new THREE.Vector3(
                    config.velocityX || 0.1,
                    0,
                    config.velocityZ || 0.05
                );
                this.radius = config.radius || 8;
                this.height = config.height || 35;
                this.strength = config.strength || 0.3;
                this.rotationSpeed = config.rotationSpeed || 0.15;
                this.deformRate = config.deformRate || 0.02;
                this.rotation = 0;
                this.isActive = true;
                this.debris = [];
                this.dustParticles = [];
                this.buildVisuals();
            }
            
            buildVisuals() {
                // Funnel
                const funnelGeometry = new THREE.CylinderGeometry(
                    this.radius * 0.3, this.radius, this.height, 16, 20, true
                );
                const funnelMaterial = new THREE.MeshBasicMaterial({
                    color: 0x404040,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide
                });
                this.funnel = new THREE.Mesh(funnelGeometry, funnelMaterial);
                this.funnel.position.copy(this.position);
                this.funnel.position.y = this.height / 2;
                this.scene.add(this.funnel);
                
                // Cloud top
                const cloudGeometry = new THREE.SphereGeometry(this.radius * 1.5, 16, 16);
                const cloudMaterial = new THREE.MeshBasicMaterial({
                    color: 0x2a2a2a,
                    transparent: true,
                    opacity: 0.8
                });
                this.cloudTop = new THREE.Mesh(cloudGeometry, cloudMaterial);
                this.cloudTop.position.copy(this.position);
                this.cloudTop.position.y = this.height + 3;
                this.cloudTop.scale.y = 0.4;
                this.scene.add(this.cloudTop);
                
                // Debris
                for (let i = 0; i < 30; i++) {
                    const size = Math.random() * 0.4 + 0.2;
                    const debris = new THREE.Mesh(
                        new THREE.BoxGeometry(size, size, size),
                        new THREE.MeshBasicMaterial({ color: 0x8B4513 })
                    );
                    debris.userData = {
                        angle: (i / 30) * Math.PI * 2,
                        heightRatio: Math.random(),
                        orbitRadius: this.radius * (1 - Math.random() * 0.5),
                        orbitSpeed: 0.05 + Math.random() * 0.05,
                        bobSpeed: Math.random() * 0.03,
                        bobPhase: Math.random() * Math.PI * 2
                    };
                    this.debris.push(debris);
                    this.scene.add(debris);
                }
                
                // Dust particles
                for (let i = 0; i < 50; i++) {
                    const dust = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1, 4, 4),
                        new THREE.MeshBasicMaterial({
                            color: 0xD2B48C,
                            transparent: true,
                            opacity: 0.5
                        })
                    );
                    dust.userData = {
                        angle: Math.random() * Math.PI * 2,
                        radius: Math.random() * this.radius,
                        speed: 0.1 + Math.random() * 0.1,
                        height: Math.random() * 3,
                        bobPhase: Math.random() * Math.PI * 2
                    };
                    this.dustParticles.push(dust);
                    this.scene.add(dust);
                }
            }
            
            update(playerPosition) {
                if (!this.isActive) return false;
                
                this.position.add(this.velocity);
                this.funnel.position.copy(this.position);
                this.funnel.position.y = this.height / 2;
                this.cloudTop.position.copy(this.position);
                this.cloudTop.position.y = this.height + 3;
                
                this.rotation += this.rotationSpeed;
                this.funnel.rotation.y = this.rotation;
                this.cloudTop.rotation.y = this.rotation * 0.5;
                
                // Deform terrain!
                if (this.terrain && this.terrain.deform) {
                    this.terrain.deform(
                        this.position.x,
                        this.position.z,
                        this.radius * 0.6,
                        this.deformRate
                    );
                }
                
                // Update debris
                this.debris.forEach(debris => {
                    const data = debris.userData;
                    data.angle += data.orbitSpeed;
                    data.heightRatio = (data.heightRatio + 0.003) % 1;
                    
                    const currentRadius = data.orbitRadius * (1 - data.heightRatio * 0.5);
                    debris.position.set(
                        this.position.x + Math.cos(data.angle) * currentRadius,
                        this.position.y + data.heightRatio * this.height + Math.sin(data.bobPhase) * 0.5,
                        this.position.z + Math.sin(data.angle) * currentRadius
                    );
                    debris.rotation.x += 0.05;
                    debris.rotation.y += 0.03;
                    data.bobPhase += data.bobSpeed;
                });
                
                // Update dust
                this.dustParticles.forEach(dust => {
                    const data = dust.userData;
                    data.angle += data.speed;
                    dust.position.set(
                        this.position.x + Math.cos(data.angle) * data.radius,
                        this.position.y + data.height + Math.sin(data.bobPhase) * 0.3,
                        this.position.z + Math.sin(data.angle) * data.radius
                    );
                    data.bobPhase += 0.05;
                });
                
                return true;
            }
            
            applyPhysicsToObject(objectPosition) {
                const dx = this.position.x - objectPosition.x;
                const dz = this.position.z - objectPosition.z;
                const distanceXZ = Math.sqrt(dx * dx + dz * dz);
                
                if (distanceXZ < this.radius * 1.5) {
                    const force = (1 - distanceXZ / (this.radius * 1.5)) * this.strength;
                    return {
                        pullX: (dx / distanceXZ) * force,
                        pullZ: (dz / distanceXZ) * force,
                        lift: force * 0.5,
                        spin: this.rotationSpeed * force,
                        distance: distanceXZ
                    };
                }
                return null;
            }
            
            destroy() {
                this.isActive = false;
                [this.funnel, this.cloudTop, ...this.debris, ...this.dustParticles].forEach(obj => {
                    this.scene.remove(obj);
                    obj.geometry.dispose();
                    obj.material.dispose();
                });
            }
        }
        
        // ======= PLAYER =======
        const playerGeometry = new THREE.BoxGeometry(1, 2, 1);
        const playerMaterial = new THREE.MeshLambertMaterial({ color: 0xFF1493 });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.position.set(0, 1, 0);
        scene.add(player);
        
        camera.position.set(0, 5, 15);
        camera.lookAt(player.position);
        
        // ======= CONTROLS =======
        const keys = {};
        let mouseX = 0, mouseY = 0;
        let rotation = 0;
        
        document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
        
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                mouseX += e.movementX * 0.002;
                mouseY += e.movementY * 0.002;
                mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
            }
        });
        
        // ======= TORNADO MANAGEMENT =======
        let tornados = [];
        
        function spawnNewTornado() {
            const tornado = new TornadoSystem(scene, terrain, {
                startX: (Math.random() - 0.5) * 100,
                startZ: (Math.random() - 0.5) * 100,
                velocityX: (Math.random() - 0.5) * 0.3,
                velocityZ: (Math.random() - 0.5) * 0.3,
                radius: 6 + Math.random() * 6,
                strength: 0.3 + Math.random() * 0.3
            });
            tornados.push(tornado);
            console.log(`🌪️ Tornado spawned! Total: ${tornados.length}`);
        }
        
        function spawnMultiple() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => spawnNewTornado(), i * 500);
            }
        }
        
        function clearTornados() {
            tornados.forEach(t => t.destroy());
            tornados = [];
            console.log('All tornados cleared');
        }
        
        function toggleDeformation() {
            terrain.deformationEnabled = !terrain.deformationEnabled;
            document.getElementById('deformStatus').textContent = terrain.deformationEnabled ? 'ON' : 'OFF';
        }
        
        // Spawn initial tornado
        setTimeout(() => spawnNewTornado(), 2000);
        
        // ======= UPDATE LOOP =======
        function update() {
            // Movement
            const speed = 0.3;
            const moveX = Math.sin(mouseX);
            const moveZ = Math.cos(mouseX);
            
            if (keys['w']) {
                player.position.x += moveX * speed;
                player.position.z += moveZ * speed;
            }
            if (keys['s']) {
                player.position.x -= moveX * speed;
                player.position.z -= moveZ * speed;
            }
            if (keys['a']) {
                player.position.x -= moveZ * speed;
                player.position.z += moveX * speed;
            }
            if (keys['d']) {
                player.position.x += moveZ * speed;
                player.position.z -= moveX * speed;
            }
            
            // Update tornados
            let closestDist = Infinity;
            let totalForce = { pullX: 0, pullZ: 0, lift: 0, spin: 0 };
            
            tornados.forEach(tornado => {
                tornado.update(player.position);
                const force = tornado.applyPhysicsToObject(player.position);
                
                if (force) {
                    totalForce.pullX += force.pullX;
                    totalForce.pullZ += force.pullZ;
                    totalForce.lift += force.lift;
                    totalForce.spin += force.spin;
                    closestDist = Math.min(closestDist, force.distance);
                }
            });
            
            // Apply tornado physics
            player.position.x += totalForce.pullX;
            player.position.z += totalForce.pullZ;
            player.position.y += totalForce.lift * 0.2;
            player.rotation.y += totalForce.spin;
            
            // Gravity
            player.position.y = Math.max(1, player.position.y - 0.1);
            
            // Camera
            const camDist = 15;
            camera.position.x = player.position.x - Math.sin(mouseX) * camDist;
            camera.position.y = player.position.y + 5 + Math.sin(mouseY) * 5;
            camera.position.z = player.position.z - Math.cos(mouseX) * camDist;
            camera.lookAt(player.position);
            
            // Warning
            const warning = document.getElementById('tornadoWarning');
            warning.style.display = closestDist < 20 ? 'block' : 'none';
            
            // HUD
            document.getElementById('playerPos').textContent = 
                `${player.position.x.toFixed(1)}, ${player.position.z.toFixed(1)}`;
            document.getElementById('tornadoDist').textContent = 
                closestDist === Infinity ? '-' : closestDist.toFixed(1);
            document.getElementById('windForce').textContent = 
                Math.sqrt(totalForce.pullX**2 + totalForce.pullZ**2).toFixed(3);
            document.getElementById('deformCount').textContent = terrain.deformCount;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
        
        console.log('🌪️ Tornado Demo Ready!');
        console.log('Use the buttons or spawn tornados to test terrain deformation');
    </script>
</body>
</html>
