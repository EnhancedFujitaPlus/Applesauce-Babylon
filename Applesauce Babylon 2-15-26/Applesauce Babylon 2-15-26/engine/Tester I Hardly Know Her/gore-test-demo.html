<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gore System Test</title>
    <style>
        body {
            margin: 0;
            font-family: monospace;
            background: #000;
            color: #fff;
        }
        
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            z-index: 1000;
            border: 2px solid #00ff00;
        }
        
        #info h2 {
            color: #ff1493;
            margin-top: 0;
        }
        
        #info button {
            background: #ff1493;
            border: none;
            color: #fff;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
        }
        
        #info button:hover {
            background: #ff69b4;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🩸 GORE SYSTEM TEST</h2>
        <p>Click buttons to trigger gore effects!</p>
        <button id="splatter">Blood Splatter</button>
        <button id="pool">Blood Pool</button>
        <button id="gibs">Body Parts</button>
        <button id="massive">MASSIVE SPLATTER</button>
        <button id="clear">Clear All Gore</button>
        <p id="stats">Blood particles: 0 | Gibs: 0</p>
    </div>

    <script type="module">
        import { ApplesauceCore } from '../applesauce-core-33.js';

        
        console.log('🎮 Initializing gore test...');
        
        // Create game with gore enabled
        const game = new ApplesauceCore({
            goreEnabled: true
        });
        
        // Create simple terrain for testing
        game.createTerrain({ size: 200, hill: false });
        
        // Create a test player (just a cube)
        const playerGeo = new THREE.BoxGeometry(1, 2, 1);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1, 0);
        game.scene.add(player);
        game.player = player;
        
        // Position camera
        game.camera.position.set(0, 5, 10);
        game.camera.lookAt(0, 0, 0);
        
        // Update stats display
        function updateStats() {
            if (game.modules.gore) {
                const bloodCount = game.modules.gore.blood.length;
                const gibCount = game.modules.gore.gibs.length;
                document.getElementById('stats').textContent = 
                    `Blood particles: ${bloodCount} | Gibs: ${gibCount}`;
            }
        }
        
        // Button handlers
        document.getElementById('splatter').addEventListener('click', () => {
            if (game.modules.gore) {
                const pos = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    2,
                    (Math.random() - 0.5) * 10
                );
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    0.3,
                    (Math.random() - 0.5) * 0.5
                );
                game.modules.gore.createBloodSplatter(pos, vel, 30);
                console.log('💥 Blood splatter created!');
            }
        });
        
        document.getElementById('pool').addEventListener('click', () => {
            if (game.modules.gore) {
                const pos = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    0.5,
                    (Math.random() - 0.5) * 10
                );
                game.modules.gore.createBloodPool(pos, 2);
                console.log('🩸 Blood pool created!');
            }
        });
        
        document.getElementById('gibs').addEventListener('click', () => {
            if (game.modules.gore) {
                const pos = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    3,
                    (Math.random() - 0.5) * 10
                );
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    0.4,
                    (Math.random() - 0.5) * 0.5
                );
                game.modules.gore.createGibs(pos, vel, 5);
                console.log('🦴 Body parts flying!');
            }
        });
        
        document.getElementById('massive').addEventListener('click', () => {
            if (game.modules.gore) {
                const pos = new THREE.Vector3(0, 2, 0);
                const vel = new THREE.Vector3(0.2, 0.3, 0.2);
                game.modules.gore.createMassiveSplatter(pos, vel);
                console.log('💀 MASSIVE SPLATTER!!!');
            }
        });
        
        document.getElementById('clear').addEventListener('click', () => {
            if (game.modules.gore) {
                game.modules.gore.clear();
                console.log('🧹 Gore cleared');
            }
        });
        
        // Start game loop
        game.start();
        
        // Update stats every frame
        function animate() {
            updateStats();
            requestAnimationFrame(animate);
        }
        animate();
        
        console.log('✅ Gore test ready! Click buttons to test effects.');
    </script>
</body>
</html>
