<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Skybox & Texture Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        
        canvas {
            display: block;
        }
        
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            z-index: 1000;
            font-size: 14px;
            line-height: 1.6;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 0 5px #000;
            z-index: 1000;
            font-size: 11px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 5px;
        }
        
        button {
            background: #0f0;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            color: #000;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }
        
        button:hover {
            background: #0ff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>🛹 SKYBOX & TEXTURE DEMO</div>
        <div>Press buttons to change skybox!</div>
        <div style="margin-top: 10px;">
            <button onclick="changeSky('day')">☀️ Day</button>
            <button onclick="changeSky('sunset')">🌅 Sunset</button>
            <button onclick="changeSky('night')">🌙 Night</button>
        </div>
        <div style="margin-top: 5px;">
            <button onclick="changeSky('cyberpunk')">🌃 Cyberpunk</button>
            <button onclick="changeSky('horror')">💀 Horror</button>
            <button onclick="changeSky('toxic')">☢️ Toxic</button>
        </div>
        <div style="margin-top: 10px;">
            <button onclick="toggleStars()">⭐ Toggle Stars</button>
            <button onclick="toggleRotation()">🔄 Rotation: <span id="rotStatus">ON</span></button>
        </div>
        <div style="margin-top: 10px; font-size: 10px; color: #888;">
            Current: <span id="currentSky">Day</span>
        </div>
    </div>
    
    <div id="controls">
        <strong>CONTROLS:</strong><br>
        Click + Drag - Rotate Camera<br>
        Scroll - Zoom In/Out<br>
        Use buttons above to change skybox!
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Global scene setup
        let scene, camera, renderer, controls;
        let currentSkybox = null;
        let stars = null;
        let rotationEnabled = true;
        
        // Procedural texture generator
        class ProceduralTextures {
            static createGridTexture(gridSize = 16, color1 = '#ffffff', color2 = '#333333') {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                for (let y = 0; y < 512; y += gridSize) {
                    for (let x = 0; x < 512; x += gridSize) {
                        ctx.fillStyle = ((x / gridSize + y / gridSize) % 2 === 0) ? color1 : color2;
                        ctx.fillRect(x, y, gridSize, gridSize);
                    }
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(10, 10);
                
                return texture;
            }
            
            static createNoiseTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const imageData = ctx.createImageData(256, 256);
                
                for (let i = 0; i < imageData.data.length; i += 4) {
                    const value = Math.random() * 255;
                    imageData.data[i] = value;
                    imageData.data[i + 1] = value;
                    imageData.data[i + 2] = value;
                    imageData.data[i + 3] = 255;
                }
                
                ctx.putImageData(imageData, 0, 0);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                
                return texture;
            }
            
            static createGraffitiTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#222222';
                ctx.fillRect(0, 0, 512, 512);
                
                const colors = ['#FF1493', '#00FF00', '#FFD700', '#00FFFF', '#FF00FF'];
                
                for (let i = 0; i < 30; i++) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.globalAlpha = Math.random() * 0.4 + 0.3;
                    
                    const x = Math.random() * 512;
                    const y = Math.random() * 512;
                    const radius = Math.random() * 40 + 10;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }
        }
        
        // Skybox presets
        const skyboxPresets = {
            day: { topColor: 0x87CEEB, bottomColor: 0xFFFFFF },
            sunset: { topColor: 0x1a0033, bottomColor: 0xff6b35 },
            night: { topColor: 0x000011, bottomColor: 0x1a1a2e },
            cyberpunk: { topColor: 0x0a0015, bottomColor: 0xff00ff },
            horror: { topColor: 0x1a0000, bottomColor: 0x000000 },
            toxic: { topColor: 0x001a00, bottomColor: 0x00ff00 }
        };
        
        // Create procedural skybox
        function createSkybox(preset = 'day') {
            const colors = skyboxPresets[preset] || skyboxPresets.day;
            
            const vertexShader = `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
            
            const fragmentShader = `
                uniform vec3 topColor;
                uniform vec3 bottomColor;
                varying vec3 vWorldPosition;
                
                void main() {
                    float h = normalize(vWorldPosition).y;
                    gl_FragColor = vec4(mix(bottomColor, topColor, max(h, 0.0)), 1.0);
                }
            `;
            
            const uniforms = {
                topColor: { value: new THREE.Color(colors.topColor) },
                bottomColor: { value: new THREE.Color(colors.bottomColor) }
            };
            
            const skyGeo = new THREE.SphereGeometry(500, 32, 15);
            const skyMat = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: uniforms,
                side: THREE.BackSide
            });
            
            return new THREE.Mesh(skyGeo, skyMat);
        }
        
        // Create starfield
        function createStarfield(count = 10000) {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            
            for (let i = 0; i < count; i++) {
                const x = THREE.MathUtils.randFloatSpread(1000);
                const y = THREE.MathUtils.randFloatSpread(1000);
                const z = THREE.MathUtils.randFloatSpread(1000);
                vertices.push(x, y, z);
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xFFFFFF,
                size: 2,
                transparent: true,
                opacity: 0.8
            });
            
            return new THREE.Points(geometry, material);
        }
        
        // Initialize scene
        function init() {
            // Scene
            scene = new THREE.Scene();
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);
            
            // Create initial skybox
            currentSkybox = createSkybox('day');
            scene.add(currentSkybox);
            
            // Create demo geometry with procedural textures
            
            // Floor with grid texture
            const floorGeo = new THREE.BoxGeometry(50, 1, 50);
            const floorMat = new THREE.MeshStandardMaterial({
                map: ProceduralTextures.createGridTexture(32, '#444444', '#666666'),
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.5;
            scene.add(floor);
            
            // Ramp with noise texture
            const rampGeo = new THREE.BoxGeometry(10, 0.5, 8);
            const rampMat = new THREE.MeshStandardMaterial({
                map: ProceduralTextures.createNoiseTexture(),
                roughness: 0.9,
                metalness: 0.0,
                color: 0x8B4513
            });
            const ramp = new THREE.Mesh(rampGeo, rampMat);
            ramp.position.set(10, 2, 0);
            ramp.rotation.z = Math.PI * 0.15;
            scene.add(ramp);
            
            // Wall with graffiti texture
            const wallGeo = new THREE.BoxGeometry(200, 100, 10);
            const wallMat = new THREE.MeshStandardMaterial({
                map: ProceduralTextures.createGraffitiTexture(),
                roughness: 0.9
            });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 5, -20);
            scene.add(wall);
            
            // Metal platform (no texture, just shiny material)
            const metalGeo = new THREE.BoxGeometry(8, 2, 8);
            const metalMat = new THREE.MeshStandardMaterial({
                color: 0x888888,
                roughness: 0.2,
                metalness: 0.9
            });
            const metal = new THREE.Mesh(metalGeo, metalMat);
            metal.position.set(-10, 1, 10);
            scene.add(metal);
            
            console.log('✅ Demo initialized!');
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate skybox if enabled
            if (currentSkybox && rotationEnabled) {
                currentSkybox.rotation.y += 0.0005;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Change skybox function (exposed to window)
        window.changeSky = function(preset) {
            if (currentSkybox) {
                scene.remove(currentSkybox);
            }
            
            currentSkybox = createSkybox(preset);
            scene.add(currentSkybox);
            
            document.getElementById('currentSky').textContent = 
                preset.charAt(0).toUpperCase() + preset.slice(1);
            
            console.log(`🌌 Skybox changed to: ${preset}`);
        };
        
        // Toggle stars
        window.toggleStars = function() {
            if (stars) {
                scene.remove(stars);
                stars = null;
                console.log('⭐ Stars removed');
            } else {
                stars = createStarfield(1000);
                scene.add(stars);
                console.log('⭐ Stars added');
            }
        };
        
        // Toggle rotation
        window.toggleRotation = function() {
            rotationEnabled = !rotationEnabled;
            document.getElementById('rotStatus').textContent = rotationEnabled ? 'ON' : 'OFF';
            console.log(`🔄 Rotation: ${rotationEnabled ? 'ON' : 'OFF'}`);
        };
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start!
        init();
        animate();
        
        // Console welcome
        console.log(`
╔═══════════════════════════════════════╗
║   🛹 SKYBOX & TEXTURE DEMO            ║
║   Made for South of South Records    ║
║                                       ║
║   All graphics procedural!           ║
║   No downloads needed! 🎨            ║
╚═══════════════════════════════════════╝
        `);
    </script>
</body>
</html>
