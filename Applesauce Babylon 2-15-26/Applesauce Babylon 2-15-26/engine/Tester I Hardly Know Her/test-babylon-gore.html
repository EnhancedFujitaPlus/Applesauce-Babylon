<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Babylon.js + Havok + Gore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 24px;
            text-align: center;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 3px solid #0f0;
        }
        
        .loading-spinner {
            border: 4px solid #0f0;
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 2px solid #0f0;
            font-size: 14px;
            z-index: 1000;
            min-width: 250px;
        }
        
        .hud-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        
        .hud-section {
            margin: 10px 0;
            padding: 10px 0;
            border-top: 1px solid #0f0;
        }
        
        .hud-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .hud-value {
            color: #ff0;
            font-weight: bold;
            font-size: 16px;
        }
        
        .gore-value {
            color: #f00;
            font-weight: bold;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 2px solid #0f0;
            font-size: 12px;
            z-index: 1000;
        }
        
        .control-line {
            margin: 5px 0;
        }
        
        .key {
            display: inline-block;
            background: #0f0;
            color: #000;
            padding: 2px 8px;
            margin-right: 5px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        #console-log {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 400px;
            max-height: 200px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            padding: 10px;
            font-size: 11px;
            color: #0f0;
            overflow-y: auto;
            z-index: 1000;
        }
        
        .log-impact { color: #ff0; }
        .log-sever { color: #f00; font-weight: bold; }
        .log-death { color: #f0f; font-weight: bold; }
        .log-spawn { color: #0ff; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="loading">
        <div>🩸 LOADING APPLESAUCE 🩸</div>
        <div class="loading-spinner"></div>
        <div id="loading-text" style="font-size: 14px; margin-top: 20px;">Initializing Babylon.js...</div>
    </div>
    
    <div id="hud" style="display: none;">
        <div class="hud-title">🛹 APPLESAUCE + GORE</div>
        
        <div class="hud-section">
            <div class="hud-label">Speed</div>
            <div class="hud-value"><span id="speed">0.0</span> m/s</div>
        </div>
        
        <div class="hud-section">
            <div class="hud-label">Gore Stats</div>
            <div>Active: <span class="gore-value" id="active">0</span></div>
            <div>Impacts: <span class="gore-value" id="impacts">0</span></div>
            <div>Dismemberments: <span class="gore-value" id="dismembers">0</span></div>
            <div>Deaths: <span class="gore-value" id="deaths">0</span></div>
        </div>
    </div>
    
    <div id="controls" style="display: none;">
        <div class="control-line"><span class="key">WASD</span> Move</div>
        <div class="control-line"><span class="key">SPACE</span> Jump</div>
        <div class="control-line"><span class="key">E</span> Kickflip</div>
        <div class="control-line"><span class="key">R</span> Spawn Ragdoll</div>
    </div>
    
    <div id="console-log"></div>
    
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    
    <!-- Havok Physics -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    
    <script type="module">
        import { ApplesauceCore } from '../applesauce-core-babylon.js';
        import { BabylonSkater } from '../skater/babylon-skater.js';
        import { BabylonTerrain } from '../terrain/babylon-terrain.js';
        import { BabylonGorePhysics } from '../gore/babylon-gore-physics.js';
        
        // Console logger
        const consoleLog = document.getElementById('console-log');
        const originalLog = console.log;
        
        console.log = function(...args) {
            const msg = args.join(' ');
            
            // Determine log type
            let className = '';
            if (msg.includes('💥')) className = 'log-impact';
            else if (msg.includes('🔪') || msg.includes('SEVERED')) className = 'log-sever';
            else if (msg.includes('☠️') || msg.includes('DEAD')) className = 'log-death';
            else if (msg.includes('🎯') || msg.includes('Spawned') || msg.includes('Created ragdoll')) className = 'log-spawn';
            
            // Add to console
            const line = document.createElement('div');
            line.className = className;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleLog.appendChild(line);
            consoleLog.scrollTop = consoleLog.scrollHeight;
            
            // Keep only last 50 lines
            while (consoleLog.children.length > 50) {
                consoleLog.removeChild(consoleLog.firstChild);
            }
            
            originalLog.apply(console, args);
        };
        
        // Update loading text
        function updateLoading(text) {
            document.getElementById('loading-text').textContent = text;
        }
        
        // Test level configuration
        const testLevel = {
            meta: {
                name: "Gore Test Arena",
                version: "1.0"
            },
            
            terrain: {
                type: 'flat',
                size: 200,
                color: { r: 0.34, g: 0.49, b: 0.27 }
            },
            
            playerStart: {
                x: 0,
                y: 3,
                z: 0
            },
            
            onLevelStart: async (game) => {
                console.log('🎮 Level started!');
                
                // Add some obstacles
                createTestObstacles(game);
                
                // Add gore system
                game.gore = new BabylonGorePhysics(game.scene, {
                    enabled: true,
                    damageThreshold: 8,
                    severThreshold: 15,
                    explodeThreshold: 300,
                    showLogs: true
                });
                
                console.log('✅ Gore physics loaded');
                
                // Auto-spawn some ragdolls for testing
                setTimeout(() => {
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            const x = (Math.random() - 0.5) * 30;
                            const z = (Math.random() - 0.5) * 30;
                            game.gore.createRagdoll(new BABYLON.Vector3(x, 10 + i * 3, z));
                        }, i * 800);
                    }
                }, 2000);
                
                // Listen for 'R' key to spawn ragdolls
                game.scene.onKeyboardObservable.add((kbInfo) => {
                    if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN && 
                        kbInfo.event.key.toLowerCase() === 'r') {
                        const x = (Math.random() - 0.5) * 30;
                        const z = (Math.random() - 0.5) * 30;
                        game.gore.createRagdoll(new BABYLON.Vector3(x, 15, z));
                    }
                });
            },
            
            onUpdate: (game) => {
                // Update HUD
                if (game.gore) {
                    const stats = game.gore.getStats();
                    document.getElementById('active').textContent = stats.activeRagdolls;
                    document.getElementById('impacts').textContent = stats.totalImpacts;
                    document.getElementById('dismembers').textContent = stats.totalDismemberments;
                    document.getElementById('deaths').textContent = stats.totalDeaths;
                }
                
                if (game.playerModule) {
                    const speed = game.playerModule.getSpeed();
                    document.getElementById('speed').textContent = speed.toFixed(1);
                }
            }
        };
        
        function createTestObstacles(game) {
            // Create some ramps and obstacles
            const obstacles = [
                { 
                    type: 'box',
                    pos: { x: 15, y: 0.5, z: 0 },
                    size: { w: 5, h: 1, d: 5 },
                    color: { r: 0.5, g: 0.5, b: 0.5 }
                },
                { 
                    type: 'box',
                    pos: { x: -15, y: 0.5, z: 0 },
                    size: { w: 5, h: 1, d: 5 },
                    color: { r: 0.5, g: 0.5, b: 0.5 }
                }
            ];
            
            obstacles.forEach(obs => {
                const box = BABYLON.MeshBuilder.CreateBox(
                    "obstacle",
                    { width: obs.size.w, height: obs.size.h, depth: obs.size.d },
                    game.scene
                );
                
                box.position = new BABYLON.Vector3(obs.pos.x, obs.pos.y, obs.pos.z);
                
                const mat = new BABYLON.StandardMaterial("obsMat", game.scene);
                mat.diffuseColor = new BABYLON.Color3(obs.color.r, obs.color.g, obs.color.b);
                box.material = mat;
                box.receiveShadow = true;
                box.castShadow = true;
                
                // Physics
                new BABYLON.PhysicsAggregate(
                    box,
                    BABYLON.PhysicsShapeType.BOX,
                    { mass: 0, friction: 0.4 },
                    game.scene
                );
            });
            
            console.log('✅ Test obstacles created');
        }
        
        // Main initialization
        async function init() {
            try {
                updateLoading('Loading Babylon.js...');
                console.log('🎮 Initializing APPLESAUCE...');
                
                // Create APPLESAUCE Core
                const game = new ApplesauceCore({
                    goreEnabled: true,
                    maxSpeed: 50
                });
                
                updateLoading('Loading Havok Physics...');
                await game.init();
                
                updateLoading('Loading level...');
                await game.loadLevel(testLevel);
                
                // Hide loading, show HUD
                document.getElementById('loading').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('controls').style.display = 'block';
                
                // Start game
                game.start();
                
                console.log('✅ APPLESAUCE started!');
                console.log('🎮 Controls:');
                console.log('   WASD - Move');
                console.log('   SPACE - Jump');
                console.log('   E - Kickflip');
                console.log('   R - Spawn Ragdoll');
                
            } catch (error) {
                console.error('❌ Initialization failed:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #f00;">❌ FAILED TO LOAD</div>
                    <div style="font-size: 14px; margin-top: 20px;">${error.message}</div>
                    <div style="font-size: 12px; margin-top: 10px; max-width: 500px;">
                        Make sure all modules are in the same directory:<br>
                        • applesauce-core-babylon.js<br>
                        • babylon-skater.js<br>
                        • babylon-terrain.js<br>
                        • babylon-gore-physics.js
                    </div>
                `;
            }
        }
        
        // Wait for Havok to be available
        if (typeof HavokPhysics === 'undefined') {
            console.error('Havok not loaded!');
        } else {
            init();
        }
    </script>
</body>
</html>
