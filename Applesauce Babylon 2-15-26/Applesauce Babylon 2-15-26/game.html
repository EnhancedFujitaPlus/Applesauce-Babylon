<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE: In-Game (Babylon.js Edition)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            outline: none;
        }
        
        /* Basic HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 100;
            text-shadow: 3px 3px 0 #000;
        }
        
        #score {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        #combo {
            font-size: 32px;
            color: #FF1493;
            margin-bottom: 10px;
        }
        
        #speed {
            font-size: 24px;
            color: #00FFFF;
        }
        
        #kills {
            font-size: 20px;
            color: #FF0000;
            margin-top: 5px;
        }
        
        /* Objectives panel */
        #objectives {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            min-width: 250px;
            z-index: 100;
        }
        
        #objectives h3 {
            font-size: 18px;
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        .objective {
            margin-bottom: 8px;
            color: #fff;
        }
        
        .objective.complete {
            color: #00FF00;
            text-decoration: line-through;
        }
        
        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 48px;
            z-index: 1000;
        }
        
        #loading-text {
            margin-bottom: 20px;
        }
        
        #loading-details {
            font-size: 18px;
            color: #FFD700;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading">
        <div id="loading-text">LOADING LEVEL...</div>
        <div id="loading-details">Initializing Babylon.js...</div>
    </div>
    
    <!-- Render canvas for Babylon.js -->
    <canvas id="renderCanvas"></canvas>
    
    <!-- Basic HUD (always present) -->
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="combo">COMBO: 0x</div>
        <div id="speed">SPEED: 0</div>
        <div id="kills">KILLS: 0</div>
    </div>
    
    <!-- Objectives panel -->
    <div id="objectives">
        <h3>OBJECTIVES:</h3>
        <div id="objectivesList">
            <!-- Objectives added dynamically -->
        </div>
    </div>

    <!-- ============================================ -->
    <!-- LOAD BABYLON.JS + HAVOK (CDN)               -->
    <!-- ============================================ -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>

    <!-- ============================================ -->
    <!-- PARSE URL TO GET LEVEL ID                   -->
    <!-- ============================================ -->
    <script>
        // Get level ID from URL: game.html?id=24
        const urlParams = new URLSearchParams(window.location.search);
        const levelId = urlParams.get('id');
        const levelName = urlParams.get('name') || 'Unknown Level';
        
        console.log('🎮 Level ID from URL:', levelId);
        console.log('🎮 Level Name from URL:', levelName);
        
        if (!levelId) {
            document.getElementById('loading-text').textContent = 'ERROR: No level ID!';
            document.getElementById('loading-details').textContent = 'Add ?id=XX to URL';
        }
        
        // Store for use in scripts
        window.LEVEL_ID = levelId;
        window.LEVEL_NAME = levelName;
    </script>
    
    <!-- ============================================ -->
    <!-- HELMET COMBAT SYSTEM MODULES                -->
    <!-- Load as regular scripts (non-module)        -->
    <!-- ============================================ -->
    <script>
        // These will be loaded as inline scripts below
        // to avoid module/import issues with your current setup
        console.log('🪖 Loading helmet combat system...');
    </script>
    
    <!-- ============================================ -->
    <!-- BABYLON HELMET SYSTEM (Inline)              -->
    <!-- ============================================ -->
    <script>
        /**
         * BabylonHelmetSystem - Manages helmets as weapons
         */
        class BabylonHelmetSystem {
            constructor(scene, player) {
                this.scene = scene;
                this.player = player;
                
                this.helmetLibrary = new Map();
                this.equippedHelmets = new Array(9).fill(null);
                this.currentSlot = 0;
                
                this.isAttacking = false;
                this.attackCooldown = 0;
                this.comboCount = 0;
                this.comboTimer = 0;
                
                this.currentHelmetMesh = null;
                this.effectsManager = null;
                
                console.log('🪖 Helmet System initialized');
            }
            
            registerHelmet(helmetData) {
                const helmet = {
                    id: helmetData.id,
                    name: helmetData.name,
                    description: helmetData.description || '',
                    damage: helmetData.damage || 25,
                    range: helmetData.range || 3,
                    knockback: helmetData.knockback || 2,
                    cooldown: helmetData.cooldown || 30,
                    comboMultiplier: helmetData.comboMultiplier || 1.2,
                    element: helmetData.element || null,
                    special: helmetData.special || null,
                    color: helmetData.color || '#FF0000',
                    particleColor: helmetData.particleColor || helmetData.color,
                    meshUrl: helmetData.meshUrl || null,
                    custom: helmetData.custom || {}
                };
                
                this.helmetLibrary.set(helmet.id, helmet);
                console.log(`🪖 Registered: ${helmet.name}`);
                return helmet;
            }
            
            equipToSlot(helmetId, slot) {
                if (slot < 0 || slot > 8) return false;
                
                const helmet = this.helmetLibrary.get(helmetId);
                if (!helmet) return false;
                
                this.equippedHelmets[slot] = helmet;
                console.log(`🪖 Equipped ${helmet.name} to slot ${slot + 1}`);
                
                if (this.getCurrentHelmet() === null) {
                    this.switchToSlot(slot);
                }
                
                return true;
            }
            
            switchToSlot(slot) {
                if (slot < 0 || slot > 8) return false;
                
                const helmet = this.equippedHelmets[slot];
                if (!helmet) return false;
                
                this.currentSlot = slot;
                this.updateHelmetVisual(helmet);
                
                console.log(`🪖 Switched to ${helmet.name}`);
                return true;
            }
            
            getCurrentHelmet() {
                return this.equippedHelmets[this.currentSlot];
            }
            
            updateHelmetVisual(helmet) {
                if (this.currentHelmetMesh) {
                    this.currentHelmetMesh.dispose();
                    this.currentHelmetMesh = null;
                }
                
                if (!this.player || !this.player.root) return;
                
                this.currentHelmetMesh = BABYLON.MeshBuilder.CreateSphere(
                    "helmet",
                    { diameter: 1.2 },
                    this.scene
                );
                
                const mat = new BABYLON.StandardMaterial("helmetMat", this.scene);
                mat.diffuseColor = BABYLON.Color3.FromHexString(helmet.color);
                mat.emissiveColor = BABYLON.Color3.FromHexString(helmet.color).scale(0.3);
                this.currentHelmetMesh.material = mat;
                
                this.currentHelmetMesh.parent = this.player.root;
                this.currentHelmetMesh.position = new BABYLON.Vector3(0, 1.5, 0);
            }
            
            update(deltaTime) {
                if (this.attackCooldown > 0) {
                    this.attackCooldown -= deltaTime * 60;
                    if (this.attackCooldown < 0) {
                        this.attackCooldown = 0;
                        this.isAttacking = false;
                    }
                }
                
                if (this.comboTimer > 0) {
                    this.comboTimer -= deltaTime;
                    if (this.comboTimer <= 0) {
                        this.resetCombo();
                    }
                }
            }
            
            attack(targets = []) {
                const helmet = this.getCurrentHelmet();
                if (!helmet || this.attackCooldown > 0) return null;
                
                console.log(`⚔️ Attacking with ${helmet.name}`);
                
                this.isAttacking = true;
                this.attackCooldown = helmet.cooldown;
                
                const baseDamage = helmet.damage;
                const comboDamage = baseDamage * Math.pow(helmet.comboMultiplier, this.comboCount);
                
                const results = this.checkHits(helmet, comboDamage, targets);
                
                if (results.hits > 0) {
                    this.comboCount++;
                    this.comboTimer = 2.0;
                }
                
                if (this.effectsManager) {
                    this.triggerAttackEffects(helmet, results);
                }
                
                if (helmet.special) {
                    helmet.special(this, results);
                }
                
                return results;
            }
            
            checkHits(helmet, damage, targets) {
                const results = { hits: 0, targets: [], damage: damage };
                
                if (!this.player || !this.player.collider) return results;
                
                const playerPos = this.player.collider.position;
                const playerRot = this.player.collider.rotation || new BABYLON.Vector3(0, 0, 0);
                
                const attackDir = new BABYLON.Vector3(
                    Math.sin(playerRot.y),
                    0,
                    Math.cos(playerRot.y)
                );
                
                const range = helmet.range;
                const coneAngle = Math.PI / 3;
                
                targets.forEach(target => {
                    if (!target || !target.position || target.isDead) return;
                    
                    const targetPos = target.position;
                    const toTarget = targetPos.subtract(playerPos);
                    const distance = toTarget.length();
                    
                    if (distance > range) return;
                    
                    const toTargetNorm = toTarget.normalize();
                    const dot = BABYLON.Vector3.Dot(attackDir, toTargetNorm);
                    const angle = Math.acos(Math.max(-1, Math.min(1, dot)));
                    
                    if (angle > coneAngle / 2) return;
                    
                    results.hits++;
                    results.targets.push(target);
                    
                    this.dealDamage(target, damage, helmet);
                    this.applyKnockback(target, attackDir, helmet.knockback);
                });
                
                return results;
            }
            
            dealDamage(target, damage, helmet) {
                if (!target.health) target.health = 100;
                
                target.health -= damage;
                
                console.log(`💥 Dealt ${damage.toFixed(0)} damage! (${target.health.toFixed(0)} HP left)`);
                
                if (target.health <= 0) {
                    target.isDead = true;
                    console.log('💀 Target defeated!');
                    
                    if (this.effectsManager && target.position) {
                        this.effectsManager.createDeathExplosion(
                            target.position,
                            helmet.element,
                            helmet.particleColor
                        );
                    }
                }
            }
            
            applyKnockback(target, direction, force) {
                if (!target.aggregate || !target.aggregate.body) return;
                
                const knockbackForce = direction.scale(force * 100);
                knockbackForce.y = force * 50;
                
                target.aggregate.body.applyImpulse(
                    knockbackForce,
                    target.position
                );
            }
            
            triggerAttackEffects(helmet, results) {
                if (!this.effectsManager || !this.player || !this.player.collider) return;
                
                const playerPos = this.player.collider.position;
                const playerRot = this.player.collider.rotation || new BABYLON.Vector3(0, 0, 0);
                
                const attackDir = new BABYLON.Vector3(
                    Math.sin(playerRot.y),
                    0,
                    Math.cos(playerRot.y)
                );
                
                const attackPos = playerPos.add(attackDir.scale(helmet.range * 0.5));
                
                if (helmet.element) {
                    this.effectsManager.createElementalBurst(
                        attackPos,
                        helmet.element,
                        helmet.particleColor
                    );
                } else {
                    this.effectsManager.createImpactBurst(
                        attackPos,
                        helmet.particleColor
                    );
                }
                
                results.targets.forEach(target => {
                    if (target.position) {
                        this.effectsManager.createHitEffect(
                            target.position,
                            helmet.element,
                            helmet.particleColor
                        );
                    }
                });
            }
            
            resetCombo() {
                if (this.comboCount > 0) {
                    console.log(`🎯 Combo ended at ${this.comboCount}x`);
                }
                this.comboCount = 0;
                this.comboTimer = 0;
            }
            
            getComboInfo() {
                return {
                    count: this.comboCount,
                    timeLeft: this.comboTimer,
                    multiplier: Math.pow(
                        this.getCurrentHelmet()?.comboMultiplier || 1,
                        this.comboCount
                    )
                };
            }
            
            setEffectsManager(manager) {
                this.effectsManager = manager;
            }
            
            getAllHelmets() {
                return Array.from(this.helmetLibrary.values());
            }
        }
        
        // Make globally available
        window.BabylonHelmetSystem = BabylonHelmetSystem;
        console.log('✅ BabylonHelmetSystem loaded');
    </script>
    
    <!-- ============================================ -->
    <!-- SIMPLIFIED EFFECTS MANAGER                  -->
    <!-- ============================================ -->
    <script>
        /**
         * Simplified effects for faster loading
         */
        class HelmetEffectsManager {
            constructor(scene) {
                this.scene = scene;
                console.log('✨ Effects Manager initialized');
            }
            
            createImpactBurst(position, color = '#FFFFFF') {
                const ps = new BABYLON.ParticleSystem("impact", 300, this.scene);
                ps.particleTexture = new BABYLON.Texture(
                    "https://www.babylonjs-playground.com/textures/flare.png",
                    this.scene
                );
                
                ps.emitter = position.clone();
                ps.minEmitBox = new BABYLON.Vector3(0, 0, 0);
                ps.maxEmitBox = new BABYLON.Vector3(0, 0, 0);
                
                const baseColor = BABYLON.Color3.FromHexString(color);
                ps.color1 = new BABYLON.Color4(baseColor.r, baseColor.g, baseColor.b, 1);
                ps.color2 = new BABYLON.Color4(baseColor.r * 0.5, baseColor.g * 0.5, baseColor.b * 0.5, 0.5);
                ps.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                
                ps.minSize = 0.3;
                ps.maxSize = 0.8;
                ps.minLifeTime = 0.2;
                ps.maxLifeTime = 0.5;
                ps.emitRate = 500;
                ps.manualEmitCount = 50;
                ps.minEmitPower = 5;
                ps.maxEmitPower = 15;
                ps.updateSpeed = 0.01;
                ps.direction1 = new BABYLON.Vector3(-1, 0.5, -1);
                ps.direction2 = new BABYLON.Vector3(1, 1, 1);
                ps.gravity = new BABYLON.Vector3(0, -9.81, 0);
                
                ps.start();
                setTimeout(() => {
                    ps.stop();
                    setTimeout(() => ps.dispose(), 1000);
                }, 100);
                
                return ps;
            }
            
            createElementalBurst(position, element, color) {
                return this.createImpactBurst(position, color);
            }
            
            createHitEffect(position, element, color) {
                return this.createImpactBurst(position, color);
            }
            
            createDeathExplosion(position, element, color) {
                return this.createImpactBurst(position, color);
            }
        }
        
        window.HelmetEffectsManager = HelmetEffectsManager;
        console.log('✅ HelmetEffectsManager loaded');
    </script>
    
    <!-- ============================================ -->
    <!-- LOAD LEVEL CONFIG (Regular Script)          -->
    <!-- ============================================ -->
    <script id="levelScript">
        (function() {
            const levelId = window.LEVEL_ID;
            if (levelId) {
                document.getElementById('loading-details').textContent = 
                    `Loading level_${levelId}.js...`;
                
                const script = document.createElement('script');
                script.src = `./level_${levelId}.js`;
                script.onerror = function() {
                    console.error('❌ Failed to load level file!');
                    document.getElementById('loading-text').textContent = 'ERROR!';
                    document.getElementById('loading-details').textContent = 
                        `Cannot find ./levels/level_${levelId}.js`;
                };
                script.onload = function() {
                    console.log(`✅ Level ${levelId} script loaded`);
                    document.getElementById('loading-details').textContent = 
                        'Level config loaded...';
                };
                document.body.appendChild(script);
            }
        })();
    </script>
    
    <!-- ============================================ -->
    <!-- MAIN GAME INITIALIZATION                    -->
    <!-- ============================================ -->
    <script>
        console.log('🎮 APPLESAUCE Starting (Babylon.js)...');
        document.getElementById('loading-details').textContent = 'Game engine loading...';
        
        // Wait for dependencies to load
        async function waitForDependencies() {
            return new Promise((resolve) => {
                const check = setInterval(() => {
                    if (window.BABYLON && window.HavokPhysics && 
                        window.BabylonHelmetSystem && window.HelmetEffectsManager) {
                        clearInterval(check);
                        resolve();
                    }
                }, 100);
            });
        }
        
        // Wait for level config
        function waitForLevel() {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    const levelConfig = getLevelConfig();
                    if (levelConfig) {
                        clearInterval(checkInterval);
                        resolve(levelConfig);
                    }
                }, 100);
                
                setTimeout(() => {
                    clearInterval(checkInterval);
                    resolve(null);
                }, 5000);
            });
        }
        
        // Helper to find level config
        function getLevelConfig() {
            const levelId = window.LEVEL_ID;
            if (!levelId) return null;
            
            const directKey = `Level${levelId}Config`;
            if (window[directKey]) return window[directKey];
            
            const paddedKey = `Level${levelId.padStart(2, '0')}Config`;
            if (window[paddedKey]) return window[paddedKey];
            
            for (let key in window) {
                if (key.startsWith('Level') && key.endsWith('Config')) {
                    const match = key.match(/Level(\d+)Config/);
                    if (match && match[1] == levelId) {
                        return window[key];
                    }
                }
            }
            
            return null;
        }
        
        // Initialize game
        async function initGame() {
            console.log('🎮 Waiting for dependencies...');
            await waitForDependencies();
            
            console.log('🎮 Waiting for level config...');
            const levelConfig = await waitForLevel();
            
            if (!levelConfig) {
                console.error('❌ Level config not found!');
                document.getElementById('loading-text').textContent = 'ERROR!';
                document.getElementById('loading-details').textContent = 
                    `Level ${window.LEVEL_ID} config not loaded`;
                return;
            }
            
            console.log(`✅ Level config found: ${levelConfig.meta.name}`);
            document.getElementById('loading-details').textContent = 
                `Initializing Babylon.js engine...`;
            
            // Create Babylon engine
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                stencil: true
            });
            
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.53, 0.81, 0.92, 1.0);
            
            console.log('✅ Babylon.js engine created');
            document.getElementById('loading-details').textContent = 
                'Loading Havok physics...';
            
            // Initialize Havok
            const havokInstance = await HavokPhysics();
            const havokPlugin = new BABYLON.HavokPlugin(true, havokInstance);
            scene.enablePhysics(
                new BABYLON.Vector3(0, -9.81, 0),
                havokPlugin
            );
            
            console.log('✅ Havok physics enabled');
            
            // Create simple game wrapper
            const game = {
                engine: engine,
                scene: scene,
                havokPlugin: havokPlugin,
                canvas: canvas,
                state: {
                    score: 0,
                    combo: 0,
                    speed: 0,
                    kills: 0,
                    isPlaying: false
                },
                keys: {},
                player: null,
                modules: {},
                
                start() {
                    this.state.isPlaying = true;
                    this.engine.runRenderLoop(() => {
                        if (this.levelConfig && this.levelConfig.onUpdate) {
                            this.levelConfig.onUpdate(this);
                        }
                        this.scene.render();
                    });
                    console.log('✅ Game loop started');
                },
                
                loadLevel(config) {
                    this.levelConfig = config;
                    if (config.onLevelStart) {
                        config.onLevelStart(this);
                    }
                },
                
                getDeltaTime() {
                    return this.engine.getDeltaTime() / 1000;
                }
            };
            
            // Setup input
            scene.onKeyboardObservable.add((kbInfo) => {
                const key = kbInfo.event.key.toLowerCase();
                if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
                    game.keys[key] = true;
                } else if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYUP) {
                    game.keys[key] = false;
                }
            });
            
            // Resize handler
            window.addEventListener('resize', () => {
                engine.resize();
            });
            
            console.log('✅ Game wrapper created');
            document.getElementById('loading-details').textContent = 
                `Loading ${levelConfig.meta.name}...`;
            
            // Load level
            setTimeout(() => {
                console.log('🎮 Loading level...');
                game.loadLevel(levelConfig);
                
                // Start game
                console.log('🎬 Starting animation loop...');
                game.start();
                
                // Hide loading screen
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    console.log('✅ Level loaded! Game started!');
                }, 500);
            }, 100);
            
            // Make game accessible globally
            window.game = game;
            
            // ESC to return to menu
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (confirm('Return to menu?')) {
                        window.location.href = 'index.html';
                    }
                }
            });
        }
        
        // Start when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGame);
        } else {
            initGame();
        }
    </script>
</body>
</html>
