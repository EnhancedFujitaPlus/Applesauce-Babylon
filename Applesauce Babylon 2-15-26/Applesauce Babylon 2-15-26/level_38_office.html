<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - OFFICE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 100;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }
        
        #score {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        #combo {
            font-size: 32px;
            color: #FF1493;
            margin-bottom: 10px;
        }
        
        #trick {
            font-size: 28px;
            color: #00FF00;
            margin-bottom: 10px;
            min-height: 35px;
        }
        
        #speed {
            font-size: 24px;
            color: #00FFFF;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }
        
        #title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
            pointer-events: none;
        }
        
        #title h1 {
            font-size: 72px;
            color: #FFD700;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
        
        #title p {
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }
        
        .fade-out {
            animation: fadeOut 2s forwards;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="title">
        <h1>APPLESAUCE</h1>
        <p>Level 5: CORPORATE CHAOS</p>
        <p style="font-size: 16px; margin-top: 10px; color: #00FFFF;">📋 OFFICE EDITION 📋</p>
    </div>
    
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="combo">COMBO: 0x</div>
        <div id="trick"></div>
        <div id="speed">SPEED: 0</div>
    </div>
    
    <div id="controls">
        <strong>CONTROLS:</strong><br>
        WASD/Arrows - Move<br>
        SPACE - Ollie<br>
        Q - Kickflip | E - Heelflip<br>
        Grind rails & desks!<br>
        Click to lock mouse
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================
        // SCENE SETUP (Don't touch unless you know what you're doing)
        // ============================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 100, 400);
        scene.background = new THREE.Color(0x87CEEB);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        setTimeout(() => {
            document.getElementById('title').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('title').style.display = 'none';
            }, 2000);
        }, 3000);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const sun = new THREE.DirectionalLight(0xffffff, 0.5);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        sun.shadow.camera.left = -100;
        sun.shadow.camera.right = 100;
        sun.shadow.camera.top = 100;
        sun.shadow.camera.bottom = -100;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);
        
        // ============================================
        // MATERIALS LIBRARY
        // Copy these color codes for your props!
        // ============================================
            // Floor & Walls
            const COLORS = {
    // Cul-de-sac colors
            ASPHALT: 0x2a2a2a,
            GRASS: 0x2d5a2d,
            SIDEWALK: 0xCCCCCC,
            HOUSE_BRICK: 0x8B4513,
            HOUSE_SIDING: 0xE8E8E8,
            ROOF: 0x404040,
            DRIVEWAY: 0x404040,
            GARAGE_DOOR: 0xFFFFFF,
            MAILBOX: 0x0000FF,
    // etc.
};
        
        // Material presets
        const MATERIALS = {
            carpet: new THREE.MeshLambertMaterial({ color: COLORS.CARPET }),
            wall: new THREE.MeshLambertMaterial({ color: COLORS.WALL }),
            deskWood: new THREE.MeshLambertMaterial({ color: COLORS.DESK_WOOD }),
            deskWhite: new THREE.MeshLambertMaterial({ color: COLORS.DESK_WHITE }),
            metal: new THREE.MeshStandardMaterial({ color: COLORS.METAL, metalness: 0.8, roughness: 0.2 }),
            glass: new THREE.MeshPhongMaterial({ color: COLORS.GLASS, transparent: true, opacity: 0.3 }),
            plant: new THREE.MeshLambertMaterial({ color: COLORS.PLANT_LEAVES }),
            computer: new THREE.MeshLambertMaterial({ color: COLORS.COMPUTER })
        };
        
        // Grindable obstacles array
        const obstacles = [];
        
        // ============================================
        // PROP CREATION FUNCTIONS
        // Use these to build your office!
        // ============================================
        
        /**
         * Creates a desk
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} rotation - Rotation in radians (0, Math.PI/2, Math.PI, etc.)
         * @param {string} type - 'wood', 'white', or 'black'
         */
        function createDesk(x, z, rotation = 0, type = 'wood') {
            const desk = new THREE.Group();
            
            // Choose material based on type
            let topMaterial;
            if (type === 'wood') topMaterial = MATERIALS.deskWood;
            else if (type === 'white') topMaterial = MATERIALS.deskWhite;
            else topMaterial = new THREE.MeshLambertMaterial({ color: COLORS.DESK_BLACK });
            
            // Desktop (grindable!)
            const topGeo = new THREE.BoxGeometry(3, 0.1, 1.5);
            const top = new THREE.Mesh(topGeo, topMaterial);
            top.position.y = 1.5;
            top.castShadow = true;
            top.receiveShadow = true;
            desk.add(top);
            
            // Add to grindable obstacles
            obstacles.push({ mesh: top, type: 'desk', parent: desk });
            
            // Legs
            const legPositions = [
                [-1.3, 0.75, -0.6],
                [1.3, 0.75, -0.6],
                [-1.3, 0.75, 0.6],
                [1.3, 0.75, 0.6]
            ];
            
            legPositions.forEach(pos => {
                const legGeo = new THREE.BoxGeometry(0.1, 1.5, 0.1);
                const leg = new THREE.Mesh(legGeo, topMaterial);
                leg.position.set(...pos);
                leg.castShadow = true;
                desk.add(leg);
            });
            
            desk.position.set(x, 0, z);
            desk.rotation.y = rotation;
            scene.add(desk);
            return desk;
        }
        
        /**
         * Creates an office chair
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} rotation - Rotation in radians
         * @param {number} color - Hex color (use COLORS.CHAIR_* presets)
         */
        function createChair(x, z, rotation = 0, color = COLORS.CHAIR_BLACK) {
            const chair = new THREE.Group();
            const chairMat = new THREE.MeshLambertMaterial({ color: color });
            
            // Seat
            const seatGeo = new THREE.BoxGeometry(0.8, 0.1, 0.8);
            const seat = new THREE.Mesh(seatGeo, chairMat);
            seat.position.y = 0.8;
            seat.castShadow = true;
            chair.add(seat);
            
            // Backrest
            const backGeo = new THREE.BoxGeometry(0.8, 1, 0.1);
            const back = new THREE.Mesh(backGeo, chairMat);
            back.position.set(0, 1.3, -0.35);
            back.castShadow = true;
            chair.add(back);
            
            // Base (5-star)
            const baseGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 8);
            const base = new THREE.Mesh(baseGeo, MATERIALS.metal);
            base.position.y = 0.3;
            base.castShadow = true;
            chair.add(base);
            
            // Wheels (just 5 small spheres)
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const wheelGeo = new THREE.SphereGeometry(0.08, 8, 8);
                const wheel = new THREE.Mesh(wheelGeo, MATERIALS.metal);
                wheel.position.set(Math.cos(angle) * 0.35, 0.08, Math.sin(angle) * 0.35);
                wheel.castShadow = true;
                chair.add(wheel);
            }
            
            chair.position.set(x, 0, z);
            chair.rotation.y = rotation;
            scene.add(chair);
            return chair;
        }
        
        /**
         * Creates a computer setup (monitor + keyboard)
         * @param {number} x - X position
         * @param {number} y - Y position (usually 1.55 to sit on desk)
         * @param {number} z - Z position
         * @param {number} rotation - Rotation in radians
         */
        function createComputer(x, y, z, rotation = 0) {
            const computer = new THREE.Group();
            
            // Monitor
            const monitorGeo = new THREE.BoxGeometry(0.8, 0.5, 0.05);
            const monitor = new THREE.Mesh(monitorGeo, MATERIALS.computer);
            monitor.position.y = 0.3;
            monitor.castShadow = true;
            computer.add(monitor);
            
            // Screen (slightly glowing)
            const screenGeo = new THREE.BoxGeometry(0.75, 0.45, 0.02);
            const screenMat = new THREE.MeshBasicMaterial({ color: 0x4A90E2 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 0.3, 0.03);
            computer.add(screen);
            
            // Monitor stand
            const standGeo = new THREE.BoxGeometry(0.2, 0.3, 0.15);
            const stand = new THREE.Mesh(standGeo, MATERIALS.computer);
            stand.position.y = 0.15;
            stand.castShadow = true;
            computer.add(stand);
            
            // Keyboard
            const keyboardGeo = new THREE.BoxGeometry(0.6, 0.03, 0.3);
            const keyboard = new THREE.Mesh(keyboardGeo, new THREE.MeshLambertMaterial({ color: COLORS.KEYBOARD }));
            keyboard.position.set(0, 0.015, 0.4);
            keyboard.castShadow = true;
            computer.add(keyboard);
            
            computer.position.set(x, y, z);
            computer.rotation.y = rotation;
            scene.add(computer);
            return computer;
        }
        
        /**
         * Creates a filing cabinet
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} rotation - Rotation in radians
         * @param {number} color - Hex color
         */
        function createFilingCabinet(x, z, rotation = 0, color = COLORS.METAL) {
            const cabinet = new THREE.Group();
            const cabinetMat = new THREE.MeshLambertMaterial({ color: color });
            
            // Main body
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.5, 0.6);
            const body = new THREE.Mesh(bodyGeo, cabinetMat);
            body.position.y = 0.75;
            body.castShadow = true;
            body.receiveShadow = true;
            cabinet.add(body);
            
            // Drawer handles (3 drawers)
            for (let i = 0; i < 3; i++) {
                const handleGeo = new THREE.BoxGeometry(0.2, 0.05, 0.05);
                const handle = new THREE.Mesh(handleGeo, MATERIALS.metal);
                handle.position.set(0, 0.25 + i * 0.5, 0.31);
                handle.castShadow = true;
                cabinet.add(handle);
            }
            
            cabinet.position.set(x, 0, z);
            cabinet.rotation.y = rotation;
            scene.add(cabinet);
            return cabinet;
        }
        
        /**
         * Creates a potted plant
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} size - Size multiplier (0.5 to 2.0)
         */
        function createPlant(x, z, size = 1) {
            const plant = new THREE.Group();
            
            // Pot
            const potGeo = new THREE.CylinderGeometry(0.2 * size, 0.15 * size, 0.3 * size, 8);
            const potMat = new THREE.MeshLambertMaterial({ color: COLORS.PLANT_POT });
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.y = 0.15 * size;
            pot.castShadow = true;
            plant.add(pot);
            
            // Leaves (simple spheres)
            for (let i = 0; i < 5; i++) {
                const leafGeo = new THREE.SphereGeometry(0.15 * size, 8, 8);
                const leaf = new THREE.Mesh(leafGeo, MATERIALS.plant);
                leaf.position.set(
                    (Math.random() - 0.5) * 0.3 * size,
                    0.3 * size + Math.random() * 0.3 * size,
                    (Math.random() - 0.5) * 0.3 * size
                );
                leaf.castShadow = true;
                plant.add(leaf);
            }
            
            plant.position.set(x, 0, z);
            scene.add(plant);
            return plant;
        }
        
        /**
         * Creates a cubicle wall (grindable top rail!)
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} width - Width of wall
         * @param {number} rotation - Rotation in radians
         */
        function createCubicleWall(x, z, width, rotation = 0) {
            const cubicle = new THREE.Group();
            
            // Main panel
            const panelGeo = new THREE.BoxGeometry(width, 1.2, 0.05);
            const panelMat = new THREE.MeshLambertMaterial({ color: 0xD3D3D3 });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            panel.position.y = 0.6;
            panel.castShadow = true;
            panel.receiveShadow = true;
            cubicle.add(panel);
            
            // Top rail (grindable!)
            const railGeo = new THREE.BoxGeometry(width, 0.1, 0.15);
            const rail = new THREE.Mesh(railGeo, MATERIALS.metal);
            rail.position.y = 1.2;
            rail.castShadow = true;
            cubicle.add(rail);
            
            obstacles.push({ mesh: rail, type: 'rail', parent: cubicle });
            
            cubicle.position.set(x, 0, z);
            cubicle.rotation.y = rotation;
            scene.add(cubicle);
            return cubicle;
        }
        
        /**
         * Creates a water cooler
         * @param {number} x - X position
         * @param {number} z - Z position
         */
        function createWaterCooler(x, z) {
            const cooler = new THREE.Group();
            
            // Base cabinet
            const baseGeo = new THREE.BoxGeometry(0.6, 0.8, 0.5);
            const baseMat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.4;
            base.castShadow = true;
            cooler.add(base);
            
            // Water bottle (upside down)
            const bottleGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.6, 12);
            const bottle = new THREE.Mesh(bottleGeo, MATERIALS.glass);
            bottle.position.y = 1.1;
            bottle.castShadow = true;
            cooler.add(bottle);
            
            // Water inside
            const waterGeo = new THREE.CylinderGeometry(0.23, 0.23, 0.5, 12);
            const waterMat = new THREE.MeshPhongMaterial({ color: 0x4A90E2, transparent: true, opacity: 0.6 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.position.y = 1.05;
            cooler.add(water);
            
            cooler.position.set(x, 0, z);
            scene.add(cooler);
            return cooler;
        }
        
        /**
         * Creates a bookshelf
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} rotation - Rotation in radians
         */
        function createBookshelf(x, z, rotation = 0) {
            const shelf = new THREE.Group();
            const shelfMat = new THREE.MeshLambertMaterial({ color: COLORS.WOOD });
            
            // Back panel
            const backGeo = new THREE.BoxGeometry(2, 3, 0.1);
            const back = new THREE.Mesh(backGeo, shelfMat);
            back.position.set(0, 1.5, -0.45);
            back.castShadow = true;
            back.receiveShadow = true;
            shelf.add(back);
            
            // Shelves (4 levels)
            for (let i = 0; i < 4; i++) {
                const shelfGeo = new THREE.BoxGeometry(2, 0.05, 0.5);
                const shelfMesh = new THREE.Mesh(shelfGeo, shelfMat);
                shelfMesh.position.y = i * 0.8 + 0.4;
                shelfMesh.castShadow = true;
                shelf.add(shelfMesh);
            }
            
            // Sides
            for (let side of [-1, 1]) {
                const sideGeo = new THREE.BoxGeometry(0.05, 3, 0.5);
                const sideMesh = new THREE.Mesh(sideGeo, shelfMat);
                sideMesh.position.set(side * 0.975, 1.5, -0.2);
                sideMesh.castShadow = true;
                shelf.add(sideMesh);
            }
            
            // Add some "books" (colored boxes)
            const bookColors = [0xFF6B6B, 0x4ECDC4, 0xFFE66D, 0x95E1D3];
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 6; j++) {
                    const bookGeo = new THREE.BoxGeometry(0.05 + Math.random() * 0.1, 0.6, 0.3);
                    const bookMat = new THREE.MeshLambertMaterial({ 
                        color: bookColors[Math.floor(Math.random() * bookColors.length)]
                    });
                    const book = new THREE.Mesh(bookGeo, bookMat);
                    book.position.set(
                        -0.9 + j * 0.3,
                        i * 0.8 + 0.7,
                        -0.2
                    );
                    book.castShadow = true;
                    shelf.add(book);
                }
            }
            
            shelf.position.set(x, 0, z);
            shelf.rotation.y = rotation;
            scene.add(shelf);
            return shelf;
        }
        
        /**
         * Creates a conference table (long, grindable!)
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} rotation - Rotation in radians
         */
        function createConferenceTable(x, z, rotation = 0) {
            const table = new THREE.Group();
            
            // Tabletop (grindable!)
            const topGeo = new THREE.BoxGeometry(6, 0.1, 2.5);
            const top = new THREE.Mesh(topGeo, MATERIALS.deskWood);
            top.position.y = 1.5;
            top.castShadow = true;
            top.receiveShadow = true;
            table.add(top);
            
            obstacles.push({ mesh: top, type: 'table', parent: table });
            
            // Legs (6 legs for long table)
            for (let i = 0; i < 3; i++) {
                for (let side of [-1, 1]) {
                    const legGeo = new THREE.BoxGeometry(0.15, 1.5, 0.15);
                    const leg = new THREE.Mesh(legGeo, MATERIALS.deskWood);
                    leg.position.set(-2.5 + i * 2.5, 0.75, side * 1);
                    leg.castShadow = true;
                    table.add(leg);
                }
            }
            
            table.position.set(x, 0, z);
            table.rotation.y = rotation;
            scene.add(table);
            return table;
        }
        
        /**
         * Creates a whiteboard on wall
         * @param {number} x - X position
         * @param {number} z - Z position
         * @param {number} rotation - Rotation in radians
         */
        function createWhiteboard(x, z, rotation = 0) {
            const board = new THREE.Group();
            
            // Board surface
            const boardGeo = new THREE.BoxGeometry(3, 1.5, 0.05);
            const boardMat = new THREE.MeshLambertMaterial({ color: COLORS.WHITEBOARD });
            const boardMesh = new THREE.Mesh(boardGeo, boardMat);
            boardMesh.position.y = 2.5;
            boardMesh.castShadow = true;
            board.add(boardMesh);
            
            // Frame
            const frameMat = MATERIALS.metal;
            const frameThickness = 0.05;
            
            // Top/bottom frame
            for (let y of [3.25, 1.75]) {
                const frameGeo = new THREE.BoxGeometry(3.1, frameThickness, 0.08);
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.position.y = y;
                board.add(frame);
            }
            
            // Side frames
            for (let x of [-1.525, 1.525]) {
                const frameGeo = new THREE.BoxGeometry(frameThickness, 1.5, 0.08);
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.position.set(x, 2.5, 0);
                board.add(frame);
            }
            
            board.position.set(x, 0, z);
            board.rotation.y = rotation;
            scene.add(board);
            return board;
        }

        function createRoom({
        x = 0,
        z = 0,
        width = 10,
        depth = 10,
        height = 4,
        open = {}
        }) {

        const halfW = width / 2;
        const halfD = depth / 2;
        const t = 0.2;

        // Floor
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(width, depth),
            MATERIALS.carpet
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(x, 0, z);
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(
            new THREE.PlaneGeometry(width, depth),
            MATERIALS.ceiling
        );
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(x, height, z);
        scene.add(ceiling);

        // Walls
        if (!open.north) {
            const wall = new THREE.Mesh(
            new THREE.BoxGeometry(width, height, t),
            MATERIALS.wall
            );
            wall.position.set(x, height / 2, z - halfD);
            scene.add(wall);
        }

        if (!open.south) {
            const wall = new THREE.Mesh(
            new THREE.BoxGeometry(width, height, t),
            MATERIALS.wall
            );
            wall.position.set(x, height / 2, z + halfD);
            scene.add(wall);
        }

        if (!open.east) {
            const wall = new THREE.Mesh(
            new THREE.BoxGeometry(t, height, depth),
            MATERIALS.wall
            );
            wall.position.set(x + halfW, height / 2, z);
            scene.add(wall);
        }

        if (!open.west) {
            const wall = new THREE.Mesh(
            new THREE.BoxGeometry(t, height, depth),
            MATERIALS.wall
            );
            wall.position.set(x - halfW, height / 2, z);
            scene.add(wall);
        }
        }

        
        // ============================================
        // LEVEL LAYOUT SECTION
        // 🎨 THIS IS WHERE YOU BUILD YOUR OFFICE! 🎨
        // ============================================
        
        // FLOOR
        const floorSize = 1000;
        const floorGeo = new THREE.PlaneGeometry(floorSize, floorSize);
        const floor = new THREE.Mesh(floorGeo, MATERIALS.carpet);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // WALLS (Perimeter walls)
        const wallHeight = 4;
        const wallThickness = 0.2;
        
        // North wall
        const northWallGeo = new THREE.BoxGeometry(floorSize, wallHeight, wallThickness);
        const northWall = new THREE.Mesh(northWallGeo, MATERIALS.wall);
        northWall.position.set(0, wallHeight / 2, -floorSize / 2);
        northWall.castShadow = true;
        northWall.receiveShadow = true;
        scene.add(northWall);
        
        // South wall
        const southWall = new THREE.Mesh(northWallGeo, MATERIALS.wall);
        southWall.position.set(0, wallHeight / 2, floorSize / 2);
        southWall.castShadow = true;
        southWall.receiveShadow = true;
        scene.add(southWall);
        
        // East wall
        const eastWallGeo = new THREE.BoxGeometry(wallThickness, wallHeight, floorSize);
        const eastWall = new THREE.Mesh(eastWallGeo, MATERIALS.wall);
        eastWall.position.set(floorSize / 2, wallHeight / 2, 0);
        eastWall.castShadow = true;
        eastWall.receiveShadow = true;
        scene.add(eastWall);
        
        // West wall
        const westWall = new THREE.Mesh(eastWallGeo, MATERIALS.wall);
        westWall.position.set(-floorSize / 2, wallHeight / 2, 0);
        westWall.castShadow = true;
        westWall.receiveShadow = true;
        scene.add(westWall);
        
        // CEILING
        const ceilingGeo = new THREE.PlaneGeometry(floorSize, floorSize);
        const ceilingMat = new THREE.MeshLambertMaterial({ color: COLORS.CEILING });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = wallHeight;
        ceiling.receiveShadow = true;
        scene.add(ceiling);
        
        // ============================================
        // 🏢 START BUILDING YOUR OFFICE HERE! 🏢
        // ============================================
        
        // EXAMPLE: Reception area with desk
        createDesk(-40, -40, 0, 'white');
        createComputer(-40, 1.55, -40.5, 0);
        createChair(-40, -38.5, Math.PI, COLORS.CHAIR_BLUE);
        
        // EXAMPLE: Conference room
        createConferenceTable(0, -30, 0);
        // Add chairs around the table
        for (let i = 0; i < 5; i++) {
            createChair(-12 + i * 3, -32, 0, COLORS.CHAIR_BLACK);
            createChair(-12 + i * 3, -28, Math.PI, COLORS.CHAIR_BLACK);
        }
        
        // EXAMPLE: Cubicle farm (3x3 grid)
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
                const baseX = -20 + col * 8;
                const baseZ = 0 + row * 8;
                
                // Desk
                createDesk(baseX, baseZ, 0, 'wood');
                createComputer(baseX, 1.55, baseZ - 0.5, 0);
                createChair(baseX, baseZ + 1.2, Math.PI, COLORS.CHAIR_GREY);
                
                // Cubicle walls (L-shape)
                createCubicleWall(baseX - 3, baseZ, 1.5, Math.PI / 2);
                createCubicleWall(baseX - 0.75, baseZ - 2.5, 6, 0);
            }
        }
        
        // EXAMPLE: Manager's office
        createDesk(35, -35, Math.PI / 2, 'black');
        createComputer(35.5, 1.55, -35, Math.PI / 2);
        createChair(33.5, -35, Math.PI / 2, COLORS.CHAIR_RED);
        createBookshelf(38, -35, Math.PI / 2);
        createPlant(32, -38, 1.2);
        
        // EXAMPLE: Break room area
        createWaterCooler(25, 20);
        createFilingCabinet(28, 20, 0, COLORS.METAL);
        createFilingCabinet(30, 20, 0, COLORS.METAL);
        
        // EXAMPLE: Some random plants for decoration
        createPlant(-35, 20, 0.8);
        createPlant(15, -20, 1);
        createPlant(-10, 30, 0.7);
        
        // EXAMPLE: Whiteboards on walls
        createWhiteboard(0, -49.8, 0);  // North wall
        createWhiteboard(-30, 49.8, Math.PI);  // South wall
        
        // ============================================
        // 📝 HOW TO ADD MORE PROPS:
        // ============================================
        // 1. Copy one of the function calls above
        // 2. Change the X and Z positions (first two numbers)
        // 3. Adjust rotation: 0, Math.PI/2, Math.PI, -Math.PI/2
        // 4. Change colors using COLORS.* presets
        //
        // EXAMPLES TO TRY:
        //
        // Add a desk at position (10, 15):
        // createDesk(10, 15, 0, 'white');
        //
        // Add a computer on that desk:
        // createComputer(10, 1.55, 14.5, 0);
        //
        // Add a chair behind it:
        // createChair(10, 16.5, Math.PI, COLORS.CHAIR_BLUE);
        //
        // Add a plant in the corner:
        // createPlant(-45, -45, 1.5);
        //
        // Add a filing cabinet:
        // createFilingCabinet(20, 10, Math.PI/2, COLORS.METAL);
        //
        // ROTATION GUIDE:
        // 0 = Facing +Z (down)
        // Math.PI/2 = Facing -X (left)
        // Math.PI = Facing -Z (up)
        // -Math.PI/2 = Facing +X (right)
        // ============================================
        
        // Player setup
        const player = new THREE.Group();
        player.castShadow = true;
        
        const deckGeo = new THREE.BoxGeometry(0.8, 0.1, 2.5);
        const deckMat = new THREE.MeshLambertMaterial({ color: 0xFF1493 });
        const deck = new THREE.Mesh(deckGeo, deckMat);
        deck.position.y = 0.3;
        deck.castShadow = true;
        deck.receiveShadow = true;
        player.add(deck);
        
        for (let pos of [[-0.3, 0.15, -0.8], [0.3, 0.15, -0.8], [-0.3, 0.15, 0.8], [0.3, 0.15, 0.8]]) {
            const wheelGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 12);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x000000 });
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(...pos);
            wheel.rotation.z = Math.PI / 2;
            wheel.castShadow = true;
            player.add(wheel);
        }
        
        const bodyGeo = new THREE.BoxGeometry(0.6, 1.2, 0.4);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.set(0, 1.2, -0.2);
        body.castShadow = true;
        player.add(body);
        
        const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const headMat = new THREE.MeshLambertMaterial({ color: 0xFFDBAC });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(0, 2.1, -0.2);
        head.castShadow = true;
        player.add(head);
        
        for (let side of [-1, 1]) {
            const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
            const arm = new THREE.Mesh(armGeo, bodyMat);
            arm.position.set(side * 0.4, 1.2, -0.2);
            arm.castShadow = true;
            player.add(arm);
        }
        
        player.position.set(0, 0.5, 40);
        scene.add(player);
        
        // Game state
        const state = {
            speed: 0,
            maxSpeed: 1.0,
            acceleration: 0.025,
            friction: 0.98,
            turnSpeed: 0.03,
            rotation: 0,
            jumping: false,
            jumpVelocity: 0,
            gravity: -0.025,
            grounded: true,
            grinding: false,
            currentRail: null,
            score: 0,
            combo: 0,
            comboTimer: 0,
            currentTrick: '',
            trickTimer: 0,
            canTrick: true,
            spinning: false,
            spinRotation: 0
        };
        
        const keys = {};
        
        // Controls
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === ' ') {
                if (state.grinding) {
                    state.grinding = false;
                    state.currentRail = null;
                    state.jumpVelocity = 0.35;
                    state.jumping = true;
                    state.grounded = false;
                    state.canTrick = true;
                } else if (state.grounded && !state.jumping) {
                    state.jumping = true;
                    state.jumpVelocity = 0.35;
                    state.grounded = false;
                    state.canTrick = true;
                }
            }
            
            if (!state.grounded && state.canTrick) {
                if (e.key.toLowerCase() === 'q') {
                    state.currentTrick = 'KICKFLIP!';
                    state.spinning = true;
                    state.spinRotation = 0;
                    state.combo++;
                    state.trickTimer = 60;
                    state.canTrick = false;
                    state.score += 100;
                }
                if (e.key.toLowerCase() === 'e') {
                    state.currentTrick = 'HEELFLIP!';
                    state.spinning = true;
                    state.spinRotation = 0;
                    state.combo++;
                    state.trickTimer = 60;
                    state.canTrick = false;
                    state.score += 100;
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                state.rotation -= e.movementX * 0.002;
            }
        });
        
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        
        function checkGrinding() {
            if (state.grounded) {
                if (state.grinding) {
                    state.grinding = false;
                    state.currentRail = null;
                }
                return;
            }
            
            if (state.jumpVelocity > 0.05) return;
            
            for (let obstacle of obstacles) {
                const worldPos = new THREE.Vector3();
                obstacle.mesh.getWorldPosition(worldPos);
                
                const dx = player.position.x - worldPos.x;
                const dz = player.position.z - worldPos.z;
                const horizontalDist = Math.sqrt(dx * dx + dz * dz);
                const dy = player.position.y - worldPos.y;
                
                if (horizontalDist < 3 && Math.abs(dy) < 1.5) {
                    state.grinding = true;
                    state.currentRail = obstacle.mesh;
                    state.jumpVelocity = 0;
                    player.position.y = worldPos.y + 0.1;
                    
                    if (state.combo === 0) {
                        state.combo = 1;
                    }
                    
                    if (obstacle.type === 'desk') {
                        state.currentTrick = 'DESK GRIND!';
                    } else if (obstacle.type === 'table') {
                        state.currentTrick = 'TABLE SLIDE!';
                    } else {
                        state.currentTrick = '50-50 GRIND!';
                    }
                    state.trickTimer = 10;
                    return;
                }
            }
        }
        
        function update() {
            // Movement
            if (keys['w'] || keys['arrowup']) {
                state.speed = Math.min(state.speed + state.acceleration, state.maxSpeed);
            }
            if (keys['s'] || keys['arrowdown']) {
                state.speed = Math.max(state.speed - state.acceleration, -state.maxSpeed * 0.5);
            }
            
            if (keys['a'] || keys['arrowleft']) {
                state.rotation += state.turnSpeed;
            }
            if (keys['d'] || keys['arrowright']) {
                state.rotation -= state.turnSpeed;
            }
            
            state.speed *= state.friction;
            
            const forward = new THREE.Vector3(
                Math.sin(state.rotation),
                0,
                Math.cos(state.rotation)
            );
            
            player.position.x += forward.x * state.speed;
            player.position.z += forward.z * state.speed;
            player.rotation.y = state.rotation;
            
            // Keep player in bounds
            const boundary = 480;
            player.position.x = Math.max(-boundary, Math.min(boundary, player.position.x));
            player.position.z = Math.max(-boundary, Math.min(boundary, player.position.z));
            
            // Jumping
            if (state.jumping || state.grinding) {
                if (!state.grinding) {
                    player.position.y += state.jumpVelocity;
                    state.jumpVelocity += state.gravity;
                }
                
                const groundLevel = 0.5;
                
                if (player.position.y <= groundLevel && !state.grinding) {
                    player.position.y = groundLevel;
                    state.jumping = false;
                    state.jumpVelocity = 0;
                    state.grounded = true;
                    
                    if (state.combo > 0) {
                        const comboScore = state.combo * 100;
                        state.score += comboScore;
                        state.comboTimer = 120;
                    }
                    
                    if (state.spinning && Math.abs(state.spinRotation % (Math.PI * 2)) > 0.5) {
                        state.combo = 0;
                        state.currentTrick = 'BAILED!';
                        state.trickTimer = 60;
                    }
                    
                    state.spinning = false;
                    state.spinRotation = 0;
                    deck.rotation.x = 0;
                }
            } else {
                player.position.y = 0.5;
            }
            
            if (state.spinning) {
                state.spinRotation += 0.3;
                deck.rotation.x = state.spinRotation;
            }
            
            checkGrinding();
            
            if (state.grinding) {
                state.score += 5;
                state.combo = Math.max(state.combo, 1);
                state.comboTimer = 10;
                state.grounded = false;
                state.jumping = true;
                
                if (state.currentRail) {
                    const worldPos = new THREE.Vector3();
                    state.currentRail.getWorldPosition(worldPos);
                    const dx = player.position.x - worldPos.x;
                    const dz = player.position.z - worldPos.z;
                    const horizontalDist = Math.sqrt(dx * dx + dz * dz);
                    
                    if (horizontalDist > 4) {
                        state.grinding = false;
                        state.currentRail = null;
                        state.jumpVelocity = -0.1;
                    }
                }
            }
            
            if (state.comboTimer > 0) {
                state.comboTimer--;
                if (state.comboTimer === 0 && state.grounded && !state.grinding) {
                    state.combo = 0;
                }
            }
            
            if (state.trickTimer > 0) {
                state.trickTimer--;
                if (state.trickTimer === 0) {
                    state.currentTrick = '';
                }
            }
            
            // Camera follow
            const cameraOffset = new THREE.Vector3(
                -Math.sin(state.rotation) * 10,
                7,
                -Math.cos(state.rotation) * 10
            );
            
            camera.position.lerp(
                player.position.clone().add(cameraOffset),
                0.1
            );
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0)));
            
            // Update HUD
            document.getElementById('score').textContent = `SCORE: ${Math.floor(state.score)}`;
            document.getElementById('combo').textContent = `COMBO: ${state.combo}x`;
            document.getElementById('trick').textContent = state.currentTrick;
            
            const speedDisplay = Math.floor(Math.abs(state.speed) * 100);
            document.getElementById('speed').textContent = `SPEED: ${speedDisplay}`;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
