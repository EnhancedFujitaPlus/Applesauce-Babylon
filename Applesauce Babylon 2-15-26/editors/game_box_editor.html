<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLESAUCE - Game Box Art Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #87CEEB;
            --secondary: #FFD700;
            --dark: #1a4d6d;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .editor-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Preview Panel (Left) */
        .preview-panel {
            flex: 2;
            position: relative;
            background: #0a0a0a;
            border-right: 3px solid var(--primary);
        }

        #preview-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        #preview-canvas:active {
            cursor: grabbing;
        }

        .preview-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .view-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .view-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        .camera-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            font-size: 0.9em;
            pointer-events: none;
        }

        /* Editor Panel (Right) */
        .editor-panel {
            flex: 1;
            background: #0f0f0f;
            overflow-y: auto;
            padding: 20px;
            border-left: 3px solid var(--primary);
        }

        .editor-header {
            text-align: center;
            font-size: 2.5em;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border: 2px solid var(--dark);
        }

        .section-title {
            font-size: 1.5em;
            color: var(--secondary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--secondary);
            padding-bottom: 5px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 1.1em;
        }

        .color-input-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="color"] {
            width: 60px;
            height: 40px;
            border: 2px solid var(--primary);
            cursor: pointer;
            background: transparent;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
        }

        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            cursor: pointer;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            text-align: center;
        }

        .option-btn:hover {
            background: var(--primary);
            color: #000;
            transform: scale(1.05);
        }

        .option-btn.active {
            background: var(--secondary);
            color: #000;
            border-color: var(--secondary);
        }

        .slider-group {
            margin-top: 15px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: #ccc;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary);
            cursor: pointer;
            border-radius: 50%;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--primary);
            cursor: pointer;
            border-radius: 50%;
        }

        .action-button {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .action-button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        .action-button.danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .action-button.danger:hover {
            background: #ff4444;
            color: #000;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-upload-label {
            display: block;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--secondary);
            color: var(--secondary);
            cursor: pointer;
            text-align: center;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .file-upload-label:hover {
            background: var(--secondary);
            color: #000;
        }

        .image-preview {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--dark);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 20px 30px;
            font-size: 1.2em;
            box-shadow: 0 0 30px var(--primary);
            z-index: 1000;
            opacity: 0;
            transform: translateX(400px);
            transition: all 0.5s ease;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* Scrollbar styling */
        .editor-panel::-webkit-scrollbar {
            width: 10px;
        }

        .editor-panel::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .editor-panel::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        .system-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .system-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            text-align: center;
        }

        .system-btn:hover {
            background: var(--primary);
            color: #000;
        }

        .system-btn.active {
            background: var(--secondary);
            color: #000;
            border-color: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Preview Panel -->
        <div class="preview-panel">
            <canvas id="preview-canvas"></canvas>
            <div class="camera-hint">DRAG TO ROTATE • SCROLL TO ZOOM</div>
            <div class="preview-controls">
                <button class="view-btn" onclick="resetCamera()">RESET VIEW</button>
                <button class="view-btn" onclick="captureScreenshot()">SCREENSHOT</button>
            </div>
        </div>

        <!-- Editor Panel -->
        <div class="editor-panel">
            <h1 class="editor-header">GAME BOX EDITOR</h1>

            <!-- Physical Media Type -->
            <div class="section">
                <div class="section-title">PHYSICAL MEDIA</div>
                
                <div class="control-group">
                    <label class="control-label">Media Type</label>
                    <div class="options-grid">
                        <button class="option-btn active" data-media="standard" onclick="changeMediaType('standard')">STANDARD CASE</button>
                        <button class="option-btn" data-media="jewel" onclick="changeMediaType('jewel')">JEWEL CASE</button>
                        <button class="option-btn" data-media="sleeve" onclick="changeMediaType('sleeve')">CD SLEEVE</button>
                        <button class="option-btn" data-media="disc" onclick="changeMediaType('disc')">DISC ONLY</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Game System</label>
                    <div class="system-grid">
                        <button class="system-btn active" data-system="ps1" onclick="changeSystem('ps1')">PS1</button>
                        <button class="system-btn" data-system="ps2" onclick="changeSystem('ps2')">PS2</button>
                        <button class="system-btn" data-system="ps3" onclick="changeSystem('ps3')">PS3</button>
                        <button class="system-btn" data-system="xbox" onclick="changeSystem('xbox')">XBOX</button>
                        <button class="system-btn" data-system="xbox360" onclick="changeSystem('xbox360')">X360</button>
                        <button class="system-btn" data-system="gamecube" onclick="changeSystem('gamecube')">GAMECUBE</button>
                        <button class="system-btn" data-system="dreamcast" onclick="changeSystem('dreamcast')">DREAMCAST</button>
                        <button class="system-btn" data-system="saturn" onclick="changeSystem('saturn')">SATURN</button>
                        <button class="system-btn" data-system="n64" onclick="changeSystem('n64')">N64</button>
                        <button class="system-btn" data-system="pc" onclick="changeSystem('pc')">PC</button>
                        <button class="system-btn" data-system="generic" onclick="changeSystem('generic')">GENERIC</button>
                        <button class="system-btn" data-system="custom" onclick="changeSystem('custom')">CUSTOM</button>
                    </div>
                </div>
            </div>

            <!-- Artwork Upload -->
            <div class="section">
                <div class="section-title">ARTWORK</div>
                
                <div class="control-group">
                    <label class="control-label">Game Title</label>
                    <input type="text" id="gameTitle" value="APPLESAUCE" onchange="updateBox()">
                </div>

                <div class="control-group">
                    <label class="control-label">Front Cover Art</label>
                    <div class="file-upload">
                        <input type="file" id="frontCover" accept="image/*" onchange="loadImage('front', this)">
                        <label for="frontCover" class="file-upload-label">UPLOAD FRONT</label>
                    </div>
                    <div class="image-preview" id="frontPreview">
                        <span style="color: #666;">No image loaded</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Back Cover Art</label>
                    <div class="file-upload">
                        <input type="file" id="backCover" accept="image/*" onchange="loadImage('back', this)">
                        <label for="backCover" class="file-upload-label">UPLOAD BACK</label>
                    </div>
                    <div class="image-preview" id="backPreview">
                        <span style="color: #666;">No image loaded</span>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Spine Art</label>
                    <div class="file-upload">
                        <input type="file" id="spineArt" accept="image/*" onchange="loadImage('spine', this)">
                        <label for="spineArt" class="file-upload-label">UPLOAD SPINE</label>
                    </div>
                    <div class="image-preview" id="spinePreview">
                        <span style="color: #666;">No image loaded</span>
                    </div>
                </div>

                <div class="control-group" id="discArtSection" style="display: none;">
                    <label class="control-label">Disc Art</label>
                    <div class="file-upload">
                        <input type="file" id="discArt" accept="image/*" onchange="loadImage('disc', this)">
                        <label for="discArt" class="file-upload-label">UPLOAD DISC</label>
                    </div>
                    <div class="image-preview" id="discPreview">
                        <span style="color: #666;">No image loaded</span>
                    </div>
                </div>
            </div>

            <!-- Case Customization -->
            <div class="section">
                <div class="section-title">CASE STYLING</div>
                
                <div class="control-group">
                    <label class="control-label">Case Color</label>
                    <div class="color-input-group">
                        <input type="color" id="caseColor" value="#000000" onchange="updateBox()">
                        <input type="text" id="caseColorText" value="#000000" readonly>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">Case Material</label>
                    <select id="caseMaterial" onchange="updateBox()">
                        <option value="plastic">Plastic</option>
                        <option value="glossy">Glossy Plastic</option>
                        <option value="matte">Matte Plastic</option>
                        <option value="clear">Clear Plastic</option>
                        <option value="tinted">Tinted Clear</option>
                    </select>
                </div>
            </div>

            <!-- Wear & Damage -->
            <div class="section">
                <div class="section-title">WEAR & DAMAGE</div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Overall Wear</span>
                        <span id="wearValue">0%</span>
                    </div>
                    <input type="range" id="wearLevel" min="0" max="100" value="0" oninput="updateDamage()">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Scratches</span>
                        <span id="scratchValue">0%</span>
                    </div>
                    <input type="range" id="scratchLevel" min="0" max="100" value="0" oninput="updateDamage()">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Yellowing</span>
                        <span id="yellowValue">0%</span>
                    </div>
                    <input type="range" id="yellowLevel" min="0" max="100" value="0" oninput="updateDamage()">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Cracks</span>
                        <span id="crackValue">0%</span>
                    </div>
                    <input type="range" id="crackLevel" min="0" max="100" value="0" oninput="updateDamage()">
                </div>
            </div>

            <!-- Actions -->
            <div class="section">
                <div class="section-title">ACTIONS</div>
                <button class="action-button" onclick="saveBox()">💾 SAVE BOX</button>
                <button class="action-button" onclick="loadBox()">📁 LOAD BOX</button>
                <button class="action-button" onclick="exportBox()">📦 EXPORT JSON</button>
                <button class="action-button" onclick="exportTextures()">🖼️ EXPORT TEXTURES</button>
                <button class="action-button" onclick="resetBox()">🔄 RESET</button>
                <button class="action-button danger" onclick="deleteBox()">🗑️ DELETE</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================
        // GLOBAL STATE
        // ============================================
        let scene, camera, renderer;
        let boxGroup = null;
        let currentMediaType = 'standard';
        let currentSystem = 'ps1';
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        const loadedTextures = {
            front: null,
            back: null,
            spine: null,
            disc: null
        };

        const systemLogos = {
            ps1: { text: 'PlayStation', color: '#0070CC' },
            ps2: { text: 'PlayStation 2', color: '#003087' },
            ps3: { text: 'PlayStation 3', color: '#003791' },
            xbox: { text: 'XBOX', color: '#107C10' },
            xbox360: { text: 'XBOX 360', color: '#52B043' },
            gamecube: { text: 'GAMECUBE', color: '#6A5ACD' },
            dreamcast: { text: 'Dreamcast', color: '#FF6600' },
            saturn: { text: 'SEGA SATURN', color: '#0033A0' },
            n64: { text: 'NINTENDO 64', color: '#CC0000' },
            pc: { text: 'PC GAME', color: '#888888' },
            generic: { text: 'VIDEO GAME', color: '#FFFFFF' },
            custom: { text: '', color: '#FFFFFF' }
        };

        // ============================================
        // THREE.JS INITIALIZATION
        // ============================================
        function initThreeJS() {
            const canvas = document.getElementById('preview-canvas');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // Camera
            camera = new THREE.PerspectiveCamera(
                45,
                canvas.clientWidth / canvas.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 3, 8);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                antialias: true,
                alpha: true
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(5, 5, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0x87CEEB, 0.3);
            fillLight.position.set(-3, 2, -3);
            scene.add(fillLight);
            
            const rimLight = new THREE.PointLight(0xFFD700, 0.5);
            rimLight.position.set(0, 5, -5);
            scene.add(rimLight);
            
            // Mouse Controls
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onMouseWheel);
            
            // Start animation
            animate();
        }

        // ============================================
        // MOUSE CONTROLS
        // ============================================
        function onMouseDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onMouseMove(e) {
            if (!isDragging || !boxGroup) return;
            
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            
            boxGroup.rotation.y += deltaX * 0.01;
            boxGroup.rotation.x += deltaY * 0.01;
            
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onMouseUp() {
            isDragging = false;
        }

        function onMouseWheel(e) {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(3, Math.min(15, camera.position.z));
        }

        function resetCamera() {
            camera.position.set(0, 3, 8);
            camera.lookAt(0, 0, 0);
            if (boxGroup) {
                boxGroup.rotation.set(0, 0, 0);
            }
        }

        // ============================================
        // CREATE GAME BOX
        // ============================================
        function createGameBox() {
            if (boxGroup) {
                scene.remove(boxGroup);
            }
            
            boxGroup = new THREE.Group();
            
            const caseColor = new THREE.Color(document.getElementById('caseColor').value);
            const material = document.getElementById('caseMaterial').value;
            
            let caseMaterial;
            switch(material) {
                case 'glossy':
                    caseMaterial = new THREE.MeshPhysicalMaterial({
                        color: caseColor,
                        metalness: 0.1,
                        roughness: 0.1,
                        clearcoat: 1.0,
                        clearcoatRoughness: 0.1
                    });
                    break;
                case 'matte':
                    caseMaterial = new THREE.MeshStandardMaterial({
                        color: caseColor,
                        metalness: 0,
                        roughness: 0.8
                    });
                    break;
                case 'clear':
                    caseMaterial = new THREE.MeshPhysicalMaterial({
                        color: 0xffffff,
                        metalness: 0,
                        roughness: 0.1,
                        transparent: true,
                        opacity: 0.3,
                        transmission: 0.9
                    });
                    break;
                case 'tinted':
                    caseMaterial = new THREE.MeshPhysicalMaterial({
                        color: caseColor,
                        metalness: 0,
                        roughness: 0.1,
                        transparent: true,
                        opacity: 0.5,
                        transmission: 0.7
                    });
                    break;
                default:
                    caseMaterial = new THREE.MeshStandardMaterial({
                        color: caseColor,
                        metalness: 0.1,
                        roughness: 0.4
                    });
            }
            
            switch(currentMediaType) {
                case 'standard':
                    createStandardCase(caseMaterial);
                    break;
                case 'jewel':
                    createJewelCase(caseMaterial);
                    break;
                case 'sleeve':
                    createCDSleeve();
                    break;
                case 'disc':
                    createDiscOnly();
                    break;
            }
            
            scene.add(boxGroup);
        }

        function createStandardCase(caseMaterial) {
            // Standard DVD-style case dimensions
            const width = 3;
            const height = 4.2;
            const depth = 0.35;
            
            // Main case body
            const caseGeometry = new THREE.BoxGeometry(width, height, depth);
            const caseMesh = new THREE.Mesh(caseGeometry, caseMaterial);
            boxGroup.add(caseMesh);
            
            // Front cover
            if (loadedTextures.front) {
                const frontGeometry = new THREE.PlaneGeometry(width - 0.1, height - 0.1);
                const frontMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.front,
                    roughness: 0.3
                });
                const frontMesh = new THREE.Mesh(frontGeometry, frontMaterial);
                frontMesh.position.z = depth / 2 + 0.01;
                boxGroup.add(frontMesh);
            }
            
            // Back cover
            if (loadedTextures.back) {
                const backGeometry = new THREE.PlaneGeometry(width - 0.1, height - 0.1);
                const backMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.back,
                    roughness: 0.3
                });
                const backMesh = new THREE.Mesh(backGeometry, backMaterial);
                backMesh.position.z = -(depth / 2 + 0.01);
                backMesh.rotation.y = Math.PI;
                boxGroup.add(backMesh);
            }
            
            // Spine
            if (loadedTextures.spine) {
                const spineGeometry = new THREE.PlaneGeometry(depth - 0.05, height - 0.1);
                const spineMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.spine,
                    roughness: 0.3
                });
                const spineMesh = new THREE.Mesh(spineGeometry, spineMaterial);
                spineMesh.position.x = -width / 2 - 0.01;
                spineMesh.rotation.y = Math.PI / 2;
                boxGroup.add(spineMesh);
            }
            
            // System logo banner at top
            addSystemBanner(width, height, depth);
        }

        function createJewelCase(caseMaterial) {
            // Jewel case dimensions
            const width = 2.8;
            const height = 2.8;
            const depth = 0.25;
            
            // Main case
            const caseGeometry = new THREE.BoxGeometry(width, height, depth);
            const caseMesh = new THREE.Mesh(caseGeometry, caseMaterial);
            boxGroup.add(caseMesh);
            
            // Front insert
            if (loadedTextures.front) {
                const frontGeometry = new THREE.PlaneGeometry(width - 0.1, height - 0.1);
                const frontMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.front
                });
                const frontMesh = new THREE.Mesh(frontGeometry, frontMaterial);
                frontMesh.position.z = depth / 2 + 0.01;
                boxGroup.add(frontMesh);
            }
            
            // Back insert
            if (loadedTextures.back) {
                const backGeometry = new THREE.PlaneGeometry(width - 0.1, height - 0.1);
                const backMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.back
                });
                const backMesh = new THREE.Mesh(backGeometry, backMaterial);
                backMesh.position.z = -(depth / 2 + 0.01);
                backMesh.rotation.y = Math.PI;
                boxGroup.add(backMesh);
            }
            
            // CD tray (semi-transparent)
            const trayGeometry = new THREE.CylinderGeometry(1.1, 1.1, 0.05, 32);
            const trayMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x333333,
                metalness: 0.2,
                roughness: 0.3,
                transparent: true,
                opacity: 0.6
            });
            const tray = new THREE.Mesh(trayGeometry, trayMaterial);
            tray.rotation.x = Math.PI / 2;
            boxGroup.add(tray);
            
            addSystemBanner(width, height, depth);
        }

        function createCDSleeve() {
            // Paper sleeve
            const width = 3;
            const height = 3;
            const depth = 0.05;
            
            const sleeveGeometry = new THREE.BoxGeometry(width, height, depth);
            const sleeveMaterial = new THREE.MeshStandardMaterial({
                color: 0xf5f5dc,
                roughness: 0.9
            });
            const sleeve = new THREE.Mesh(sleeveGeometry, sleeveMaterial);
            boxGroup.add(sleeve);
            
            // Front
            if (loadedTextures.front) {
                const frontGeometry = new THREE.PlaneGeometry(width - 0.05, height - 0.05);
                const frontMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.front
                });
                const frontMesh = new THREE.Mesh(frontGeometry, frontMaterial);
                frontMesh.position.z = depth / 2 + 0.01;
                boxGroup.add(frontMesh);
            }
            
            // Back
            if (loadedTextures.back) {
                const backGeometry = new THREE.PlaneGeometry(width - 0.05, height - 0.05);
                const backMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.back
                });
                const backMesh = new THREE.Mesh(backGeometry, backMaterial);
                backMesh.position.z = -(depth / 2 + 0.01);
                backMesh.rotation.y = Math.PI;
                boxGroup.add(backMesh);
            }
        }

        function createDiscOnly() {
            // CD/DVD disc
            const discGeometry = new THREE.CylinderGeometry(1.2, 1.2, 0.03, 64);
            const discMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xcccccc,
                metalness: 0.8,
                roughness: 0.2,
                clearcoat: 1.0
            });
            const disc = new THREE.Mesh(discGeometry, discMaterial);
            disc.rotation.x = Math.PI / 2;
            boxGroup.add(disc);
            
            // Center hole
            const holeGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.04, 32);
            const holeMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000
            });
            const hole = new THREE.Mesh(holeGeometry, holeMaterial);
            hole.rotation.x = Math.PI / 2;
            boxGroup.add(hole);
            
            // Disc art
            if (loadedTextures.disc) {
                const artGeometry = new THREE.CircleGeometry(1.15, 64);
                const artMaterial = new THREE.MeshStandardMaterial({
                    map: loadedTextures.disc,
                    transparent: true
                });
                const artMesh = new THREE.Mesh(artGeometry, artMaterial);
                artMesh.position.z = 0.02;
                boxGroup.add(artMesh);
            }
        }

        function addSystemBanner(width, height, depth) {
            const systemData = systemLogos[currentSystem];
            if (!systemData.text) return;
            
            // Create a simple colored banner
            const bannerGeometry = new THREE.PlaneGeometry(width - 0.1, 0.4);
            const bannerMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(systemData.color),
                roughness: 0.3
            });
            const banner = new THREE.Mesh(bannerGeometry, bannerMaterial);
            banner.position.set(0, height / 2 - 0.3, depth / 2 + 0.015);
            boxGroup.add(banner);
        }

        // ============================================
        // IMAGE LOADING
        // ============================================
        function loadImage(type, input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const texture = new THREE.Texture(img);
                    texture.needsUpdate = true;
                    loadedTextures[type] = texture;
                    
                    // Update preview
                    const preview = document.getElementById(type + 'Preview');
                    preview.innerHTML = `<img src="${e.target.result}" alt="${type}">`;
                    
                    createGameBox();
                    showNotification(`${type.toUpperCase()} cover loaded!`);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ============================================
        // MEDIA TYPE & SYSTEM CHANGES
        // ============================================
        function changeMediaType(type) {
            currentMediaType = type;
            
            // Update button states
            document.querySelectorAll('[data-media]').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-media="${type}"]`).classList.add('active');
            
            // Show/hide disc art section
            const discSection = document.getElementById('discArtSection');
            discSection.style.display = (type === 'disc' || type === 'jewel') ? 'block' : 'none';
            
            createGameBox();
        }

        function changeSystem(system) {
            currentSystem = system;
            
            // Update button states
            document.querySelectorAll('[data-system]').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-system="${system}"]`).classList.add('active');
            
            createGameBox();
        }

        // ============================================
        // UPDATE FUNCTIONS
        // ============================================
        function updateBox() {
            document.getElementById('caseColorText').value = document.getElementById('caseColor').value;
            createGameBox();
        }

        function updateDamage() {
            const wear = parseInt(document.getElementById('wearLevel').value);
            const scratches = parseInt(document.getElementById('scratchLevel').value);
            const yellowing = parseInt(document.getElementById('yellowLevel').value);
            const cracks = parseInt(document.getElementById('crackLevel').value);
            
            document.getElementById('wearValue').textContent = wear + '%';
            document.getElementById('scratchValue').textContent = scratches + '%';
            document.getElementById('yellowValue').textContent = yellowing + '%';
            document.getElementById('crackValue').textContent = cracks + '%';
            
            if (!boxGroup) return;
            
            // Apply visual damage effects
            boxGroup.traverse((child) => {
                if (child.isMesh && child.material) {
                    // Yellowing effect
                    if (yellowing > 0) {
                        const yellowTint = new THREE.Color(0xFFFFCC);
                        child.material.color.lerp(yellowTint, yellowing / 300);
                    }
                    
                    // Increase roughness with wear
                    const wearRoughness = (wear + scratches) / 200;
                    if (child.material.roughness !== undefined) {
                        child.material.roughness = Math.min(1, 0.3 + wearRoughness);
                    }
                }
            });
        }

        // ============================================
        // SAVE/LOAD FUNCTIONS
        // ============================================
        function saveBox() {
            const data = getBoxData();
            localStorage.setItem('game_box_data', JSON.stringify(data));
            showNotification('Box Saved!');
        }

        function loadBox() {
            const saved = localStorage.getItem('game_box_data');
            if (saved) {
                applyBoxData(JSON.parse(saved));
                showNotification('Box Loaded!');
            } else {
                showNotification('No saved box found!');
            }
        }

        function exportBox() {
            const data = getBoxData();
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${data.title.replace(/\s+/g, '_')}_box.json`;
            a.click();
            showNotification('Box Exported!');
        }

        function exportTextures() {
            // Export all loaded textures as a zip would require additional library
            // For now, create a simple export of canvas screenshots
            showNotification('Texture export coming soon!');
        }

        function resetBox() {
            if (!confirm('Reset box to default?')) return;
            
            document.getElementById('gameTitle').value = 'APPLESAUCE';
            document.getElementById('caseColor').value = '#000000';
            document.getElementById('caseMaterial').value = 'plastic';
            document.getElementById('wearLevel').value = 0;
            document.getElementById('scratchLevel').value = 0;
            document.getElementById('yellowLevel').value = 0;
            document.getElementById('crackLevel').value = 0;
            
            // Clear textures
            Object.keys(loadedTextures).forEach(key => {
                loadedTextures[key] = null;
            });
            
            // Clear previews
            ['front', 'back', 'spine', 'disc'].forEach(type => {
                const preview = document.getElementById(type + 'Preview');
                preview.innerHTML = '<span style="color: #666;">No image loaded</span>';
            });
            
            changeMediaType('standard');
            changeSystem('ps1');
        }

        function deleteBox() {
            if (!confirm('Delete saved box?')) return;
            
            localStorage.removeItem('game_box_data');
            resetBox();
            showNotification('Box Deleted!');
        }

        function getBoxData() {
            return {
                title: document.getElementById('gameTitle').value,
                timestamp: Date.now(),
                mediaType: currentMediaType,
                system: currentSystem,
                caseColor: document.getElementById('caseColor').value,
                material: document.getElementById('caseMaterial').value,
                damage: {
                    wear: parseInt(document.getElementById('wearLevel').value),
                    scratches: parseInt(document.getElementById('scratchLevel').value),
                    yellowing: parseInt(document.getElementById('yellowLevel').value),
                    cracks: parseInt(document.getElementById('crackLevel').value)
                }
            };
        }

        function applyBoxData(data) {
            document.getElementById('gameTitle').value = data.title;
            document.getElementById('caseColor').value = data.caseColor;
            document.getElementById('caseMaterial').value = data.material;
            document.getElementById('wearLevel').value = data.damage.wear;
            document.getElementById('scratchLevel').value = data.damage.scratches;
            document.getElementById('yellowLevel').value = data.damage.yellowing;
            document.getElementById('crackLevel').value = data.damage.cracks;
            
            changeMediaType(data.mediaType);
            changeSystem(data.system);
            updateDamage();
        }

        function captureScreenshot() {
            const canvas = document.getElementById('preview-canvas');
            const dataURL = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = dataURL;
            a.download = `${document.getElementById('gameTitle').value}_preview.png`;
            a.click();
            showNotification('Screenshot Saved!');
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            
            if (boxGroup && !isDragging) {
                boxGroup.rotation.y += 0.002;
            }
            
            renderer.render(scene, camera);
        }

        // ============================================
        // WINDOW RESIZE
        // ============================================
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('preview-canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        });

        // ============================================
        // INITIALIZE
        // ============================================
        window.addEventListener('load', () => {
            initThreeJS();
            createGameBox();
        });
    </script>
</body>
</html>
